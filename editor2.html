// ── 大注释框 ──────────────────────────────────────────
//
// 按住左键在空白处拖出一块地方，「这堆是我这段时间在弄的」。
// 是**整理**，不是分类 —— 所以它不代表任何结构关系，只是一块地方。
//
// ⚠️ 2026-11-04 改成「真父子」，跟代码块一个模型。
//
// 原来是**平的**：所有框都是 #注释框层 的直接子节点，谁是谁里面的靠
// 「小框的中心落在大框里」现算。省了父子表，但丢掉了 DOM 白送的两样东西：
//   ① 子元素画在父元素上面（浏览器保证）。现算的话「谁在上面」没有答案，
//      只看 append 的先后 —— 先建小框、后建大框，大框就盖住小框，拖不动；
//   ② 事件冒泡天然分层。现算的话父框一开 pointer-events，整块矩形全归它，
//      里面的框每一处都命中父框。
// 表现就是「框里套的框点不中、拖不动」。Unreal 十年没修好的 UE-9417（嵌套
// comment box 选不中/不能改大小）是同一个病，论坛里大家的绕法是「把大框先挪开」。
//
// 现在：子框是父框的**真的 DOM 子节点**，x/y 相对父框（跟「块在容器里」同一套规矩）。
// 附带的好处是拖父框时子框由浏览器带着走，不用再手写「把成员一起挪一遍」。
//
// ⚠️ 跟 Unreal 那套的关键差别：**框不跟着内容自动伸缩**。
//    Unreal 里框不自己长大，一堆人天天手动拖边框；AutoSizeComments 让它自动调，
//    又跟缩放打架（节点尺寸随缩放变，算不准）。这里框是你画多大就多大。

function 元素的位(el) {
  return { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0,
           w: el.offsetWidth, h: el.offsetHeight };
}

function 在框里(框, 位) {
  const 心x = 位.x + 位.w / 2, 心y = 位.y + 位.h / 2;
  return 心x > 框.x && 心x < 框.x + 框.宽 && 心y > 框.y && 心y < 框.y + 框.高;
}

// ── 父子 ──────────────────────────────────────────────
// 子框的 x/y 相对父框，所以要拿它在画布上的真实位置，得沿父链累加。
function 绝对位(框) {
  let x = 框.x || 0, y = 框.y || 0, 父 = 框.父 || '';
  const 见过 = new Set([框.id]);
  while (父) {
    if (见过.has(父)) break;              // 数据坏了成环，别把页面挂死
    见过.add(父);
    const 祖 = (网.注释框们 || []).find(f => f.id === 父);
    if (!祖) break;                        // 父没了（被删/老数据），当顶层
    x += 祖.x || 0; y += 祖.y || 0;
    父 = 祖.父 || '';
  }
  return { x, y };
}

function 找框(id) { return (网.注释框们 || []).find(f => f.id === id) || null; }

// 直接子框
function 子框们(框) {
  return (网.注释框们 || []).filter(f => f.id !== 框.id && (f.父 || '') === 框.id);
}

// 全部后代（不含自己）
function 后代框们(框) {
  const 出 = [], 走 = f => { for (const c of 子框们(f)) { 出.push(c); 走(c); } };
  走(框);
  return 出;
}

// 某个点落在哪个框里 —— 从最深的那层往上找。
// 用来决定「拖出来的框该归谁」「松手时拖进了哪个框」。
function 点下最深框(x, y, 排除) {
  const 排除集 = new Set(排除 || []);
  let 最深 = null, 最深面积 = Infinity;
  for (const f of (网.注释框们 || [])) {
    if (排除集.has(f.id)) continue;
    const 位 = 绝对位(f);
    if (x <= 位.x || x >= 位.x + f.宽 || y <= 位.y || y >= 位.y + f.高) continue;
    const 面积 = f.宽 * f.高;
    if (面积 < 最深面积) { 最深 = f; 最深面积 = 面积; }
  }
  return 最深;
}

// 这个框里现在装着谁。
// 注释框走真父子（子框的 DOM 就在父框里，不用算）；实例框不在框的 DOM 里
// （它们归 #网层管，层序和连线都依赖那个），仍然按「中心落在框里」算 ——
// 但要用**绝对坐标**，因为子框的 x/y 是相对父框的。
function 框里成员(框) {
  const 出 = [];
  for (const c of 子框们(框)) {
    const el = 网.框层 && 网.框层.querySelector('.注释框[data-id="' + CSS.escape(c.id) + '"]');
    if (el) 出.push(el);
  }
  if (!网.层) return 出;
  const 位 = 绝对位(框);
  const 框位 = { x: 位.x, y: 位.y, 宽: 框.宽, 高: 框.高 };
  const 全体 = new Set(后代框们(框).map(f => f.id));
  for (const el of 网.层.querySelectorAll('.实例框')) {
    if (el.dataset.id === 框.id || 全体.has(el.dataset.id)) continue;
    if (在框里(框位, 元素的位(el))) 出.push(el);
  }
  return 出;
}

function 存注释框() {
  if (!有壳()) return;
  window.chrome.webview.postMessage({
    命令: '存注释框',
    项: 网.注释框们.map(f => ({
      id: f.id, 标题: f.标题 || '', x: f.x, y: f.y,
      宽: f.宽, 高: f.高, 色: f.色 || '', 收起: !!f.收起,
      父: f.父 || '',
    })),
  });
}

function 建注释框(框) {
  const el = document.createElement('div');
  el.className = '注释框' + (框.收起 ? ' 收起' : '');
  el.dataset.id = 框.id;
  el.style.left = 框.x + 'px';
  el.style.top = 框.y + 'px';
  el.style.width = 框.宽 + 'px';
  el.style.height = 框.宽 ? 框.高 + 'px' : '26px';

  const 头 = document.createElement('div');
  头.className = '框头';
  const 标 = document.createElement('span');
  标.className = '框标题';
  标.textContent = 框.标题 || '';
  // 平时不可编辑，双击才进 —— 不然点在标题文字上就开始选字，框拖不动，
  // 而且「抓哪儿能拖」会取决于标题有几个字，很随机。
  标.contentEditable = 'false';
  标.spellcheck = false;
  标.addEventListener('dblclick', e => {
    e.stopPropagation();
    标.contentEditable = 'true';
    标.focus();
  });
  标.addEventListener('blur', () => {
    标.contentEditable = 'false';
    框.标题 = (标.textContent || '').trim();
    标.textContent = 框.标题;
    存注释框();
  });
  标.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); 标.blur(); }
  });
  const 数 = document.createElement('span');
  数.className = '名额';
  数.textContent = 框里成员(框).length + ' 个';
  // × 删掉这个框。里面的东西不动 —— 框只是「这段时间在弄的这堆」，不是容器。
  const 叉 = document.createElement('span');
  叉.className = '框叉';
  叉.textContent = '×';
  叉.title = '删掉这个框（里面的东西不动）';
  叉.addEventListener('pointerdown', e => e.stopPropagation());
  叉.addEventListener('click', e => { e.stopPropagation(); 删注释框(框.id); });
  头.appendChild(标); 头.appendChild(数); 头.appendChild(叉);
  el.appendChild(头);

  // 四个角是把手，拖动改大小 —— 就是普通窗口那种，没有任何按钮和文字
  for (const 角 of ['nw', 'ne', 'sw', 'se']) {
    const h = document.createElement('i');
    h.className = '框角 ' + 角;
    h.addEventListener('pointerdown', e => 拖角(e, 框, el, 角));
    el.appendChild(h);
  }

  el.addEventListener('contextmenu', e => {
    if (e.target.closest('.框角')) return;
    e.preventDefault(); e.stopPropagation();
    const 单 = 做右键单();
    const 注 = document.createElement('div');
    注.className = '注';
    注.textContent = 框.标题 || '未命名的大框';
    单.appendChild(注);
    加右键项(单, '删掉这个框', () => 删注释框(框.id), true);
    摆右键单(单, e);
  });

  // 拖整个框 —— 不光是框头。
  //
  // ⚠️ 原来只绑在 .框头 上，框体又是 pointer-events:none，于是：
  //    大框里套的小框，抓它的框体 → 事件落到 #world → 整张画布平移。
  //    使用者看到的就是「框内框拖不动」。框头只有 26px（CSS），
  //    z=0.42 时剩 11 屏幕像素，那一细条本来就点不准。
  //    现在框体本身能抓（见 .注释框 的 CSS），拖动挂在整个 el 上。
  //    框角、× 各自有 stopPropagation，不会被这里抢走。
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // Ctrl 拖 = 在框里再画一个（嵌套框）；等画框状态同理。交给舞台那个 handler。
    if (e.ctrlKey || 等画框) return;
    if (标.contentEditable === 'true') return;   // 正在改标题
    if (e.target.closest('.框角') || e.target.closest('.框叉')) return;
    // stopPropagation 挡舞台平移；但**不** preventDefault ——
    // 后者会掐掉后面的 click / dblclick，标题双击就改不了名了。
    // 它也同时挡住了父框的拖动 —— 子框是父框的 DOM 子节点，冒泡本来就是分层的。
    e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    // 按下那一刻就把**绝对**位置记下来 —— 拖动全程用绝对坐标算，
    // 跟「框现在挂在谁身上」无关。松手交给 归位() 换算回相对的。
    const 我0 = 绝对位(框);
    const 起 = { x: e.clientX, y: e.clientY, ax: 我0.x, ay: 我0.y };
    // 按住不动 = 单击，不该拖。走够 5px 才算拖（跟块那边的阈值一个道理）。
    // 实例框也等到这一刻才取 —— 按下那一瞬间位置才是准的。
    //
    // ⚠️ 只取**实例框**，不取子注释框：子框是 el 的 DOM 子节点，
    //    移动 el 浏览器自然把它们带走，手写一遍等于挪两次。
    let 实例员 = null;
    let 提起过 = false;
    const 探 = ev => {
      if (实例员) return;
      if (Math.abs(ev.clientX - 起.x) + Math.abs(ev.clientY - 起.y) < 5) return;
      实例员 = 框里成员(框).filter(m => !m.classList.contains('注释框'))
        .map(m => ({ el: m, 位: 元素的位(m), id: m.dataset.id }));
      // ⚠️ 拖之前先把自己从父框里**提出来**挂到框层顶层，坐标换成画布的绝对值。
      //    不提的话，left/top 是相对父框的 —— 拖出父框边界那一刻位置就错乱，
      //    看着像「框的坐标跟鼠标对不上」。松手时 归位() 会重新挂回去。
      //
      // ⚠️ 父 字段必须跟着一起清。只改 x/y 不清父的话，绝对位() 会再叠一遍
      //    祖先的偏移 —— 拖一下位置就飞出去（嵌套更深时飞得更远）。
      框.x = 起.ax; 框.y = 起.ay; 框.父 = '';
      el.style.left = 起.ax + 'px';
      el.style.top = 起.ay + 'px';
      网.框层.appendChild(el);
      提起过 = true;
      el.classList.add('拖动中');
      网.拖中 = true;
    };
    const 移 = ev => {
      探(ev);
      const z = 视.z || 1;
      const dx = (ev.clientX - 起.x) / z, dy = (ev.clientY - 起.y) / z;
      框.x = Math.round(起.ax + dx);
      框.y = Math.round(起.ay + dy);
      el.style.left = 框.x + 'px';
      el.style.top = 框.y + 'px';
      for (const m of (实例员 || [])) {
        m.el.style.left = Math.round(m.位.x + dx) + 'px';
        m.el.style.top = Math.round(m.位.y + dy) + 'px';
        // ⚠️ 改字段，不要 set 一个新对象！
        //    实例框的拖动闭包里握着的是 网.位置.get(id) 那个对象的引用，
        //    这里一替换，它改的还是旧对象 —— 图上读新对象，两边对不上，
        //    表现就是「拖框里的小框到处乱飞」。
        if (m.id) {
          const 现 = 网.位置.get(m.id);
          if (现) { 现.x = Math.round(m.位.x + dx); 现.y = Math.round(m.位.y + dy); }
          else 网.位置.set(m.id, { x: Math.round(m.位.x + dx), y: Math.round(m.位.y + dy) });
        }
      }
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      归位(框);
      // 拖动结束：把线按完整算法重算一遍（拖动中用的是降级折线）
      网.拖中 = false;
      画线();
      存布局(); 存注释框();
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  // 挂到哪一层由调用方决定：顶层挂 #注释框层，子框挂父框自己身上。
  // 这样浏览器保证「里面的永远画在外面的上面」，也保证事件先到里面再冒泡到外面。
  return el;
}

// 松手之后重新算「这个框现在归谁」。
//
// 真父子之后，拖动改的只是它自己的绝对位置；**归谁**是另一件事，要在这里定下来。
// 不重算的话会出现两种错：
//   · 拖进大框里，它还是顶层 —— 大框一动它不跟着走（看着像「框里的东西不动」）
//   · 拖出大框外，它还是子框 —— 位置越拖越偏（它的坐标相对一个它已经不在里面的框）
//
// 判定用**中心点**：整个框的中心落在谁里面就归谁。用角点的话，
// 稍微压住一点就换爹，手一抖就跳。
function 归位(框) {
  const 我 = 绝对位(框);
  const 心x = 我.x + 框.宽 / 2, 心y = 我.y + 框.高 / 2;

  // 不能塞进自己或自己的后代里（那会成环，页面直接挂死）
  const 不能当 = new Set([框.id, ...后代框们(框).map(f => f.id)]);
  let 新父 = null;
  for (const f of (网.注释框们 || [])) {
    if (不能当.has(f.id)) continue;
    const 位 = 绝对位(f);
    if (心x > 位.x && 心x < 位.x + f.宽 && 心y > 位.y && 心y < 位.y + f.高) {
      // 取最深的那层：嵌了三层就归最里面那个，不归外层
      if (!新父 || f.宽 * f.高 < 新父.宽 * 新父.高) 新父 = f;
    }
  }

  const 新父id = 新父 ? 新父.id : '';
  const 旧父id = 框.父 || '';
  const 新父位 = 新父 ? 绝对位(新父) : { x: 0, y: 0 };
  // 坐标是相对父的，换了爹就得换算，不然位置当场跳走
  const 新x = Math.round(我.x - 新父位.x), 新y = Math.round(我.y - 新父位.y);

  if (新父id === 旧父id) {
    // 没换爹，但要确认坐标真的是相对当前父的（拖过就变了，得写回去）
    if (框.x !== 新x || 框.y !== 新y) { 框.x = 新x; 框.y = 新y; }
    // DOM 得跟着走：拖出来的时候它还在原来的父框里，位置却是按画布算的
  } else {
    框.父 = 新父id;
    框.x = 新x; 框.y = 新y;
  }
  // 一律重画一次 —— 换爹要搬 DOM，不换爹也要把 left/top 写成相对值。
  // 重画很便宜（框有几十个就是上限），不要为了省这一下留一条「位置看着对、
  // 数据是错的」的路。
  画注释框们();
}

function 画注释框们() {
  if (!网.框层) return;
  网.框层.textContent = '';
  // 真父子：先建顶层，再递归把子框塞进父框里。
  //
  // ⚠️ 这里不再需要「按面积排序」。层序由 DOM 结构决定 ——
  //    子元素天然画在父元素上面，浏览器保证。之前靠排序是**近似**，
  //    碰不到 create 顺序的坑（先建小框后建大框，大框就盖住小框）就会坏。
  // 父指向一个不存在的框（被删了、或者老数据）一律当顶层 —— 不然那个框就消失了。
  const 全体 = 网.注释框们 || [];
  const 在的 = new Set(全体.map(f => f.id));
  // 只算真正的父：父存在、不是自己、也不是自己的后代（数据成环时别把页面挂死）
  const 真父 = f => {
    const p = f.父 || '';
    return (p && p !== f.id && 在的.has(p)) ? p : '';
  };
  const 挂 = (框, 父el, 走过) => {
    if (走过.has(框.id)) return;           // 环，砍掉
    走过.add(框.id);
    const el = 建注释框(框);
    父el.appendChild(el);
    for (const 子 of 全体) if (真父(子) === 框.id) 挂(子, el, 走过);
  };
  // 深度优先建：环上的框永远不会从「顶层」进来，最后补一遍兜底
  const 走过 = new Set();
  for (const 框 of 全体) if (!真父(框)) 挂(框, 网.框层, 走过);
  for (const 框 of 全体) if (!走过.has(框.id)) { 框.父 = ''; 挂(框, 网.框层, 走过); }
}

// Ctrl+左键在空白处拖 = 画一个新框。
//
// ⚠️ 原来的设计是右键拖，实测不通：WebView2 里右键按下**不派发 pointerdown**
//    （挂捕获监听看到的只有 pointerup / mouseup / contextmenu），所以起点永远收不到。
//    Alt+左键也不行 —— 那是 Windows 的「拖窗口」手势。
舞台.addEventListener('contextmenu', e => {
  if (e.target.closest('.窗户')) return;
  if (e.target.closest('.空头框')) return;    // 那种右键有自己的申诉菜单
  if (e.target.closest('.注释框')) return;    // 框头自己处理（删框）
  e.preventDefault();
  if (!网.开) return;
  const 单 = 做右键单();
  const 注 = document.createElement('div');
  注.className = '注';
  注.textContent = '画布';
  单.appendChild(注);
  加右键项(单, '新增大注释框', () => 进入画框(), false, 'Ctrl+Shift+B');
  摆右键单(单, e);
});

// 快捷键：进入画框状态。跟 Unreal 的 C 键是同一个意思，但 C 在这儿被占了。
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey && e.shiftKey)) return;
  if (e.key !== 'B' && e.key !== 'b') return;
  if (e.target && e.target.isContentEditable) return;   // 正在改标题
  e.preventDefault();
  进入画框();
});

舞台.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  // 两条路进来：Ctrl 直接拖，或者先点了「新增大注释框」再拖
  if (!e.ctrlKey && !等画框) return;
  if (e.target.closest('.窗户') || e.target.closest('.空头框')) return;
  if (!网.开 || !网.框层) return;
  e.preventDefault();
  退出画框();

  const 台r = 世界.getBoundingClientRect();
  const z = 视.z || 1;
  const 世界点 = ev => ({
    x: (ev.clientX - 台r.left) / z,
    y: (ev.clientY - 台r.top) / z,
  });
  const 起 = 世界点(e);

  const 预览 = document.createElement('div');
  预览.className = '注释框 拖出中';
  预览.style.left = 起.x + 'px';
  预览.style.top = 起.y + 'px';
  预览.style.width = '0px';
  预览.style.height = '0px';
  网.框层.appendChild(预览);

  const 移 = ev => {
    const p = 世界点(ev);
    const x = Math.min(起.x, p.x), y = Math.min(起.y, p.y);
    预览.style.left = x + 'px';
    预览.style.top = y + 'px';
    预览.style.width = Math.abs(p.x - 起.x) + 'px';
    预览.style.height = Math.abs(p.y - 起.y) + 'px';
  };
  const 停 = ev => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    const p = 世界点(ev);
    const 宽 = Math.abs(p.x - 起.x), 高 = Math.abs(p.y - 起.y);
    预览.remove();
    // 太小的当误触，不建 —— 右键本来就容易顺手按一下
    if (宽 < 40 || 高 < 40) return;
    const 左 = Math.round(Math.min(起.x, p.x)), 上 = Math.round(Math.min(起.y, p.y));
    // 落点在哪个框里，新框就归谁 —— 跟「在画布上拉一个」是一回事，
    // 只不过拉在了某个框上面。这样不用先画再拖进去。
    const 父 = 点下最深框(左 + 宽 / 2, 上 + 高 / 2);
    let x = 左, y = 上;
    if (父) {
      const 父位 = 绝对位(父);
      x = 左 - 父位.x; y = 上 - 父位.y;
    }
    网.注释框们.push({
      id: '框' + Date.now().toString(36),
      标题: '',
      x, y,
      宽: Math.round(宽), 高: Math.round(高),
      收起: false,
      父: 父 ? 父.id : '',
    });
    画注释框们();
    存注释框();
  };
  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
});

// 不做精细测量 —— 框里目前只有脚本名，高度是确定的。
const 脚本行高 = 32, 实例头高 = 36, 实例脚高 = 22;

// 原地 = 重拉一次数据（申诉完、刷新完），视野别动。
// 网络第一次建出来才需要「对准块」—— 不然你在右上角看某个断口，
// 右键申了一下，整个图缩回 50%，等于把你赶出去了。
function 画网(图, 原地) {
  if (!图 || !Array.isArray(图.实例们)) return;
  const 旧视 = { x: 视.x, y: 视.y, z: 视.z };
  建网层();
  网.开 = true;
  应用组件口开关();          // 把开关状态贴回新的网层上
  // 页面刚打开时 网.开 还是 false，重画() 按「没有网」的样子把块摊在 #world 上。
  // 网一到它们就该收进去 —— 不收的话打开是 26 个块铺满画布压在网上面，
  // 看着像「网没出来」，其实是被自己的块盖住了。
  // 只删 #world 的直接子块：窗户里的块是另一套，不归这里管。
  for (const el of 世界.querySelectorAll(':scope > .blk')) el.remove();
  网.实例们 = 图.实例们;
  网.线们 = Array.isArray(图.线) ? 图.线 : [];

  // 后端给的 x/y 是网格默认值；拖过的在 位置 里，优先用拖过的
  for (const 实 of 网.实例们) {
    if (!网.位置.has(实.id)) 网.位置.set(实.id, { x: 实.x || 0, y: 实.y || 0 });
  }

  网.层.textContent = '';
  网.孤岛们 = Array.isArray(图.孤岛们) ? 图.孤岛们 : [];
  网.空头们 = Array.isArray(图.空头们) ? 图.空头们 : [];
  网.人线们 = Array.isArray(图.人线们) ? 图.人线们 : [];
  网.申诉们 = Array.isArray(图.申诉们) ? 图.申诉们 : [];
  for (const 实 of 网.实例们) 建实例框(实);
  for (const 孤 of 网.孤岛们) 建孤岛框(孤);
  网.注释框们 = Array.isArray(图.注释框们) ? 图.注释框们 : [];
  画注释框们();

  // 连到 Unity 内置组件的出口：目标不是用户脚本，装不进任何一行里。
  // 按你说的「还是空头」—— 给它一个空头框，写上连到哪个组件。
  // 注意这不是错误：Rigidbody / Renderer 本来就该是组件，所以样式是中性的，不标红。
  {
    const 行存在 = new Set();
    for (const 框el of 网.层.querySelectorAll('.实例框'))
      for (const 行框 of 框el.querySelectorAll('.脚本框'))
        行存在.add(框el.dataset.id + '\u0001' + String(行框.dataset.名 || '').replace(/\[\d+\]$/, ''));
    for (const 实 of 网.实例们) {
      const 源位 = 网.位置.get(实.id);
      for (const s of 实.脚本 || []) {
        for (let k = 0; k < (s.出口 || []).length; k++) {
          const 出口 = s.出口[k];
          const 型 = 出口.到类型 || '?';
          if (出口.到 && 行存在.has(出口.到 + '\u0001' + 型)) continue;   // 有对应用户脚本行，画线就行
          const id = '组件|' + 实.id + '|' + s.名 + '|' + 型 + '|' + k;
          if (网.空头们.some(x => x.id === id)) continue;
          网.空头们.push({
            id, 自: 实.id, 组件: s.名 + '#' + k, 字段: 型, 口: k, 脚本名: s.名,
            种类: '组件', 名: 型, 申诉: null,
            x: 源位 ? 源位.x : 0,
            y: 源位 ? 源位.y + 340 + 网.空头们.length * 100 : 0,
          });
        }
      }
    }
  }

  for (const 空 of 网.空头们) 建空头框(空);
  画脚本索引();
  画申诉区();
  // 窗口尺寸可能变过，重算一遍长宽比
  窗口改了就重排();
  画线();
  自动扩画布();
  // 网来了之后重新对一次视野 —— 打开时视野只对着块，网在右边外面，
  // 看着像「网没出来」。网状图是默认界面，先让人看见它。
  // 但重拉（原地）时不能动视野：那是把正在看的人踢走。
  if (原地) {
    视.x = 旧视.x; 视.y = 旧视.y; 视.z = 旧视.z;
    应用视();
  } else {
    requestAnimationFrame(对准块);
  }
}

// 窗口尺寸变了，所有框的宽度都跟着屏幕比例重算。
// 长宽比是「跟着屏幕走」的，不是建的时候算一次就完事。
function 窗口改了就重排() {
  const 比 = (window.innerWidth || 1400) / (window.innerHeight || 900);
  for (const el of document.querySelectorAll('.实例框')) {
    // 正在编辑的那个框由开窗时定死尺寸，别拿"高 × 比例"去改它
    if (el.querySelector(':scope > .实例体.编辑中')) continue;
    // 孤岛框 / 空头框也带着 .实例框 的类，但它们不是场景实例，宽度是自己定的 —— 别重算
    if (el.classList.contains('孤岛框') || el.classList.contains('空头框')) continue;
    // ⚠️ 必须先把宽度放开再量高度。
    //    不放开的话，宽度还是上一轮算的值，文字换行方式跟着宽度走，
    //    量出来的高度就是旧形状下的高度 —— 一路叠下去框会越来越歪
    //    （实测变成 293×479 = 0.61 的竖条）。
    el.style.width = '';
    const 高 = el.offsetHeight;
    if (!高) continue;
    el.style.width = Math.round(Math.max(180, 高 * 比)) + 'px';
  }
}

// 孤岛：没有实例框的脚本，单独摆一块，红框
function 建孤岛框(孤) {
  if (!网.位置.has(孤.id)) 网.位置.set(孤.id, { x: 孤.x || 0, y: 孤.y || 0 });
  const 位 = 网.位置.get(孤.id);
  const el = document.createElement('div');
  el.className = '实例框 孤岛框';
  el.dataset.id = 孤.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';
  el.style.width = '220px';
  el.style.height = '80px';

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 孤.名 || 孤.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = '孤岛';
  头.appendChild(名); 头.appendChild(签);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  const 说 = document.createElement('div');
  说.className = '实例脚';
  说.style.borderTop = '0';
  说.textContent = 孤.原因 || '场景里没有物体挂这个脚本';
  体.appendChild(说);
  el.appendChild(体);

  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.编钮')) return;
    // ⚠️ 必须挡住传播。不挡的话事件冒泡到舞台，外层画布也开始平移 ——
    //    表现就是「鼠标一按上去，孤岛框跟着整张网跑，抓不住」。
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      存布局();
    };
    // ⚠️ 绑 document 不绑 头：框只有几十像素宽，鼠标一出框 pointermove 就断了，
    //    拖动看起来像「抓不住」。
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(孤.id));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// 空头：脚本往外伸手，那头是空的（面板上那个槽是 None）。
//
// 这类错误在 Unity 里完全静默 —— 不报错、不打日志，跑起来功能集体失效，
// 人只能靠「逐一比对历史版本」才发现。所以它必须出现在图上，而且得刺眼。
//
// 误报是必然的：运行时才赋值的引用，扫描器看不出来。
// 所以右键能申诉 —— 三种处理都写库，重扫不丢。
//
// ⚠️ 连到 Unity 内置组件的那种（种类='组件'）跟真正的断链是两回事：
//    Rigidbody / Slider / Text 本来就该是组件，不是谁忘了接线。
//    原来给它整了个 220×80 的大框，跟断链一样的体积，18 个就铺满画布 ——
//    使用者原话「到处飞」。现在改成**一个小圆虚线框 + 一个短标签**，
//    位置也不再按全局序号往下堆，而是钉在源框右肩上（紧凑竖排）。
//    还能整体关掉（顶栏「组件口」）。
// 组件口摆哪：钉在源框的**右肩**，同一个源框上的几个按顺序竖排。
//
// 原来它跟真断链共用一套「源位下面 +300、往下每 110 一个」的摆法，
// 但序号是**全局**的 —— 第 18 个组件口就摆到源框下面 2000px 开外去了。
// 使用者原话「到处飞」。它本来就是那条出口的注脚，贴着源框才对。
function 组件口位(空) {
  const 源位 = 空.自 ? 网.位置.get(空.自) : null;
  if (!源位) return { x: 空.x || 0, y: 空.y || 0 };
  // 同一个源框上，这是第几个组件口
  const 同源 = (网.空头们 || []).filter(k => k.种类 === '组件' && k.自 === 空.自);
  const 序 = Math.max(0, 同源.findIndex(k => k.id === 空.id));
  // 源框宽度从 DOM 量（实例框宽度不固定，脚本多的更宽）
  let 宽 = 220;
  if (网.层) {
    const src = 网.层.querySelector('.实例框[data-id="' + CSS.escape(空.自) + '"]');
    if (src) 宽 = src.offsetWidth || 220;
  }
  // 贴在右肩外沿：往右探出一点点，免得压住框里的脚本行。
  // 竖向间距按 22px 排 —— 比标记本身高一点，缩到 0.5 倍也不会糊成一条。
  return { x: 源位.x + 宽 + 4, y: 源位.y + 4 + 序 * 22 };
}

// 把所有组件口按**源框现在的 DOM 位置**重摆一遍。
//
// ⚠️ 为什么需要这个：组件口的位置是在 建空头框 里算一次的，而 建空头框 只在
//    画网（重拉数据）时跑。于是拖完框、开关一次组件口之后，源框走了、
//    标记还钉在旧坐标上 —— 使用者原话「拖完后会呆在原地」。
//
// 现在改成每次 画线() 都刷一遍。画线在拖动时每帧都跑，所以在框被拖走的那一帧，
// 标记就跟着过去了，不用等松手。
//
// 位置一律按 DOM 的 style.left / offsetWidth 算 —— 不用 网.位置。
// 那两个会不同步（实测 enemy：内存 x=1206、DOM left=-354）。
function 刷组件口() {
  if (!网.层) return;
  const 源框 = new Map();
  for (const el of 网.层.querySelectorAll('.实例框')) {
    if (el.classList.contains('空头框')) continue;
    源框.set(el.dataset.id, {
      x: parseFloat(el.style.left) || 0,
      y: parseFloat(el.style.top) || 0,
      w: el.offsetWidth || 220,
    });
  }
  const 第几个 = new Map();
  for (const 空 of (网.空头们 || [])) {
    if (空.种类 !== '组件') continue;
    const el = 网.层.querySelector('.空头框[data-id="' + CSS.escape(空.id) + '"]');
    if (!el) continue;
    const 源 = 源框.get(空.自);
    if (!源) { el.style.visibility = 'hidden'; continue; }   // 源框没了就别杵在旧位置
    el.style.visibility = '';
    const k = 第几个.get(空.自) || 0;
    第几个.set(空.自, k + 1);
    el.style.left = (源.x + 源.w + 4) + 'px';
    el.style.top = (源.y + 4 + k * 22) + 'px';
  }
}

function 建空头框(空) {
  let 位 = 网.位置.get(空.id);
  // 组件口不存位置 —— 它钉在源框右肩上，由 刷组件口() 每帧重算
  if (空.种类 === '组件') 位 = { x: 0, y: 0 };
  else if (!位) {
    // 第一次摆：这个口要是长在场上某个实例身上，就摆在它正下方。
    //
    // ⚠️ 不能摆右边。第一版是 源位.x + 470 —— [对准 enemy] 会把源框贴到左上角
    //    (台.left+40)，再往右 470 就到 890px，而舞台可用宽度不到 800
    //    （左栏 + 右边「生成的 C#」栏各占一块），整个空头框被右边栏切掉，
    //    屏幕上只剩「EnemyChase.t」。往下摆就没事：源框看得见，它就在看得见的地方。
    const 源位 = 空.自 ? 网.位置.get(空.自) : null;
    const 序 = Math.max(0, (网.空头们 || []).findIndex(k => k.id === 空.id));
    位 = 源位
      ? { x: 源位.x, y: 源位.y + 300 + 序 * 110 }
      : { x: 空.x || 0, y: 空.y || 0 };
    网.位置.set(空.id, 位);
  }
  const el = document.createElement('div');
  // 组件头不是错误：Rigidbody / Renderer 本来就该是组件，所以用中性样式。
  el.className = '实例框 空头框'
    + (空.种类 === '组件' ? ' 组件头' : '')
    + (空.申诉 === '正常' ? ' 误报' : '');
  el.dataset.id = 空.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';
  el.style.width = '220px';
  el.style.height = '80px';

  // ── 组件口：一个小圆 + 一个短标签，不要那个大框 ──
  // 它本来就是「这个口连到引擎组件」的记号，不是一块地方。
  if (空.种类 === '组件') {
    el.style.width = '';            // 交给 CSS 按内容撑
    el.style.height = '';
    const 圆 = document.createElement('span');
    圆.className = '组件圆';
    const 标 = document.createElement('span');
    标.className = '组件标';
    标.textContent = 空.字段 || 空.名 || '组件';
    el.appendChild(圆);
    el.appendChild(标);
    el.title = (空.脚本名 || '') + ' 第 ' + ((空.口 || 0) + 1) + ' 个口 → Unity 组件 ' + (空.字段 || '');

    el.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      开申诉菜单(空, e);
    });
    el.addEventListener('mouseenter', () => 点亮(空.自));
    el.addEventListener('mouseleave', 熄灭);
    网.层.appendChild(el);
    return;
  }

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 空.名 || 空.字段 || 空.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = 空.申诉 === '正常' ? '已申诉' : '缺接应';
  头.appendChild(名); 头.appendChild(签);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  const 说 = document.createElement('div');
  说.className = '实例脚';
  说.style.borderTop = '0';
  说.textContent = 空.申诉 === '正常' ? '你申诉过 · 这里没问题' : '没人来接 · 右键处理';
  体.appendChild(说);
  el.appendChild(体);

  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
    开申诉菜单(空, e);
  });

  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.编钮')) return;
    // 跟孤岛框同一个坑：不挡就会冒泡到舞台，整张网跟着平移，看着像抓不住
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      存布局();
    };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(空.自));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// ── 组件口：显示 / 不显示 ─────────────────────────────
//
// 「脚本里第 k 个口连到 Rigidbody/Slider/Text」是**事实**，不是错误。
// 但它一次能出十几个，摊在画布上会盖住真正要看的东西（真断链是红的那些）。
// 所以给它一个开关，默认开，想清台就关。
//
// 不放进 设置 落库：这是「这一刻想不想看」，跟「这东西是什么」不是一类。
// 每次打开都从「显示」开始 —— 藏起来的东西不该在你不知道的情况下继续藏着。
let 组件口开着 = true;
function 显示组件口() { return 组件口开着; }

function 应用组件口开关() {
  if (网.层) 网.层.classList.toggle('藏组件口', !组件口开着);
  const 钮 = document.getElementById('组件口钮');
  if (钮) {
    钮.textContent = 组件口开着 ? '组件口' : '组件口·关';
    钮.classList.toggle('熄', !组件口开着);
    钮.title = 组件口开着
      ? '现在显示「连到 Unity 组件」的小圆标记，点一下收起'
      : '已收起「连到 Unity 组件」的小标记，点一下显示';
  }
}

function 切组件口() {
  组件口开着 = !组件口开着;
  应用组件口开关();
}

// 三个选项都是「你说的话」，不是猜的，所以全部落库：
//   指定连接对象 → 它其实指向谁（连上就不算断了）
//   正常显示     → 误报，别再喊，但框留着（藏了就成了「悄悄消失」）
//   不显示       → 误报，而且不想看见
function 关右键单() {
  const 旧 = document.getElementById('右键单');
  if (旧) 旧.remove();
}

function 做右键单() {
  关右键单();
  const 单 = document.createElement('div');
  单.className = '右键单';
  单.id = '右键单';
  document.body.appendChild(单);
  return 单;
}

function 摆右键单(单, e) {
  const r = 单.getBoundingClientRect();
  单.style.left = Math.max(8, Math.min(e.clientX, window.innerWidth - r.width - 8)) + 'px';
  单.style.top = Math.max(8, Math.min(e.clientY, window.innerHeight - r.height - 8)) + 'px';
}

function 加右键项(单, 字, 事, 险, 键) {
  const 项 = document.createElement('div');
  项.className = '项' + (险 ? ' 险' : '');
  const 名 = document.createElement('span');
  名.textContent = 字;
  项.appendChild(名);
  // 快捷键写在右边（菜单里看得见，不用去翻文档）
  if (键) {
    const k = document.createElement('span');
    k.className = '键';
    k.textContent = 键;
    项.appendChild(k);
  }
  项.addEventListener('click', ev => {
    ev.stopPropagation();
    关右键单();
    事();
  });
  单.appendChild(项);
  return 项;
}

// ── 大注释框：新建 / 删除 ──────────────────────────────
//
// 新建不是「直接生成一个框」，是进入画图状态 —— 跟画图软件里点矩形工具一样：
// 先选工具，再在画布上拖出范围。多一步点击，但框多大、在哪儿都由你定。

let 等画框 = false;

function 进入画框() {
  if (!网.开 || !网.框层) { 网提示('还没连上关系库'); return; }
  等画框 = true;
  舞台.style.cursor = 'crosshair';
  网提示('在画布上拖一个矩形');
}

function 退出画框() {
  等画框 = false;
  舞台.style.cursor = '';
}

function 删注释框(id) {
  const 前 = 网.注释框们.length;
  const 要删 = (网.注释框们 || []).find(f => f.id === id);
  if (!要删) return;
  // ⚠️ 框改成真父子之后，直接删会把里面的框一起带走（它们是人家的 DOM 子节点）。
  //    「框只是这段时间在弄的这堆，不是容器」—— 所以删框时把子框**提到它的上一层**，
  //    位置换算成新坐标，内容一个不少。
  const 我位 = 绝对位(要删);
  const 新父 = 要删.父 && (网.注释框们 || []).some(f => f.id === 要删.父) ? 要删.父 : '';
  const 父位 = 新父 ? 绝对位(找框(新父)) : { x: 0, y: 0 };
  for (const 子 of (网.注释框们 || [])) {
    if ((子.父 || '') !== id) continue;
    子.父 = 新父;                        // 提到上一层（可能是顶层）
    子.x = Math.round(子.x + 我位.x - 父位.x);
    子.y = Math.round(子.y + 我位.y - 父位.y);
  }
  网.注释框们 = (网.注释框们 || []).filter(f => f.id !== id);
  if (网.注释框们.length === 前) return;
  画注释框们();
  存注释框();
}

// 拖角改大小。四个角都是把手，没有按钮、没有文字。
function 拖角(e, 框, el, 角) {
  e.preventDefault(); e.stopPropagation();
  const z = 视.z || 1;
  const 起 = { x: e.clientX, y: e.clientY, ox: 框.x, oy: 框.y, ow: 框.宽, oh: 框.高 };
  // 别的框在这个框里面的话，框一变它们多半就不在里面了。
  // 不跟着缩放 —— 那是容器的事，这里只是画个范围。
  const 移 = ev => {
    const dx = (ev.clientX - 起.x) / z, dy = (ev.clientY - 起.y) / z;
    let x = 起.ox, y = 起.oy, w = 起.ow, h = 起.oh;
    if (角.includes('e')) w = Math.max(80, 起.ow + dx);
    if (角.includes('s')) h = Math.max(56, 起.oh + dy);
    if (角.includes('w')) { w = Math.max(80, 起.ow - dx); x = 起.ox + (起.ow - w); }
    if (角.includes('n')) { h = Math.max(56, 起.oh - dy); y = 起.oy + (起.oh - h); }
    框.x = Math.round(x); 框.y = Math.round(y);
    框.宽 = Math.round(w); 框.高 = Math.round(h);
    el.style.left = 框.x + 'px'; el.style.top = 框.y + 'px';
    el.style.width = 框.宽 + 'px'; el.style.height = 框.高 + 'px';
  };
  const 停 = () => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    存注释框();
  };
  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
}

function 开申诉菜单(空, e) {
  const 单 = 做右键单();

  const 注 = document.createElement('div');
  注.className = '注';
  注.textContent = String(空.组件 || '').split('|').pop() + ' · ' + (空.字段 || '');
  单.appendChild(注);

  加右键项(单, '它其实指向谁…', () => 开选目标(空, e));
  加右键项(单, '正常显示（这是误报）', () => 发申诉(空.id, '正常'));
  加右键项(单, '不显示', () => 发申诉(空.id, '隐藏'), true);
  if (空.申诉) {
    单.appendChild(Object.assign(document.createElement('div'), { className: '分' }));
    加右键项(单, '撤销申诉', () => 发申诉(空.id, '撤销'));
  }
  摆右键单(单, e);
}

function 开选目标(空, e) {
  const 单 = 做右键单();
  const 注 = document.createElement('div');
  注.className = '注';
  注.textContent = '这个口应该接到谁？选了就连上线，不再报断';
  单.appendChild(注);
  if (!网.实例们.length) {
    加右键项(单, '（场上还没有实例）', () => {}, true);
  }
  for (const 实 of 网.实例们) {
    加右键项(单, 实.名 || 实.id, () => 发申诉(空.id, '连到', 实.id));
  }
  摆右键单(单, e);
}

function 发申诉(id, 动作, 目标) {
  if (!有壳()) {
    console.warn('[申诉] 没有壳，存不下来 ——', id, 动作, 目标);
    return;
  }
  window.chrome.webview.postMessage({ 命令: '存申诉', id, 动作, 目标: 目标 || null });
}

// 点别处 / 按 Esc 关菜单。capture 阶段收，免得被别处的 stopPropagation 吞掉。
document.addEventListener('pointerdown', e => {
  const 单 = document.getElementById('右键单');
  if (单 && !单.contains(e.target)) 关右键单();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') 关右键单();
});


// 已申诉的口。
//
// 为什么要有这一块：申诉成「隐藏」或「连到」之后，空头框就从图上消失了 ——
// 没框就没地方右键，撤销不回来。误报一次就永久错下去，这不行。
// 所以凡是你说过话的断口，都在这里留一行，随时能撤。
function 画申诉区() {
  const 盒 = document.getElementById('申诉区');
  if (!盒) return;
  盒.textContent = '';
  const 们 = 网.申诉们 || [];
  if (!们.length) return;
  const 头 = document.createElement('div');
  头.className = '索引头';
  头.innerHTML = '<span>已申诉</span><span>' + 们.length + '</span>';
  盒.appendChild(头);
  for (const 申 of 们) {
    const 项 = document.createElement('div');
    项.className = '索引项';
    const 名 = String(申.id).split('|');
    // id = 组件|字段|种类。组件可能自带前缀，从右往左取
    const 字 = document.createElement('span');
    字.textContent = (名.length >= 3 ? 名[名.length - 2] : 申.id);
    项.title = 申.id;
    项.appendChild(字);
    const 尾 = document.createElement('span');
    尾.className = '挂';
    尾.textContent = 申.动作 === '连到'
      ? '→ ' + String(申.目标 || '').split('|').pop().split('.').pop()
      : 申.动作;
    项.appendChild(尾);
    项.addEventListener('click', () => 发申诉(申.id, '撤销'));
    盒.appendChild(项);
  }
  const 说 = document.createElement('div');
  说.className = '索引空';
  说.style.paddingTop = '0';
  说.textContent = '点一行撤销';
  盒.appendChild(说);
}

// 左边栏的「所有脚本」索引。点一下把视野对准那个框 ——
// 11 个脚本散在画布上，靠眼睛找太费劲。
function 画脚本索引() {
  const 盒 = document.getElementById('脚本索引');
  if (!盒) return;
  盒.textContent = '';
  const 头 = document.createElement('div');
  头.className = '索引头';
  const 数 = (网.实例们.reduce((n, 实) => n + (实.脚本 || []).length, 0)) + (网.孤岛们 || []).length;
  头.innerHTML = '<span>所有脚本</span><span>' + 数 + '</span>';
  盒.appendChild(头);
  if (!数) {
    const 空 = document.createElement('div');
    空.className = '索引空';
    空.textContent = '还没有脚本';
    盒.appendChild(空);
    return;
  }
  const 加 = (名, 挂谁, 孤, id) => {
    const 项 = document.createElement('div');
    项.className = '索引项' + (孤 ? ' 孤' : '');
    项.title = 孤 ? (名 + '（无人挂载）') : (名 + ' → ' + 挂谁);
    const 字 = document.createElement('span');
    字.textContent = 名;
    项.appendChild(字);
    const 尾 = document.createElement('span');
    尾.className = '挂';
    尾.textContent = 孤 ? '✗ 无人挂载' : 挂谁;
    项.appendChild(尾);
    项.addEventListener('click', () => 对准目标(id));
    盒.appendChild(项);
  };
  for (const 实 of 网.实例们) for (const sc of 实.脚本 || []) 加(sc.名, 实.名, false, 实.id);
  for (const 孤 of 网.孤岛们 || []) 加(孤.名, '', true, 孤.id);
}

// 把视野挪到某个框上，保持当前缩放
function 对准目标(id) {
  const el = 网.层 && 网.层.querySelector('.实例框[data-id="' + CSS.escape(id) + '"]');
  if (!el) return;
  const 台 = 舞台.getBoundingClientRect();
  const z = 视.z || 1;
  视.x = 台.left + 40 - (parseFloat(el.style.left) || 0) * z;
  视.y = 台.top + 40 - (parseFloat(el.style.top) || 0) * z;
  应用视();
  // 闪一下，让人知道对到哪了
  el.animate([{ outline: '2px solid #7a6a3f' }, { outline: '2px solid transparent' }],
    { duration: 900 });
}

function 建实例框(实) {
  const 位 = 网.位置.get(实.id);
  const el = document.createElement('div');
  el.className = '实例框';
  el.dataset.id = 实.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 实.名 || 实.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = (实.tag || 'Untagged') + ' · L' + (实.层 ?? 0);
  // 「框占满屏幕后，内部改为编辑器画布」—— 这个按钮就是那句话里的「按一个按钮」。
  // 不用自动：自动切换会在你只想看数据的时候被强行夺走视线。
  const 编钮 = document.createElement('span');
  编钮.className = '编钮';
  编钮.textContent = '✎ 编辑';
  编钮.title = '把这个框的内部变成编辑器画布（要先放大到占满屏幕）';
  编钮.addEventListener('click', e => {
    e.stopPropagation();
    const 首个 = (实.脚本 || [])[0];
    if (!首个) { 网提示('这个实例上没挂脚本'); return; }
    if (窗.el && 窗.实例 === 实.id) { 关窗(); return; }
    开窗(el, 首个.名);
  });
  头.appendChild(名);
  头.appendChild(签);
  头.appendChild(编钮);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  for (const s of 实.脚本 || []) {
    const 框 = document.createElement('div');
    框.className = '脚本框';
    const 行 = document.createElement('div');
    行.className = '脚本名';

    const 字 = document.createElement('span');
    字.className = '名';
    字.textContent = s.名 || '?';
    行.appendChild(字);

    // 出口：每有一个向外的条件，就有一个点。你说过「每有一个向外的条件，就有一个连线节点」
    //
    // ⚠️ 点是**分左右两侧**的：目标在左边，点就画在行的左边；目标在右边，画在右边。
    //
    // 原来所有点都堆在行尾（右边）。于是 `enemy` 那八个口全在框的右侧，
    // 可它们连的 `Cube` 在左边 —— 线只能从右边出去、绕过整个框再回来，
    // 在画布上就是一大圈。把点放到朝向目标的那一侧，线从最近的一条边出发，
    // 框里那一小段也最短。这是布局层的修法，走线算法再怎么调都补不回来。
    const 口数 = (s.出口 || []).length;
    if (口数) {
      const 左们 = document.createElement('span');
      左们.className = '脚本口 左';
      const 右们 = document.createElement('span');
      右们.className = '脚本口 右';
      for (let k = 0; k < 口数; k++) {
        const 出口 = s.出口[k];
        const 点 = document.createElement('i');
       
        // 这个点就是「连线节点」的落点 —— 线从这儿出去，不从这个实例框整条边出去。
        // 你在 b459 说的：「线只负责告知…与具体块绑定，先连到脚本边框，再连到外面」。
        点.dataset.口 = k;
        点.title = (出口.条件 || 出口.名 || '') + ' → ' + 名短(出口.到);
        // 判「目标在左还是在右」—— 这里**不算**，先一律放右边。
        // ⚠️ 这里只有 网.位置 可用，而它跟 DOM 的 style.left 会不同步
        //    （实测 enemy：内存 x=1206，DOM left=-354，两边判出来正好相反）。
        //    真正的分侧交给 画线()：那时所有框都建好了，用 DOM 的真实位置判才靠得住。
        点.dataset.侧 = '右';
        右们.appendChild(点);
      }
      // 两个容器**始终**都插进 DOM —— 口是画线时才决定去哪边的，
      // 一开始全在右边，左容器是空的。空的也必须在，不然画线时挪不过去。
      行.insertBefore(左们, 字);
      行.appendChild(右们);
      左们.style.display = 'none';   // 空的时候不占地方，有口了画线会打开
    }
    // 点脚本名 = 张开这扇窗。窗口只在够大的时候才开（见 够大()）
    框.dataset.名 = s.名 || '';
    行.title = '点开这个脚本的块';
    行.addEventListener('click', e => {
      e.stopPropagation();
      开窗(el, s.名);
      装窗缩放();
    });
    框.appendChild(行);
    体.appendChild(框);
  }
  el.appendChild(体);

  const 脚 = document.createElement('div');
  脚.className = '实例脚';
  脚.textContent = 实.组件 || '';
  el.appendChild(脚);

  // 长宽比 = 屏幕比例。先让内容把高度撑出来，再反过来定宽：宽 = 高 × 比。
  // 这样脚本多的框自动宽、少的自动窄，形状始终跟着屏幕走；
  // 放大到占满屏幕时，里面那块画布就是一块正常的横的编辑区，不是方的。
  requestAnimationFrame(() => { if (el.isConnected) 窗口改了就重排(); });

  // 拖整个框 —— 不光是标题条。
  //
  // ⚠️ 原来只绑在 .实例头 上：点标题条能拖，点身体（脚本行那块）事件冒泡到舞台，
  //    整张画布就平移了。使用者看到的是「大框内部拖不动，一拖整个画布跑」。
  //    现在整块都能抓；脚本行的 click 照常开窗，因为「点」不产生移动、不改位置。
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // ⚠️ 点按钮不参与拖动。pointerdown 会 preventDefault，
    //    把后面那次 click 掐掉 —— 于是「← 返回」「✎ 编辑」看着点不动。
    if (e.target.closest('.编钮')) return;
    e.preventDefault();
    e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    // 拖动期间不跑全图路由（一次 130ms 会卡成幻灯片），松手再精确算一次
    网.拖中 = true;
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      el.removeEventListener('pointermove', 移);
      el.removeEventListener('pointerup', 停);
      网.拖中 = false;
      画线();
      存布局();
    };
    el.addEventListener('pointermove', 移);
    el.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(实.id));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// ── 走线 ────────────────────────────────────────────────
//
// 只走横平竖直，绕开挡路的框。
//
// 为什么正交：曲线绕过框时曲率大的地方会跟框的边界糊在一起，
// 看着像「线连到了那个框上」—— 学术里管这叫 edge ambiguity
// （Ambiguity-Free Edge-Bundling, TVCG：线重叠在不相关节点上会让人误判连接关系）。
// Unreal 的 Gridline Blueprints 就是「正交 + 节点避让 + 线间距」三件套，
// 这里抄前两件，线间距用「起点按框高散开」顶上。
function 竖段干净(x, 上, 下, 框位, 自id, 到id) {
  const 留 = 12;
  for (const [id, b] of 框位) {
    if (id === 自id || id === 到id) continue;
    if (x > b.x - 留 && x < b.x + b.w + 留 && 下 > b.y - 留 && 上 < b.y + b.h + 留) return false;
  }
  return true;
}

// ── 走线两种画法，可切 ───────────────────────────────────
//
// 曲线：Blender / Unreal / Unity Shader Graph 的默认形态（noodle）。
//       控制点沿出口方向水平拉开，短距离收紧、长距离张开 ——
//       ComfyUI 的 NKD Reroutes 把这个叫 elasticity。
// 正交：电路板走线。Unreal 的 Electronic Nodes / Gridline Blueprints 那一路，
//       卖点是「gets rid of the usual spaghetti mess」。
//
// 实测正交的难处：Slider(599-670) 和 Cube(526-631) 水平几乎重叠，中间还夹着 coin，
// 竖段放哪儿都撞，于是被一路推到画布外再绕回来 —— 量出来宽 703 高 836，绕了大半张图。
// 曲线不受这个约束，弯过去就行。所以默认用曲线。
// 在控制台 `走线法='正交'; 画线()` 可以切回去比。
let 走线法 = '曲线';

// 选从源框哪一边连到目标框哪一边。
//
// 光比中心会失手：Slider(599-670) 中心 634 在 Cube(526-631) 中心 578 右边，
// 判成「往右」，于是用 Slider 右边(670) → Cube 左边(526) —— 可 670 > 526，
// 两端前后颠倒。贝塞尔的控制点会朝「出口方向」伸，方向一颠倒就伸进源框内部，
// 线从框里穿出去（实测截图里那条斜穿底边的线就是它）。
//
// 换成按端点选：哪种连法的两端不打架就用哪种。
//
// ⚠️ 但光按端点还不够 —— 两个框**上下相邻、左右重叠**时（coin 在 Cube 正下方，
//    水平完全落在 Cube 的范围里），左右两种连法都不成立，退成「源左 → 目标右」，
//    结果 x1=coin.left(565)、x2=Cube.right(851)，这整条线都躺在 Cube 的 x 范围里，
//    等于从 Cube 框内部出发、钻出底边。截图里那两条就是从这儿来的。
//
//    所以先判上下：横向重叠、纵向不重叠时，走上下边。
function 连哪边(源, 的) {
  const 横叠 = 的.x < 源.x + 源.w && 的.x + 的.w > 源.x;
  const 纵离 = 的.y >= 源.y + 源.h || 的.y + 的.h <= 源.y;
  if (横叠 && 纵离) return { 竖: true, 往下: 的.y > 源.y };

  const dA = 的.x - (源.x + 源.w);          // 源右 → 目标左（往右）
  if (dA > 0) return { 往右: true, x1: 源.x + 源.w, x2: 的.x };
  const dB = (的.x + 的.w) - 源.x;          // 源左 → 目标右（往左要 dB<0）
  if (dB < 0) return { 往右: false, x1: 源.x, x2: 的.x + 的.w };
  return { 往右: true, x1: 源.x, x2: 的.x + 的.w };
}

// ── 连线形状（参数化贝塞尔）────────────────────────────
//
// 依据见 `连线调研.md`：
//   · 交叉是可读性第一位，弯曲第二（Purchase / Ware 2003）。换算：一次交叉 ≈ 38° 弯曲。
//   · 正交图交叉最少却最难读（Dwyer 2009）—— 所以不用直角折线。
//   · 控制点长度这套来自 ComfyUI-NKD-Reroutes 的那 11 个参数：
//       elasticity  短线收紧、长线张开
//       handle 上限  不超过水平间距的一半，否则短线打 S 形折返
//       node body   两个节点挨很近时留一点弯，线不会缩成一条边

// 两边之间该伸多长（控制点到端点的距离）
//
// 0.34 这个系数是「Handle ceiling」：控制点不超过两端水平距离的三分之一。
// 超过一半，短距离的线会先往外甩再折回来，看着像打了个 S 结（实测 0.5 就是这样）。
function 控制长(x1, y1, x2, y2) {
  const 横 = Math.abs(x2 - x1), 纵 = Math.abs(y2 - y1);
  const 主 = Math.max(横, 纵, 1);
  return Math.max(14, Math.min(主 * 0.34, 170));
}

function 沿向伸(向, x, y, 伸) {
  if (向 === '左') return [x - 伸, y];
  if (向 === '右') return [x + 伸, y];
  if (向 === '上') return [x, y - 伸];
  return [x, y + 伸];
}

// 起终点各朝自己那一侧伸控制点。
function 曲线路向(x1, y1, x2, y2, 起向, 终向) {
  const 伸 = 控制长(x1, y1, x2, y2);
  const [c1x, c1y] = 沿向伸(起向, x1, y1, 伸);
  const [c2x, c2y] = 沿向伸(终向, x2, y2, 伸);
  const 数 = v => Math.round(v * 10) / 10;
  return `M ${数(x1)} ${数(y1)} C ${数(c1x)} ${数(c1y)}, ${数(c2x)} ${数(c2y)}, ${数(x2)} ${数(y2)}`;
}

// 同一个形状采成点列 —— 判「有没有穿别人的框」用它。
// 控制点算法必须跟 曲线路向() 一模一样，不然判的是一条线、画的是另一条。
function 曲线点向(x1, y1, x2, y2, 起向, 终向, 段数 = 24) {
  const 伸 = 控制长(x1, y1, x2, y2);
  const [c1x, c1y] = 沿向伸(起向, x1, y1, 伸);
  const [c2x, c2y] = 沿向伸(终向, x2, y2, 伸);
  const 点 = [];
  for (let i = 0; i <= 段数; i++)
    点.push(贝塞尔(x1, y1, c1x, c1y, c2x, c2y, x2, y2, i / 段数));
  return 点;
}

function 曲线路(x1, y1, x2, y2) {
  const 距 = Math.abs(x2 - x1);
  const 伸 = Math.min(Math.max(距 * 0.5, 30), 180);
  const 朝 = x2 >= x1 ? 1 : -1;
  return `M ${x1} ${y1} C ${x1 + 朝 * 伸} ${y1}, ${x2 - 朝 * 伸} ${y2}, ${x2} ${y2}`;
}

// 穿点成曲线（Catmull-Rom 转三次贝塞尔）。
//
// libavoid 给的是直角的拐点，照着连就是电路板。这里把这些拐点当**路标**，
// 曲线从它们中间圆滑穿过 —— 用 Unreal / Blender 那种 noodle 的手感。
//
// ⚠️ 圆滑会「切角」：两条正交段相交的那个直角，曲线会抄近道切过去。
//    切掉多少取决于张力。默认 1/6（Catmull-Rom 的标准值）在转角处大约切
//    掉拐点两侧各 1/6 段长；libavoid 的 obstacleMargin 是 10px，够兜。
function 样条成路(点们) {
  if (!点们 || 点们.length < 2) return '';
  const 数 = v => Math.round(v * 10) / 10;
  if (点们.length === 2) {
    return `M ${数(点们[0][0])} ${数(点们[0][1])} L ${数(点们[1][0])} ${数(点们[1][1])}`;
  }
  let d = `M ${数(点们[0][0])} ${数(点们[0][1])}`;
  for (let i = 0; i < 点们.length - 1; i++) {
    const p0 = 点们[i - 1] || 点们[i];
    const p1 = 点们[i];
    const p2 = 点们[i + 1];
    const p3 = 点们[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${数(c1x)} ${数(c1y)}, ${数(c2x)} ${数(c2y)}, ${数(p2[0])} ${数(p2[1])}`;
  }
  return d;
}

// 竖着连（源在上、目标在下，或反过来）：控制点沿竖直方向拉开。
function 曲线路竖(x1, y1, x2, y2) {
  const 距 = Math.abs(y2 - y1);
  const 伸 = Math.min(Math.max(距 * 0.45, 26), 150);
  const 朝 = y2 >= y1 ? 1 : -1;
  return `M ${x1} ${y1} C ${x1} ${y1 + 朝 * 伸}, ${x2} ${y2 - 朝 * 伸}, ${x2} ${y2}`;
}

function 选走线(x1, y1, x2, y2, 框位, 自id, 到id, 竖) {
  if (走线法 === '正交') {
    if (竖) {
      const 中y = (y1 + y2) / 2;
      return 折线成路([[x1, y1], [x1, 中y], [x2, 中y], [x2, y2]], 14);
    }
    return 折线成路(正交点(x1, y1, x2, y2, 框位, 自id, 到id), 14);
  }

  // ── 曲线 + 该避的时候才避 ──
  //
  // 曲线好看（短距离就该是软的），但它**一点避让都没有**：中间横着个框，
  // 它就从框里穿过去。学术里叫 edge ambiguity
  // （Ambiguity-Free Edge-Bundling, TVCG：线压在不相关节点上会让人误判连接关系）。
  //
  // 所以不是把曲线全改成折线，而是：
  //   1. 先按曲线密采样 —— 连**自己的框**算进去之后罚分都是 0 → 就是它，原样返回
  //   2. 罚分了 → 拿穿过的那些框当障碍，生成「上/下/左/右」四种绕法
  //   3. 四种都密采样算罚分+长度，选最好的，拐角磨圆
  //
  // ⚠️ 这里踩过一次：第一版判「撞没撞」时把源框和目标框整个排除了，
  //    理由是「口长在框里，出去必然穿一小段」。这个豁免太宽 ——
  //    从边上出去 20px 和横穿 300px 被当成了同一件事，
  //    于是 enemy→Cube 那八条线横穿 enemy 整个框，判据说「全部干净」。
  //    改成量**长度**（穿账），超过 框内可忍 才罚。
  const 曲线点 = 密采样(曲线采样(x1, y1, x2, y2, 竖));
  if (穿框罚分(曲线点, 框位, 自id, 到id) === 0) return 竖 ? 曲线路竖(x1, y1, x2, y2) : 曲线路(x1, y1, x2, y2);

  // 障碍 = 这条曲线真穿过的框（含自己的框 —— 它也可能正是被穿的那一个）
  const 障碍 = [...穿账(曲线点, 框位).keys()].map(id => 框位.get(id)).filter(Boolean);
  let 最好 = null, 最好分 = Infinity;
  for (const 点们 of 绕行候选(x1, y1, x2, y2, 障碍, 竖)) {
    const 密 = 密采样(点们);
    const 分 = 穿框罚分(密, 框位, 自id, 到id) + 点列长度(密);
    if (分 < 最好分) { 最好分 = 分; 最好 = 点们; }
  }
  // 四种都还穿的话，也是「穿得最少的那条」比原曲线强，照样用
  return 最好 ? 折线成路(最好, 14) : (竖 ? 曲线路竖(x1, y1, x2, y2) : 曲线路(x1, y1, x2, y2));
}

// 同上，但把分数也带出来 —— 调用方要用它挑「从哪条边出去最好」。
//
// 为什么要挑：出/入框方向不能靠「取最近的那条边」猜。
// Coin(614~794) 与 Cube(734~1027) 水平重叠，Coin 的右边界 794 正好**落在 Cube 里面**，
// 那时「最近的边」恰恰是最差的边 —— 线一出去就已经在 Cube 肚子里了。
// 所以把几种出入口组合都算一遍，用分数挑。
function 选走线评分(x1, y1, x2, y2, 框位, 自id, 到id, 竖) {
  const 首点 = 密采样(曲线采样(x1, y1, x2, y2, 竖));
  const 首罚 = 穿框罚分(首点, 框位, 自id, 到id);
  if (首罚 === 0) {
    return { d: 竖 ? 曲线路竖(x1, y1, x2, y2) : 曲线路(x1, y1, x2, y2), 分: 点列长度(首点), 罚: 0 };
  }
  const 障碍 = [...穿账(首点, 框位).keys()].map(id => 框位.get(id)).filter(Boolean);
  let 最好点 = null, 最好罚 = Infinity, 最好长 = 0;
  for (const 点们 of 绕行候选(x1, y1, x2, y2, 障碍, 竖)) {
    const 密 = 密采样(点们);
    const 罚 = 穿框罚分(密, 框位, 自id, 到id);
    if (罚 < 最好罚) { 最好罚 = 罚; 最好点 = 点们; 最好长 = 点列长度(密); }
  }
  if (最好点) return { d: 折线成路(最好点, 14), 分: 最好罚 + 最好长, 罚: 最好罚 };
  return { d: 竖 ? 曲线路竖(x1, y1, x2, y2) : 曲线路(x1, y1, x2, y2), 分: Infinity, 罚: Infinity };
}

// 一个点在框里的哪条边最近 —— 线从口出去时走这条，别横穿自己的框。
//
// ⚠️ 原来的方向判断是「目标在左就往左出」，完全不看口本身在框里的哪边。
//    实测 enemy 那个口的 x=1850、框是 1555~1905：口本来就在框的右侧，
//    可目标 Cube 在左边，于是线从口往左走，**横穿 enemy 整个框 295px** 才出去。
//    截图里那束「从框里面长出来横着穿过去」的线就是这么来的。
//    正确的出口是离口最近的那条边 —— 那样框内的那段才最短。
function 最近边(点, 框) {
  const 到左 = 点.x - 框.x, 到右 = 框.x + 框.w - 点.x;
  const 到上 = 点.y - 框.y, 到下 = 框.y + 框.h - 点.y;
  const 最小 = Math.min(到左, 到右, 到上, 到下);
  if (最小 === 到左) return { x: 框.x, y: 点.y, 边: '左', 距: 到左 };
  if (最小 === 到右) return { x: 框.x + 框.w, y: 点.y, 边: '右', 距: 到右 };
  if (最小 === 到上) return { x: 点.x, y: 框.y, 边: '上', 距: 到上 };
  return { x: 点.x, y: 框.y + 框.h, 边: '下', 距: 到下 };
}

// 框内那一段允许多长。口本来就长在框里，出去必然要走一小段 —— 那是它该走的路。
// 超过这个数就说明它在框里横穿了，得改从别的边走。
const 框内可忍 = 70;



// 三次贝塞尔取一个点
function 贝塞尔(x1, y1, c1x, c1y, c2x, c2y, x2, y2, t) {
  const u = 1 - t;
  return [u * u * u * x1 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x2,
          u * u * u * y1 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y2];
}

// 按当前走线法把一条曲线采成点列 —— 判「撞没撞框」要用它。
// 控制点的算法必须跟 曲线路() / 曲线路竖() 完全一致，不然判的是一条线、画的是另一条。
function 曲线采样(x1, y1, x2, y2, 竖, 段数 = 30) {
  const 点 = [];
  if (竖) {
    const 距 = Math.abs(y2 - y1);
    const 伸 = Math.min(Math.max(距 * 0.45, 26), 150);
    const 朝 = y2 >= y1 ? 1 : -1;
    for (let i = 0; i <= 段数; i++)
      点.push(贝塞尔(x1, y1, x1, y1 + 朝 * 伸, x2, y2 - 朝 * 伸, x2, y2, i / 段数));
  } else {
    const 距 = Math.abs(x2 - x1);
    const 伸 = Math.min(Math.max(距 * 0.5, 30), 180);
    const 朝 = x2 >= x1 ? 1 : -1;
    for (let i = 0; i <= 段数; i++)
      点.push(贝塞尔(x1, y1, x1 + 朝 * 伸, y1, x2 - 朝 * 伸, y2, x2, y2, i / 段数));
  }
  return 点;
}

// 折线首尾之间补点。只拿 4 个拐点去判撞框会漏 —— 长直段整个跳过去了。
function 密采样(点们, 步 = 4) {
  if (!点们 || !点们.length) return [];
  const 出 = [点们[0]];
  for (let i = 1; i < 点们.length; i++) {
    const [ax, ay] = 点们[i - 1], [bx, by] = 点们[i];
    const 长 = Math.hypot(bx - ax, by - ay);
    const n = Math.max(1, Math.ceil(长 / 步));
    for (let k = 1; k <= n; k++) 出.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
  }
  return 出;
}

// 这条点列穿过了哪些**不相干**的框。
// 源框和目标框排除 —— 线落在「脚本行」上，行在框内部，从框边进到那一行
// 这条点列在每个框里各走了多长。
//
// ⚠️ 不能只判「碰没碰到」：源框和目标框是必然要碰的（口就长在框里），
//    但「从边上进来 20px」和「横穿 300px」完全是两回事 —— 前者是它该走的路，
//    后者就是使用者截图里骂的那件事。所以这里量的是**长度**，不是布尔值。
const 避让步长 = 4;

function 穿账(点们, 框位) {
  const 账 = new Map();
  for (const [x, y] of 点们) {
    for (const [id, b] of 框位) {
      if (x > b.x + 2 && x < b.x + b.w - 2 && y > b.y + 2 && y < b.y + b.h - 2)
        账.set(id, (账.get(id) || 0) + 避让步长);
    }
  }
  return 账;
}

// 穿框罚分：不相干的框一点都不能进（每 px 罚 1）；
// 源框和目标框允许「出/入的那一小段」，超了才罚。
// 乘 200 是为了让它**压过长度**：宁可绕远，也别横穿（Yeh 2009 DD-1 的优先级：
// collision avoidance > flow direction > crossing > bends > length）。
function 穿框罚分(点们, 框位, 自id, 到id) {
  const 账 = 穿账(点们, 框位);
  let 罚 = 0;
  for (const [id, 米] of 账) {
    const 容忍 = (id === 自id || id === 到id) ? 框内可忍 : 0;
    if (米 > 容忍) 罚 += (米 - 容忍) * 200;
  }
  return 罚;
}

const 避让边距 = 16;

// 一条点列有没有钻进**第三者的**框里（源框、目标框不算 —— 口就长在它们里面）。
// 布尔 + 早停：一碰到就返回，不比「算了多少 px」那种贵。
function 撞了第三框(点们, 框位, 自id, 到id) {
  for (const [x, y] of 点们) {
    for (const [id, b] of 框位) {
      if (id === 自id || id === 到id) continue;
      if (x > b.x + 2 && x < b.x + b.w - 2 && y > b.y + 2 && y < b.y + b.h - 2) return true;
    }
  }
  return false;
}

function 点列长度(点们) {
  let 长 = 0;
  for (let i = 1; i < 点们.length; i++) 长 += Math.hypot(点们[i][0] - 点们[i - 1][0], 点们[i][1] - 点们[i - 1][1]);
  return 长;
}

// 几种绕法：从障碍的上方 / 下方 / 左方 / 右方兜过去。
//
// 只用**真挡路的那些框**算边界，不是全图 —— 拿全图包围盒会绕出去半张画布
// （正交那版的实测教训：量出来宽 703 高 836）。全都生成，交给调用方按罚分+长度选。
function 绕行候选(x1, y1, x2, y2, 障碍, 竖) {
  const 出 = [];
  if (!障碍 || !障碍.length) return 出;
  let 上 = Infinity, 下 = -Infinity, 左 = Infinity, 右 = -Infinity;
  for (const b of 障碍) {
    上 = Math.min(上, b.y); 下 = Math.max(下, b.y + b.h);
    左 = Math.min(左, b.x); 右 = Math.max(右, b.x + b.w);
  }
  上 -= 避让边距; 下 += 避让边距; 左 -= 避让边距; 右 += 避让边距;

  // 上下兜（两端各自先竖直出去，再横向走）
  出.push([[x1, y1], [x1, 上], [x2, 上], [x2, y2]]);
  出.push([[x1, y1], [x1, 下], [x2, 下], [x2, y2]]);
  // 左右兜
  出.push([[x1, y1], [左, y1], [左, y2], [x2, y2]]);
  出.push([[x1, y1], [右, y1], [右, y2], [x2, y2]]);
  // 竖着连的时候优先左右兜，但同时兜还是给上 —— 万一障碍在两侧
  return 竖 ? 出.reverse() : 出;
}

// 从 (x1,y1) 到 (x2,y2) 的一条正交折线，返回**点列表**（不是 path 字符串）。
// 中间竖段从正中往两边试，取第一个不穿过别的框的位置 —— 找不到就用正中。
//
// ⚠️ 两个方向都得能走。原来只会「源右 → 目标左」，碰上目标在左边就硬绕一个大回环
//    （实测绕到画布顶部横跨半张图），丑而且根本跟不住。现在调用方按目标方向选出口边，
//    这里只负责在两点之间找一条干净的竖段。
function 正交点(x1, y1, x2, y2, 框位, 自id, 到id) {
  const 左 = Math.min(x1, x2), 右 = Math.max(x1, x2);
  const 上 = Math.min(y1, y2), 下 = Math.max(y1, y2);

  // 两点横向几乎重合：没地方放竖段，先竖后横（Unreal「竖段侧移」的简化版）
  if (右 - 左 < 28) return [[x1, y1], [x1, y2], [x2, y2]];

  const 中 = (x1 + x2) / 2;
  let mx = 中;
  if (!竖段干净(中, 上, 下, 框位, 自id, 到id)) {
    for (let k = 1; k <= 20; k++) {
      const a = 中 - k * 28, b = 中 + k * 28;
      if (a > 左 + 14 && 竖段干净(a, 上, 下, 框位, 自id, 到id)) { mx = a; break; }
      if (b < 右 - 14 && 竖段干净(b, 上, 下, 框位, 自id, 到id)) { mx = b; break; }
    }
  }
  return [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
}

// 把折线的拐角磨成圆弧。
//
// 为什么：直角走线看着像电路板上的生硬铜线，四个尖角并排就是"丑"的来源。
// 真实 PCB 走线的转角是圆的。加圆角不改变走向 —— 该绕的框还是绕开了 ——
// 但线条立刻从「硬折」变成「转弯」。
// 半径取 min(角半径, 相邻两段长的一半)，短段不会被圆弧吃掉。
function 折线成路(点们, 角半径) {
  if (点们.length < 2) return '';
  const 段长 = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const 数 = v => (Math.round(v * 10) / 10);
  let d = `M ${数(点们[0][0])} ${数(点们[0][1])}`;
  for (let i = 1; i < 点们.length - 1; i++) {
    const p0 = 点们[i - 1], p1 = 点们[i], p2 = 点们[i + 1];
    const l1 = 段长(p0, p1), l2 = 段长(p1, p2);
    const rr = Math.min(角半径, l1 / 2, l2 / 2);
    if (rr < 1) { d += ` L ${数(p1[0])} ${数(p1[1])}`; continue; }
    const u1 = [(p1[0] - p0[0]) / (l1 || 1), (p1[1] - p0[1]) / (l1 || 1)];
    const u2 = [(p2[0] - p1[0]) / (l2 || 1), (p2[1] - p1[1]) / (l2 || 1)];
    const a = [p1[0] - u1[0] * rr, p1[1] - u1[1] * rr];
    const b = [p1[0] + u2[0] * rr, p1[1] + u2[1] * rr];
    d += ` L ${数(a[0])} ${数(a[1])} Q ${数(p1[0])} ${数(p1[1])} ${数(b[0])} ${数(b[1])}`;
  }
  const 末 = 点们[点们.length - 1];
  d += ` L ${数(末[0])} ${数(末[1])}`;
  return d;
}

// 悬停一个框：只留跟它有关的那几根线。
// 一次只看一束 —— 这比任何走线算法都管用。
function 点亮(id) {
  const 层 = 网.线层;
  if (!层 || !id) return;
  const 相关 = new Set([id]);
  for (const p of 层.querySelectorAll('path[data-自]')) {
    const 自 = p.dataset.自, 到 = p.dataset.到;
    if (自 === id || 到 === id) {
      相关.add(自); 相关.add(到);
      p.classList.add('亮'); p.classList.remove('暗');
    } else {
      p.classList.add('暗'); p.classList.remove('亮');
    }
  }
  // 挂在它身上的空头框也算「有关」—— 那是它缺的东西
  for (const 空 of 网.空头们 || []) if (空.自 === id) 相关.add(空.id);
  for (const f of 网.层.querySelectorAll('.实例框')) {
    f.classList.toggle('暗', !!f.dataset.id && !相关.has(f.dataset.id));
  }
}

function 熄灭() {
  const 层 = 网.线层;
  if (!层) return;
  for (const p of 层.querySelectorAll('path[data-自]')) p.classList.remove('暗', '亮');
  for (const f of 网.层.querySelectorAll('.实例框')) f.classList.remove('暗');
}

// 线：从出口点连到目标实例框的左边。
// 目标找不到就不画 —— 画不出来就是画不出来，别假装连上了。
function 画线() {
  if (!网.线层) return;
  const 层 = 网.线层;
  层.textContent = '';
  const 框位 = new Map();
  for (const el of 网.层.querySelectorAll('.实例框')) {
    框位.set(el.dataset.id, { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0,
      w: el.offsetWidth, h: el.offsetHeight });
  }

  const 画一条 = (d, 颜色, 粗, 自, 到, 虚线) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 颜色);
    p.setAttribute('stroke-width', 粗);
    p.setAttribute('stroke-linejoin', 'round');
    if (虚线) p.setAttribute('stroke-dasharray', 虚线);
    p.setAttribute('opacity', '0.8');
    if (自) p.dataset.自 = 自;
    if (到) p.dataset.到 = 到;
    层.appendChild(p);
    return p;
  };
  // 箭头指向线进来的方向。上下连的时候箭头得朝上/朝下，不能一律朝右。
  const 画箭头 = (x, y, 颜色, 自, 到, 朝) => {
    const 型 = {
      右: 'l -8 -4 l 0 8 z',
      左: 'l 8 -4 l 0 8 z',
      下: 'l -4 -8 l 8 0 z',
      上: 'l -4 8 l 8 0 z',
    }[朝] || 'l -8 -4 l 0 8 z';
    const h = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    h.setAttribute('d', `M ${x} ${y} ${型}`);
    h.setAttribute('fill', 颜色);
    if (自) h.dataset.自 = 自;
    if (到) h.dataset.到 = 到;
    层.appendChild(h);
  };

  // 落点：每个「实例 + 脚本名」对应哪一行 DOM。
  // 线要落在这一行上，不落在实例框整条边上 —— b459：「先连到脚本边框，再连到外面」。
  //
  // ⚠️ 这里错过一次，就是「线连到别的块上」的真正原因：
  //    原来只写一个键，且把 `EnemyHp[2]` 归一成 `EnemyHp` 再 set ——
  //    于是后写的 `EnemyHp[2]` **覆盖**了真正的 `EnemyHp`。
  //    Cube 的三条出口都写着「到 EnemyHp」，查出来全指向 `EnemyHp[2]` 那一行，
  //    三条线叠在同一行上，看起来就是「连错了块」。
  //
  //    现在两个键都存：精确名（`EnemyHp[2]`）单独一个，去后缀的简名如果**还没人占**才用。
  //    DOM 顺序里 `EnemyHp` 在 `EnemyHp[2]` 前面，所以简名留在真正的第一个上。
  const 行表 = new Map();
  for (const 框el of 网.层.querySelectorAll('.实例框')) {
    const 实id = 框el.dataset.id;
    for (const 行框 of 框el.querySelectorAll('.脚本框')) {
      const 全名 = String(行框.dataset.名 || '');
      行表.set(实id + '\u0001' + 全名, 行框);
      const 简名 = 全名.replace(/\[\d+\]$/, '');
      const 简键 = 实id + '\u0001' + 简名;
      if (!行表.has(简键)) 行表.set(简键, 行框);
    }
  }
  // DOM 屏幕坐标 → #world 坐标（#world 有 translate+scale，origin 0 0）
  const 世界r = 世界.getBoundingClientRect();
  const 换算 = el => {
    const r = el.getBoundingClientRect();
    const z = 视.z || 1;
    return { 左: (r.left - 世界r.left) / z, 右: (r.left + r.width - 世界r.left) / z,
             上: (r.top - 世界r.top) / z, 下: (r.top + r.height - 世界r.top) / z,
             中y: (r.top + r.height / 2 - 世界r.top) / z,
             中x: (r.left + r.width / 2 - 世界r.left) / z };
  };

  // ══ 先收齐所有边，**一次**算路 ══
  //
  // 为什么不能一条一条算：绕障之外还有一件更要紧的事 —— **平行线不许重合**。
  // 两条线并排走同一段时，读者分不出它们各自从哪来。
  // 这件事只有「全图一起算」才能做（libavoid 的 nudge / 通道分离）。
  // 我之前是每条线各算各的，四选一兜法，出来就是楼梯，所以看着丑。
  //
  // 端点推到**框边界**上：libavoid 的端点落进障碍里会直接退化成一刀直线（实测过）。
  // 框里那一小段（行↔框边）留下来当 stub，单独画。
  const 边们 = [];
  for (const 实 of 网.实例们) {
    const 源 = 框位.get(实.id);
    if (!源) continue;
    const 出 = [];
    for (const s of 实.脚本 || [])
      for (let k = 0; k < (s.出口 || []).length; k++) {
        const 出口 = s.出口[k];
        if (!出口.到 || 出口.到 === 实.id) continue;
        if (!框位.has(出口.到)) continue;
        出.push({ s, k, 出口 });
      }
    for (const { s, k, 出口 } of 出) {
      const 的 = 框位.get(出口.到);
      const 源行 = 行表.get(实.id + '\u0001' + String(s.名 || ''));
      // ⚠️ 按 data-口 找，不能按顺序取 —— 口现在分左右两组，
      //    节点里先出现左组再出现右组，querySelectorAll 的顺序跟 k 对不上。
      const 源点 = 源行 ? 源行.querySelector('.脚本口 i[data-口="' + k + '"]') : null;
      const 目标行 = 行表.get(出口.到 + '\u0001' + String(出口.到类型 || ''));
      if (!目标行) continue;      // 连的是 Unity 内置组件，交给下面的组件口

      const a = 源点 ? 换算(源点) : null;
      const b = 换算(目标行);
      const 连 = 连哪边(源, 的);
      // 口该在哪一侧：目标框在源框右边就放右，反之放左。
      //
      // ⚠️ 用 框位（= el.style.left，跟 DOM 一致），**不要用 网.位置** ——
      //    实测两者会不同步（enemy 内存 x=1206、DOM left=-354），
      //    拿内存坐标判会把口放到完全相反的一侧，线就从框的另一头绕出去。
      //    这里顺手把口挪过去，所以拖框改变相对位置时，口会自己换边。
      const 该侧 = (的.x >= 源.x) ? '右' : '左';
      if (源点 && 源点.dataset.侧 !== 该侧 && 源行) {
        const 容器 = 源行.querySelector('.脚本口.' + 该侧);
        if (容器) {
          容器.appendChild(源点);
          源点.dataset.侧 = 该侧;
          容器.style.display = '';
          // 对面那个空了就收起来，不占位置
          const 对面 = 源行.querySelector('.脚本口.' + (该侧 === '右' ? '左' : '右'));
          if (对面 && !对面.childElementCount) 对面.style.display = 'none';
        }
      }
      const 从左侧出 = 源点 ? 源点.dataset.侧 === '左' : false;

      // 端点就放在**口上 / 目标行上**，不推到框边界。
      //
      // 试过推到边界（那样看起来更"干净"），结果绕成迷宫：
      // enemy 的八个口都在框的右侧，目标 Cube 在左边，从「最近的边」出去之后
      // 得横跨整张图才能绕到左边 —— 一圈一圈像迷宫，还更慢。
      // 现在把源框和目标框从障碍里拿掉，线从口直接出发，只绕**第三个框**。
      // 这正是 Unreal Blueprint / Blender 的做法：noodle 从 pin 长出来，穿过自己那个节点。
      const 源心 = a ? { x: a.中x, y: a.中y } : { x: 源.x + 源.w / 2, y: 源.y + 源.h / 2 };
      // 终点：目标行的**朝向线来的那一侧**。线从左边来就接行的左边缘，从右边来就接右边缘。
      // 接行中心的话，线会先切进半个行宽再停，看着像「插进块里」。
      const 从右来 = 源心.x >= b.中x;
      const 端心 = { x: 从右来 ? b.右 : b.左, y: b.中y };
      // 起向 = 口在哪一侧；终向 = 控制点朝线的来向伸（跟起向相反那侧）
      const 起向 = 从左侧出 ? '左' : '右';
      const 终向 = 从右来 ? '右' : '左';

      边们.push({
        id: 实.id + '\u0002' + 出口.到 + '\u0002' + (s.名 || '') + '\u0002' + k,
        自: 实.id, 到: 出口.到,
        题: (s.名 || '') + ' · ' + (出口.名 || '') + (出口.条件 ? ' — ' + 出口.条件 : '') + ' → ' + (出口.到类型 || ''),
        源点: 源心, 终点: 端心, 起向, 终向,
        // ⚠️ 箭头朝**行进方向**：线从左边来、往右扎，箭头就朝右。
        //    这里错过一次，写成「从右来 ? 右 : 左」，箭头全反着指。
        朝: 从右来 ? '左' : '右',
      });
    }
  }

  let 路由 = null;
  // 拖动中不算全图路由 —— libavoid 一次要 130ms（32 条边 26 个障碍），
  // 每帧调一次就是「拖着拖着卡成幻灯片」。拖动时先用直角折顶着，
  // 松手（pointerup）会再画一次，那一次走完整算法。
  // 这是编辑器里的常规做法：拖动降级，静止精确。
  const 可算 = 边们.length && window.libavoided && !网.拖中;
  if (可算) {
    // 障碍 = 别的框。源框和目标框不算 —— 口就长在它们里面，不让穿等于自断起终点。
    const 站边 = new Set(边们.flatMap(e => [e.自, e.到]));
    try {
      路由 = window.libavoided.routeEdges({
        obstacles: [...框位].filter(([id]) => !站边.has(id))
          .map(([id, b]) => ({ id, x: b.x, y: b.y, width: b.w, height: b.h })),
        edges: 边们.map(e => ({ id: e.id, sourcePoint: e.源点, targetPoint: e.终点 })),
      }, {
        // 这些数字就是「好不好看」本身。
        // ⚠️ 画法从直角折线改成曲线之后，bendPenalty 必须跟着降 ——
        //    直角折线上每个拐弯都是一个刺眼的折点，罚得重是对的；
        //    曲线拐弯本来就顺，再罚重它就会为了少拐一次而绕出去一大圈。
        //    （实测 320 → 出图是满屏大回环）
        obstacleMargin: 8,
        edgeSpacing: 5,
        bendPenalty: 70,
        crossingPenalty: 60,
        lengthPenalty: 1,
      });
    } catch (错) {
      路由 = null;
      console.warn('libavoid 走线失败，退回直连：', 错 && 错.message);
    }
  }
  const 路表 = new Map();
  if (路由 && Array.isArray(路由.edges)) {
    for (const e of 路由.edges) {
      const sec = e.sections && e.sections[0];
      if (!sec) continue;
      路表.set(e.id, [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint]);
    }
  }

  for (const e of 边们) {
    const 路 = 路表.get(e.id);
    // 默认：一条方向化的贝塞尔（口在哪侧就从哪侧伸控制点）
    const 直点 = 曲线点向(e.源点.x, e.源点.y, e.终点.x, e.终点.y, e.起向, e.终向, 24);
    const 直长 = 点列长度(直点);

    let 点们 = 直点.map(p => ({ x: p[0], y: p[1] }));
    let 用贝塞尔 = true;
    // ⚠️ 这里只做布尔判断、而且用早停 —— 一开始写的是「算每条线在每个框里各走了多少 px」，
    //    32 条线 × 两次 × 几百个采样点 × 26 个框，一次画线 561ms。
    const 直撞三 = 撞了第三框(直点, 框位, e.自, e.到);
    if (直撞三 && 路 && 路.length >= 2) {
      const 绕点 = 路.map(p => [p.x, p.y]);
      const 绕长 = 点列长度(绕点);
      // 绕行短于 1.6 倍才值得。绕成两倍以上，还不如让线直接穿过去 ——
      // Unreal / Blender 的 noodle 本来就穿节点（Ware 2003：多出来的弯曲也很贵）。
      if (绕长 < 直长 * 1.6) { 点们 = 绕点.map(p => ({ x: p[0], y: p[1] })); 用贝塞尔 = false; }
    }
    // 兜底：libavoid 没算出结果时也画，不能没线
    if (!点们 || 点们.length < 2) {
      点们 = [e.源点, { x: e.终点.x, y: e.源点.y }, e.终点];
      用贝塞尔 = false;
    }
    // 相邻重合点去掉，否则圆角会算出 NaN
    const 清 = [];
    for (const p of 点们) {
      const 末 = 清[清.length - 1];
      if (!末 || Math.abs(末.x - p.x) > 0.01 || Math.abs(末.y - p.y) > 0.01) 清.push(p);
    }
    // 没被挡 → 一条干净的贝塞尔（这就是 Unreal/Blender 那个形状）。
    // 被挡且绕得不多 → libavoid 给的轨道，用 Catmull-Rom 揉顺（轨道定去哪儿，曲线是外观）。
    const d = 用贝塞尔
      ? 曲线路向(e.源点.x, e.源点.y, e.终点.x, e.终点.y, e.起向, e.终向)
      : 样条成路(清.map(p => [p.x, p.y]));
    const p = 画一条(d, '#7a6a3f', 1.2, e.自, e.到);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    t.textContent = e.题;
    p.appendChild(t);
    画箭头(e.终点.x, e.终点.y, '#7a6a3f', e.自, e.到, e.朝);
  }


  // 人指定的线：你在空头框上右键说「它其实连到谁」。
  // 用虚线画 —— 扫描出来的那些是事实，这条是你说的，得一眼分得开。
  for (const 线 of 网.人线们 || []) {
    const 源 = 框位.get(线.自);
    const 的 = 框位.get(线.到);
    if (!源 || !的) continue;
    const 连 = 连哪边(源, 的);
    let x1, y1, x2, y2, 朝;
    if (连.竖) {
      x1 = Math.round(源.x + 源.w * 0.5);
      y1 = 连.往下 ? 源.y + 源.h : 源.y;
      x2 = Math.round(的.x + 的.w * 0.5);
      y2 = 连.往下 ? 的.y : 的.y + 的.h;
      朝 = 连.往下 ? '下' : '上';
    } else {
      x1 = 连.x1; y1 = 源.y + 实例头高 + 10;
      x2 = 连.x2; y2 = 的.y + 的.h / 2;
      朝 = 连.往右 ? '右' : '左';
    }
    const d = 选走线(x1, y1, x2, y2, 框位, 线.自, 线.到, 连.竖);
    const p = 画一条(d, '#6fb98d', 1.4, 线.自, 线.到, '6 4');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    t.textContent = '你指定的连接：' + (线.说明 || '');
    p.appendChild(t);
    画箭头(x2, y2, '#6fb98d', 线.自, 线.到, 朝);
  }

  // 空头：从「伸出去的那个口」连到空头框。
  // 不画箭头 —— 它本来就是「接不上的那一截」，画个箭头就成接上了。
  //
  // ⚠️ 起点不能再用实例框的底边。组件头是某个具体脚本的第 k 个出口长出来的，
  //    从框底出去的话，一根红虚线会横穿下面所有的框（实测直接扎穿 coin），
  //    而且看不出是哪个脚本伸的手。起点跟着那一行的第 k 个圆点走。
  for (const 空 of 网.空头们 || []) {
    if (空.申诉 === '正常') continue;   // 你说是误报的，就别再画这根刺
    // 组件口收起了，那根虚线也一起收 —— 只留线不留头、或只留头不留线，
    // 都会让人以为「这里有东西但没连上」。
    if (空.种类 === '组件' && !显示组件口()) continue;
    const 源 = 框位.get(空.自);
    const 的 = 框位.get(空.id);
    if (!源 || !的) continue;

    let x1 = 源.x + 源.w / 2, y1 = 源.y + 源.h;
    const 源行 = 空.脚本名 ? 行表.get(空.自 + '\u0001' + String(空.脚本名)) : null;
    if (源行) {
      // 组件口按 data-口 找 —— 口分了左右两组，按顺序取会拿错
      const 点 = 源行.querySelector('.脚本口 i[data-口="' + (空.口 || 0) + '"]');
      if (点) { const a = 换算(点); x1 = a.中x; y1 = a.中y; }
      else { const a = 换算(源行); x1 = a.右; y1 = a.中y; }
    }

    const x2 = 的.x + 的.w / 2, y2 = 的.y;
    const my = (y1 + y2) / 2;
    const 色 = 空.种类 === '组件' ? '#5a6f8a' : '#d96464';
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 色);
    p.setAttribute('stroke-width', 空.种类 === '组件' ? '1.4' : '2.2');
    p.setAttribute('stroke-dasharray', 空.种类 === '组件' ? '3 4' : '6 4');
    p.setAttribute('opacity', '0.9');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    t.textContent = 空.种类 === '组件'
      ? (空.脚本名 || '') + ' 的这个口连到 Unity 组件 ' + (空.字段 || '')
      : (空.字段 || '') + ' —— 这里没有接应';
    p.appendChild(t);
    层.appendChild(p);
  }

  // 组件口那几个小圆标记要跟住源框 —— 拖框时每一帧都得重摆，
  // 不然源框走了、标记还钉在旧坐标上（使用者原话「拖完后会呆在原地」）。
  刷组件口();
}

function 名短(id) {
  if (!id) return '';
  const 实 = 网.实例们.find(x => x.id === id);
  return 实 ? (实.名 || id) : String(id).split('|').pop();
}

// 拖完把位置交给壳。只写 布局 表 —— 那是你摆的，不是扫出来的。
function 存布局() {
  if (!有壳()) return;
  const 项 = [];
  for (const [id, 位] of 网.位置) 项.push({ id, x: 位.x, y: 位.y });
  if (!项.length) return;
  window.chrome.webview.postMessage({ 命令: '存布局', 项 });
}

function 拉关系图() {
  if (!有壳()) return;
  window.chrome.webview.postMessage({ 命令: '关系图数据' });
}

// ══════════════════════════════════════════════════════════════
// 窗户：脚本框张开之后，里面那块独立画布
//
// 这是你说的第三级。判据跟网状图一个（不是倍率，是屏幕字号）：
//   正文字号 14px × 外层 视.z  ≥ 24px  →  这扇窗够大了，能当编辑器用
// 到了才让开 —— 不够大的时候开出来也是一团糊。
//
// 开出来之后，块画在 内世界 里，它自己一套 scale（内视），
// 跟外面那张关系网各管各的。网还在，只是这一格被裁了。
// ══════════════════════════════════════════════════════════════
const 窗 = { 脚本: null, 实例: null, el: null, 内: null, 内视: { x: 0, y: 0, z: 1 } };

// 判据：这个实例框在屏幕上占多宽。占满（≥80% 舞台宽）才让内部变成画布 ——
// 这是「当这个框占满屏幕后」那句话的直接翻译，不是拍脑袋的倍率。
function 框够大(实例el) {
  if (!实例el) return false;
  const r = 实例el.getBoundingClientRect();
  const 台 = 舞台.getBoundingClientRect();
  return r.width >= 台.width * 0.8;
}

function 应用内视() {
  if (!窗.内) return;
  // ⚠️ 内视.x/y 存的是**屏幕像素**（鼠标拖多少就是多少），
  //    但这个元素长在 #world 里，#world 自己有 scale(视.z) ——
  //    直接写成 px 会被外层再放大一次。实测：拖 80px，内容在屏幕上跑 160px，
  //    所以内层拖动「太快」。落成 CSS 之前除掉外层缩放，两边都是屏幕像素。
  const 外z = 视.z || 1;
  窗.内.style.setProperty('--内x', (窗.内视.x / 外z) + 'px');
  窗.内.style.setProperty('--内y', (窗.内视.y / 外z) + 'px');
  窗.内.style.setProperty('--内z', 窗.内视.z);
}

function 关窗() {
  const 体 = 窗.体;
  if (体) {
    体.textContent = '';
    体.classList.remove('编辑中');
    for (const n of (窗.原内容 || [])) 体.appendChild(n);
  }
  for (const el of (窗.头标 || [])) el.remove();
  // 开窗时定死的宽高要清掉，不然收起来还是那块大方框
  const 实el = 窗.实例 ? document.querySelector('.实例框[data-id="' + CSS.escape(窗.实例) + '"]') : null;
  if (实el) { 实el.style.width = ''; 实el.style.height = ''; }
  if (窗.头钮) 窗.头钮.style.display = '';
  requestAnimationFrame(窗口改了就重排);
  当前画布 = null;
  窗.el = null; 窗.内 = null; 窗.体 = null;
  窗.原内容 = null; 窗.头标 = null; 窗.头钮 = null;
  窗.脚本 = null; 窗.实例 = null;
}

function 开窗(实例el, 脚本名) {
  if (窗.脚本 === 脚本名) { 关窗(); return; }

  // 不再硬拦「框够不够大」。点了就开 —— 框小画布就小，用户自己会放大。
  // 拦着的话点下去什么都不发生，看着就是坏了。
  if (!工程表[脚本名]) {
    网提示('这个脚本还没有块树：' + 脚本名);
    return;
  }

  const 体 = 实例el.querySelector(':scope > .实例体');
  if (!体) { 网提示('这个实例框没有内容区'); return; }

  // 框在 #world 里，尺寸是 CSS 单位，屏幕上还要乘 视.z。
  // 所以要「屏幕上占舞台 92%」，CSS 就得是 舞台宽/视.z。
  // 高度按屏幕比例走 —— 这样开出来的画布是屏幕的形状，不是方的。
  const 台r = 舞台.getBoundingClientRect();
  const 外z = 视.z || 1;
  const 屏比 = (window.innerWidth || 1400) / (window.innerHeight || 900);
  const 框CSS宽 = Math.round(台r.width * 0.92 / 外z);
  实例el.style.width = 框CSS宽 + 'px';
  实例el.style.height = Math.round(框CSS宽 / 屏比) + 'px';

  关窗();
  窗.脚本 = 脚本名; 窗.实例 = 实例el.dataset.id;
  窗.体 = 体;
  窗.原内容 = [...体.childNodes];        // 关窗时放回去
  窗.内视 = { x: 16, y: 16, z: 1 };

  体.textContent = '';
  体.classList.add('编辑中');

  // 画布：撑满 .实例体。它就在框内部，不是浮在上面的。
  const w = document.createElement('div');
  w.className = '窗户';
  const 内 = document.createElement('div');
  内.className = '内世界';
  w.appendChild(内);
  体.appendChild(w);
  窗.el = w; 窗.内 = 内;
  // ⚠️ 滚轮缩放 + 拖空白平移，在这里挂一次就够 ——
  //    挂在外面调用点上的话，漏掉任何一个入口（比如「✎ 编辑」按钮）
  //    那扇窗就既缩不动也拖不动。这个坑踩过：从脚本名进来能用，从 ✎ 进来死的。
  装窗缩放();

  // 框头上标一下现在在编辑哪个脚本，旁边一个返回
  const 头 = 实例el.querySelector(':scope > .实例头');
  if (头) {
    const 标 = document.createElement('span');
    标.className = '正在编';
    标.textContent = '正在编 ' + 脚本名;
    const 返 = document.createElement('span');
    返.className = '编钮';
    返.textContent = '← 返回';
    返.title = '收起编辑器，回到脚本列表';
    返.addEventListener('click', e => { e.stopPropagation(); 关窗(); });
    const 原编 = 头.querySelector('.编钮');
    if (原编) 原编.style.display = 'none';
    头.appendChild(标); 头.appendChild(返);
    窗.头钮 = 原编;
    窗.头标 = [标, 返];
  }

  // 把当前工程换成这个脚本，重画 —— 重画会挂到 当前画布，也就是 内世界
  当前画布 = 内;
  切到工程(脚本名);
  布局(根块们);
  requestAnimationFrame(窗口改了就重排);

  // 先缩到整棵树装得下，用户再自己滚
  requestAnimationFrame(() => {
    布局(根块们);
    let 左 = Infinity, 上 = Infinity, 右 = 0, 下 = 0;
    for (const el of 内.querySelectorAll(':scope > .blk')) {
      const l = parseFloat(el.style.left) || 0, t = parseFloat(el.style.top) || 0;
      左 = Math.min(左, l); 上 = Math.min(上, t);
      右 = Math.max(右, l + el.offsetWidth);
      下 = Math.max(下, t + el.offsetHeight);
    }
    if (!(右 > 0 && 下 > 0)) return;
    if (!isFinite(左)) 左 = 0;
    if (!isFinite(上)) 上 = 0;
    const 边 = 12;
    const 宽 = w.offsetWidth || 400, 高 = w.offsetHeight || 300;
    const 内容宽 = Math.max(1, 右 - 左), 内容高 = Math.max(1, 下 - 上);
    const 真z = Math.max(0.02, Math.min((宽 - 边 * 2) / 内容宽, (高 - 边 * 2) / 内容高, 1));
    // ⚠️ 光设 z 不够。块的内世界坐标不一定从 0 开始 —— 拖过的块可以到几千，
    //    只把偏移写成 {边, 边} 就等于「把 x=1000 的块放到屏幕 x=12」，照样在窗外。
    //    开出来的窗一片黑，看着像「块没了」，其实是视野没对准内容。
    //    要把包围盒左上角搬到 (边, 边)：屏幕上 内视.x + 块x×z = 边。
    //    内视.x 是屏幕像素，而 --内x 用的是它除过 外z 的 CSS 值，所以这里乘回去。
    const 外z = 视.z || 1;
    窗.内视 = { x: (边 - 左 * 真z) * 外z, y: (边 - 上 * 真z) * 外z, z: 真z };
    应用内视();
  });
}

// 在窗户里滚轮 = 缩窗户里的世界。按 Shift 才算外层。
// 跟设计稿一个分工：鼠标在哪层缩哪层。
function 装窗缩放() {
  const 框 = 窗.el;
  if (!框 || 框._绑了) return;
  框._绑了 = true;
  框.addEventListener('wheel', e => {
    // ⚠️ Shift 交给外层。窗户占了舞台 92%×88%，不留这个口子的话
    //    开窗后鼠标几乎总在窗户上，外层那张网怎么都缩不了 ——
    //    看着就是「缩放被卡住」。设计稿里就是这么分工的。
    if (e.shiftKey) {
      // 窗户浮在 body 上，不在舞台里 —— 事件冒泡不到舞台那个 handler，
      // 所以 Shift 得在这儿自己动手缩外层。
      e.preventDefault();
      e.stopPropagation();
      缩外层(e.clientX, e.clientY, e.deltaY < 0);
      return;
    }
    // 窗户里滚 = 缩窗户里的世界。stopPropagation 挡住外层那张网。
    e.preventDefault();
    e.stopPropagation();
    const r = 框.getBoundingClientRect();
    const 旧z = 窗.内视.z || 1;
    const 新z = Math.min(4, Math.max(0.15, 旧z * (e.deltaY > 0 ? 0.9 : 1.1)));
    // 以光标为中心：光标底下那个点，缩放前后停在原地
    const lx = (e.clientX - r.left - 窗.内视.x) / 旧z;
    const ly = (e.clientY - r.top - 窗.内视.y) / 旧z;
    窗.内视.x = e.clientX - r.left - lx * 新z;
    窗.内视.y = e.clientY - r.top - ly * 新z;
    窗.内视.z = 新z;
    应用内视();
  }, { passive: false });

  // 拖空白 = 平移窗户里的世界。
  // 块自己会 stopPropagation（开始拖里就这么写的），输入框也不会冒到这一层，
  // 所以能走到这儿的，基本就是空白处。
  框.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // Shift 交给外层 —— 按住 Shift 拖，挪的是整张网，不是这扇窗户里的世界。
    // 设计稿里内层第一句就是 if (e.shiftKey) return;
    if (e.shiftKey) return;
    if (e.target.closest('.blk') || e.target.closest('input') || e.target.closest('textarea')) return;
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 窗.内视.x, oy: 窗.内视.y };
    框.classList.add('平移中');
    const 移 = ev => {
      // 内视.x/y 是屏幕像素级的平移量（transform 里 translate 在 scale 外面），
      // 所以直接加屏幕位移，不用除缩放。
      窗.内视.x = 起.ox + (ev.clientX - 起.x);
      窗.内视.y = 起.oy + (ev.clientY - 起.y);
      应用内视();
    };
    const 停 = () => {
      框.classList.remove('平移中');
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// 一条界面上看得见的提示，不弹窗（弹窗会卡死整个页面，见下面那个「出错」的注释）
function 网提示(文本) {
  const 条 = document.createElement('div');
  条.className = '网提示';
  条.textContent = 文本;
  世界.appendChild(条);
  setTimeout(() => 条.remove(), 4200);
}

document.getElementById('undoBtn').onclick = () => 撤销();

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;   // 输入框里的撤销留给浏览器
  if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); e.shiftKey ? 重做() : 撤销(); }
  else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); 重做(); }
});

// 有存档就接着上次；没有就建一个空的
if (!读盘()) {
  当前工程 = '未命名';
  工程表[当前工程] = { 块们: [], 改: Date.now() };
  根块们 = [];
}
画标签();
刷新本份标签();
重画();
// 一开始就把视野对准这个工程的块 —— 不然块在画布远处，打开就是一片空白
应用视();
requestAnimationFrame(对准块);
// 有壳就去拉一次网 —— 没有壳的话这一句直接跳过，块编辑器照常
拉关系图();
</script>
