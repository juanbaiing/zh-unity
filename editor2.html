<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文套式 · 自由画布</title>
<style>
  :root{
    /* 跟网状图同一套色 —— unity-graph-lab 第五版（commit 2cbca43）。
       那边定的三条，这里照搬，不是为了好看：
         ① 颜色只编码含义：青灰蓝 = 结构/行为，暗绿 = 值，其余全灰阶。
            不是"每个类型一种颜色"—— 颜色不回答"这是第几个"。
         ② 装饰不带信息就删：不加底色块、不加圆角底、不加阴影。
         ③ 对比用在结构上：框边亮一点浮出背景，正文压暗，最亮那点留给重点。 */
    --bg:#0b0e12;        /* 底 */
    --panel:#151a21;     /* 面板 / 块底 */
    --line:#242c37;      /* 边框 */
    --text:#a9b4c2;      /* 正文 —— 压暗，久看不累 */
    --dim:#5d6b7d;       /* 弱化 */
    --字1:#c8d2de;       /* 最亮：标题、块名 */
    --字3:#5d6b7d;       /* 次要说明 */
    --字4:#39434f;       /* 极弱：类型名、占位提示 */
    --线亮:#242c37;      /* 内容区虚线框、分支分隔线 */
    --槽:#0b0e12;        /* 输入框底 */
    --块底:#151a21;      /* 块底 */
    --脚:#1a2028;        /* 容器块底，比语句块深一档 */
    /* 四类块收成两组半 —— 原来那四个是 Tailwind 500 级，各喊各的，
       没有一种在传递意思。
         能装东西的（类/方法/构造函数）→ 青灰蓝，跟网状图里"脚本"一个色
         承载值的（字段/属性/数组）  → 暗绿，跟网状图里"数据值"一个色
         普通语句                     → 灰阶，不抢
         条件                         → 暗金，跟网状图里"连线"一个色（它确实是分支） */
    --kcontain:#6f8aa3;
    --kstmt:#5d6b7d;
    --kdata:#5f9e7a;
    --kcond:#7a6a3f;
    --cn:#5f9e7a;        /* 输入的值 = 数据值 */
    --cs:#6f8aa3;        /* C# 预览 = 结构 */
    --bad:#a06060;       /* 报错 */
    --错底:#1a1214;      /* 报错条 / 拖回托盘 */
    --错线:#3a2626;
    --钮:#1b222b;        /* 按钮、下拉行、hover 底 */
    --选:#16211b;        /* 选中 / 拖入高亮底 */
    /* 间距只有这六个值，全部落在 4px 网格上。
       随手写 5px / 7px 的那种，眼睛察觉到不一致但说不出哪里不对，
       只会觉得"廉价"。 */
    --空隙:4px;          /* 贴在一起的两样东西 */
    --缝:8px;            /* 同一组里的 */
    --隔:12px;           /* 组与组之间 */
    --区:16px;           /* 大块之间 */
    /* 字号三档，相邻差 2px —— 差 1px 眼睛分不出来，等于白加。
       深色底上 600 以下的字重差几乎看不见，所以层次靠字号和间距，不靠粗细。 */
    --字块名:17px;       /* 块名、标题 */
    --字正文:14px;       /* 正文、输入的值 */
    --字标:11px;         /* 类型标签、序号 */
    /* 圆角两个值，不再有 1/3/5/6/7 这种。 */
    --圆弧:4px;          /* 小块 */
    --圆弧大:8px;        /* 浮层、面板 */
  }
  *{box-sizing:border-box}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:var(--槽)}
  *::-webkit-scrollbar-thumb{background:var(--线亮);border-radius:4px;border:2px solid var(--槽)}
  html,body{height:100%;margin:0;scrollbar-color:var(--线亮) var(--槽);scrollbar-width:thin}
  body{background:var(--bg);color:var(--text);font-family:"Cascadia Code","Consolas",monospace;
    font-size:var(--字正文);display:flex;flex-direction:column;overflow:hidden}

  header{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:12px;flex:none}
  header h1{font-size:var(--字块名);margin:0}
  .hint{color:var(--dim);font-size:var(--字正文)}
  .spacer{flex:1}
  .dirchip{font-size:var(--字正文);color:var(--dim);padding:4px 9px;border-radius:4px;
    border:1px solid var(--line);cursor:pointer;max-width:300px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
  .dirchip:hover{color:var(--cn);border-color:var(--cn)}
  .dirchip.设过{color:var(--dim)}
  .dirchip.文件{max-width:360px}
  button{background:var(--钮);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:4px 12px;font-size:var(--字正文);cursor:pointer;font-family:inherit}
  button:hover{background:var(--line)}
  /* 开关处于「关」的状态：跟旁边那些按一下就没了的按钮区分开，
     一眼能看出「这个现在是关着的」，而不是「这个按钮我按过」。 */
  button.熄{color:var(--dim);border-style:dashed;background:transparent}

  /* 顶栏的标签页：一个标签 = 一张画布 = 一个 Unity 脚本 */
  .tabs{display:flex;flex:none;background:var(--槽);border-bottom:1px solid var(--line);
    overflow-x:auto;padding:0 4px}
  .tabs::-webkit-scrollbar{height:4px}
  .tab{display:flex;align-items:center;gap:4px;padding:4px 12px;font-size:var(--字正文);
    color:var(--dim);cursor:pointer;white-space:nowrap;border-top:2px solid transparent;
    background:var(--panel);user-select:none}
  .tab:hover{color:var(--text);background:var(--脚)}
  .tab.active{background:var(--bg);color:var(--text);border-top-color:var(--cn)}
  .tab .x{opacity:0;font-size:var(--字标);padding:0 2px}
  .tab:hover .x{opacity:.6}
  .tab .x:hover{opacity:1;color:var(--bad)}
  .tab.新{color:var(--dim);font-size:var(--字块名);padding:4px 12px}
  .tab.新:hover{color:var(--cn)}

  main{flex:1;display:flex;min-height:0}

  /* 边栏收起后只剩一条 28px 的竖条。必须留，不然收了就打不开了。
     竖排字让它一眼能认出来是哪一栏。 */
  .palette.收,.code.收{width:28px!important;min-width:28px!important;flex:none;
    padding:0!important;overflow:hidden}
  .palette.收>h2,.palette.收>#palette,
  .code.收>.title,.code.收>.codelines,.code.收>.warn,.code.收>.errs{display:none}
  /* 收起钮必须**常驻**。只在收起时才显示的话，展开状态就点不到它，
     于是永远收不起来 —— 这个坑踩过一次。 */
  .栏条{position:absolute;top:4px;right:4px;width:18px;height:18px;z-index:8;
    display:flex;align-items:center;justify-content:center;
    font-size:var(--字标);color:var(--字3);cursor:pointer;user-select:none;
    border:1px solid var(--line);border-radius:4px;background:var(--panel)}
  .栏条:hover{color:var(--字1);border-color:#6f8aa3}
  /* 收起后铺满整条，竖排写栏名 —— 一眼认出这是哪一栏 */
  .palette.收>.栏条,.code.收>.栏条{top:0;right:0;left:0;bottom:0;width:auto;height:auto;
    border:0;border-radius:0;background:none;
    writing-mode:vertical-rl;letter-spacing:2px;color:var(--dim)}
  .palette.收>.栏条:hover,.code.收>.栏条:hover{color:var(--cn)}
  /* 两边的拖宽把手：贴在栏的内侧边缘 */
  .边栏把{position:absolute;top:0;width:8px;height:100%;cursor:col-resize;z-index:6}
  .边栏把::after{content:'';position:absolute;top:50%;width:2px;height:34px;
    margin-top:-17px;background:var(--线亮);border-radius:1px;transition:background .12s}
  .边栏把:hover::after,.边栏把.按着::after{background:var(--cn)}
  .边栏把:hover,.边栏把.按着{background:color-mix(in srgb, var(--cn) 13%, transparent)}
  .palette .边栏把{right:0}
  .palette .边栏把::after{left:3px}
  /* 右栏把手贴内侧：写到 -3px 会伸进相邻的 .mid 那一列，被盖住就点不到 */
  .code .边栏把{left:0}
  .code .边栏把::after{left:3px}
  /* 右边栏要能拖宽，必须给确定宽度，不能再 flex:4 抢 */
  .code{position:relative;width:380px;flex:none;min-width:0}

  .palette{width:170px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:8px 8px;overflow:auto;position:relative}
  /* 标题右边留出收起钮的位置 —— 不留的话按钮会压在标题和「✓ 编译通过」上 */
  .palette>h2{padding-right:24px}
  /* 用 grid + auto-fill：栏拖宽了列数自己变，不用改一个数字 */
  #palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
    gap:12px 8px;align-items:start}
  .grp-sec{min-width:0}
  .chips{display:flex;flex-direction:column;gap:4px}
  .palette h2{font-size:var(--字标);color:var(--dim);margin:0 0 6px}
  .palette h2.grp{font-size:var(--字标);color:var(--dim);margin:8px 0 4px;padding-bottom:4px;
    border-bottom:1px solid var(--钮);letter-spacing:1px;cursor:pointer;
    display:flex;align-items:center;gap:4px;user-select:none}
  .palette h2.grp:hover{color:var(--cn)}
  .grp-arrow{font-size:var(--字标);transition:transform .12s;display:inline-block}
  .grp-sec.collapsed .grp-arrow{transform:rotate(-90deg)}
  .grp-sec.collapsed .chips{display:none}

  .chip{padding:4px 8px;border-radius:4px;cursor:grab;user-select:none;
    border:1px dashed var(--line);background:var(--panel);font-size:var(--字正文);
    display:flex;align-items:baseline;gap:4px;white-space:nowrap;
    overflow:hidden;min-width:0}
  .chip:hover{border-color:var(--cn);color:var(--cn)}
  /* 中文名不许被挤掉；英文太长就出省略号，鼠标停上去看全名 */
  .chip > span:first-child{flex:none}
  .en{font-size:var(--字标);color:var(--dim);font-style:italic;user-select:none;
    flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

  .stage{flex:5 1 0;overflow:hidden;min-width:260px;position:relative;cursor:grab}
  .stage.平移中{cursor:grabbing}
  /* 画布靠 transform 缩放，不重排 —— 块的位置一直是那套画布坐标 */
  #world{position:relative;width:2400px;height:1600px;transform-origin:0 0;
    background:radial-gradient(circle,var(--panel) 1px,transparent 1px) 0 0/22px 22px}
  #hintEmpty{position:absolute;left:40px;top:40px;color:var(--dim);font-size:var(--字正文)}
  #比例牌{position:absolute;right:10px;bottom:8px;font-size:var(--字正文);color:var(--dim);
    pointer-events:none;user-select:none;z-index:5}
  #去原点{position:absolute;right:10px;bottom:26px;font-size:var(--字正文);color:var(--dim);
    cursor:pointer;user-select:none;z-index:5}
  #去原点:hover{color:var(--字1)}

  /* 所有块都是绝对定位 —— 画布上自由摆，容器里也自由摆 */
  .blk{position:absolute;background:var(--块底);border:1px solid var(--线亮);
    border-left:3px solid var(--kstmt);border-radius:4px;
    min-width:240px;z-index:2}
  .blk[data-t="类"],.blk[data-t="方法"],.blk[data-t="构造函数"]{border-left-color:var(--kcontain)}
  .blk[data-t="设若"],.blk[data-t="否则若"],.blk[data-t="否则"],
  .blk[data-t="重复"],.blk[data-t="只要"],.blk[data-t="遍历"],
  .blk[data-t="多分支"],.blk[data-t="遇"],.blk[data-t="其他"],
  .blk[data-t="尝试"],.blk[data-t="捕获"],.blk[data-t="读按键"]{border-left-color:var(--kcond)}
  .blk[data-t="字段"],.blk[data-t="属性"],.blk[data-t="数组"],.blk[data-t="新建列表"]{border-left-color:var(--kdata)}
  .blk.容器{background:var(--脚)}
  .blk.dragging{opacity:.85;z-index:999}
  .blk.孤岛{border-color:var(--bad);border-left-color:var(--bad)}

  /* 头不换行 —— 字段块有 5 个格子，一换行整个块就变两行高，
     跟别的块对不齐，看着像坏了。让它撑宽，宽度交给块自己。 */
  .head{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:nowrap;
    cursor:move;user-select:none;white-space:nowrap}
  .ord{font-size:var(--字标);color:var(--dim);min-width:20px;text-align:center;
    border-right:1px solid var(--线亮);padding-right:4px;user-select:none}
  .kind{font-size:var(--字标);color:var(--字3);background:var(--钮);padding:0 5px;border-radius:4px}
  .fld{color:var(--cn);border:1px solid transparent;border-radius:4px;padding:0 8px;color-scheme:dark;
    outline:none;background:var(--槽);font-size:var(--字正文);font-family:inherit;
    height:28px;line-height:24px;vertical-align:middle;cursor:text}
  .fld:focus{border-color:var(--cn);background:var(--槽)}
  .fld::placeholder{color:var(--dim)}
  .ctl{color:var(--dim);cursor:pointer;padding:0 4px;user-select:none;font-size:var(--字正文)}
  .ctl:hover{color:var(--cn)}
  .ctl.del:hover{color:var(--bad)}
  .ctl.选{font-size:var(--字标);padding:0 4px;color:var(--dim)}
  .ctl.选:hover{color:var(--cn)}

  .选项层{position:fixed;z-index:9998;min-width:130px;max-width:340px;max-height:280px;
    overflow:auto;padding:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 10px 30px #000b}
  .选项行{padding:4px 9px;border-radius:4px;color:var(--text);font-size:var(--字正文);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .选项行:hover{background:var(--钮);color:var(--cn)}
  .选项行.选中{color:var(--cn);background:var(--选)}

  .ctl.问{font-weight:bold;font-size:var(--字正文);padding:0 5px}
  .ctl.问:hover{color:var(--cn)}

  .简介卡{position:fixed;z-index:9997;pointer-events:none;max-width:260px;
    padding:8px 12px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 6px 20px #000a;
    font-size:var(--字正文);line-height:1.6;color:var(--text);white-space:normal}
  .简介卡 b{color:var(--cn);font-weight:normal;margin-right:8px}
  .简介卡 b::after{content:'·';color:var(--dim);margin-left:8px}

  .说明卡{position:fixed;z-index:9999;max-width:330px;padding:12px 13px;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cn);
    border-radius:8px;box-shadow:0 10px 30px #000b;
    font-size:var(--字正文);line-height:1.7;color:var(--text);white-space:normal}
  .说明头{margin-bottom:4px}
  .说明头 b{color:var(--cn);font-size:var(--字块名);margin-right:8px}
  .说明头 .en{font-size:var(--字标);color:var(--dim);font-style:italic}
  .说明文{white-space:pre-wrap}

  /* 容器的内容区：一块小画布，里面的块照样绝对定位、随便摆 */
  .body{position:relative;margin:0 12px 12px 20px;
    border:1px dashed var(--线亮);border-radius:4px;
    min-width:var(--w, 120px);
    min-height:var(--h, 56px);
    background:var(--槽)}
  /* 不要给 min-width/min-height 加 transition。
     尺寸是「算出来写死」的，过渡会让写入值和实际渲染差一截，
     量出来全是过渡起点 —— 而且每一层都差，叠起来就是内层戳出外层。 */
  /* 拖块靠近：只做高亮，不在这里改尺寸。
     改尺寸必须沿祖先链一起改 —— 见 延长链()。
     只给这一层加 min-height，它爹那块照样那么高，
     结果就是内容区从容器里戳出去。 */
  .body.over{
    border-color:var(--cn);
    background:var(--选);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--cn) 27%, transparent);
  }
  .body::after{content:'拖块进来';position:absolute;left:8px;top:6px;
    color:var(--字4);font-size:var(--字正文);pointer-events:none}
  .body:has(> .blk)::after{display:none}

  .palette-grip{display:none;position:absolute;top:0;right:0;width:8px;height:100%;
    cursor:col-resize;z-index:6}
  .palette-grip::after{content:'';position:absolute;top:50%;left:3px;width:2px;height:34px;
    margin-top:-16px;background:var(--字4);border-radius:4px;transition:background .12s}
  .palette-grip:hover::after,.palette-grip.按着::after{background:var(--cn)}
  .palette-grip:hover,.palette-grip.按着{background:color-mix(in srgb, var(--cn) 13%, transparent)}

  .孤岛提示{position:absolute;left:40px;top:12px;padding:4px 12px;border-radius:4px;
    background:var(--错底);color:var(--bad);font-size:var(--字正文);border:1px solid var(--错线);
    z-index:50;pointer-events:none}
  .孤岛提示.hidden{display:none}
  .fld.有选项{cursor:pointer}

  /* ---------- 大注释框：你拖出来的「一趟」 ----------
     垫在最底层当区域底色，不挡鼠标（只有标题条能被抓）。 */
  #注释框层{position:absolute;left:0;top:0;z-index:1}
  #线层{position:absolute;left:0;top:0;z-index:2;pointer-events:none}
  #网层{position:absolute;left:0;top:0;z-index:3}

  /* ⚠️ 框体必须能抓。
     原来是 pointer-events:none —— 只有框头（26px）能拖，框体整块穿透。
     实测：大框里套小框时，拖小框的框体 → 事件落到 #world → 平移画布，
     看着就是「框内框拖不动」。框头只占整体面积一成多，缩小后丢得更狠
     （z=0.42 时框头只有 11 屏幕像素高）。
     改成 auto 之后：拖框体 = 拖这个框；框外的空白仍然是平移画布。
     不会挡住外面的实例框和线 —— 框层 z-index 1，网层 3、线层 2 都在它上面。
     .拖出中（正在拉的那个预览框）单独关掉，不然它会挡住 pointermove 的落点判定。 */
  .注释框{position:absolute;border:1px solid #3d5064;border-radius:10px;
    background:color-mix(in srgb, #4a6a8a 7%, transparent);
    pointer-events:auto;box-sizing:border-box}
  /* 框里的框是真的 DOM 子节点（父 字段见 建注释框）。子框压在父框的框体上，
     所以要给父框自己的框头和四角更高的一档，不然里面那个框一盖，
     父框就再也拖不动、也改不了大小了。 */
  .注释框 > .框头{z-index:2}
  .注释框 > .框角{z-index:2}
  /* ⚠️ 框头要整条能抓 —— 它只有 26px 高，缩到「只有标题文字能点」就只剩几十像素，
     实测在 0.42 倍缩放下标题条只有 40×6 个屏幕像素，根本点不中，整个框就拖不动了。
     框头盖不住下面的实例框：框层 z-index 1、网层 z-index 3，实例框本来就在上面。 */
  .注释框 .框头{position:absolute;left:0;right:0;top:0;height:26px;
    display:flex;align-items:center;gap:8px;padding:0 10px;
    font-size:12px;color:#8aa2bd;cursor:move;pointer-events:auto;
    border-bottom:1px solid color-mix(in srgb, #3d5064 60%, transparent)}
  .注释框 .框头 .名额{margin-left:auto;color:#5d7086}
  .注释框 .框标题{pointer-events:auto;min-width:60px;outline:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .注释框 .框标题[contenteditable="true"]{cursor:text}
  .注释框 .框叉{margin-left:8px;padding:0 4px;color:#5d7086;cursor:pointer;font-size:14px;line-height:1;
    pointer-events:auto}
  .注释框 .框叉:hover{color:#d96464}
  /* 四个角：就是普通窗口那种把手，没有箭头、没有「调整大小」的字。
     ⚠️ 命中区要够大。12px 在缩放 0.42 时只有 5 个屏幕像素，实测点不中 ——
        拖了三回都抓到的是画布本身（把画布平移了）。 */
  .注释框 .框角{position:absolute;width:20px;height:20px;pointer-events:auto}
  .注释框 .框角.nw{left:-10px;top:-10px;cursor:nwse-resize}
  .注释框 .框角.ne{right:-10px;top:-10px;cursor:nesw-resize}
  .注释框 .框角.sw{left:-10px;bottom:-10px;cursor:nesw-resize}
  .注释框 .框角.se{right:-10px;bottom:-10px;cursor:nwse-resize}
  .注释框.选中{border-color:#7a8fa8;box-shadow:0 0 0 1px #7a8fa855}
  .注释框 .框标题{cursor:text;outline:none}
  .注释框 .框标题:empty::before{content:'未命名';color:#3d5064}
  .注释框.拖出中{pointer-events:none;border-style:dashed;background:color-mix(in srgb, #4a6a8a 12%, transparent)}
  .注释框.收起{height:26px ;overflow:hidden;background:color-mix(in srgb, #4a6a8a 14%, transparent)}

  /* ---------- 网层：Unity 场景里的实例 ----------     和块在同一张画布、同一套坐标里 ——「实例就是另类的代码块」。
     配色沿用网状图那套：青灰蓝 = 脚本/行为，暗绿 = 数据值，暗金 = 连线。
     框不描粗边、不加阴影 —— 靠块底和画布底那一档差浮起来。 */
  #线层{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
  #网层{position:absolute;left:0;top:0;z-index:1}
  /* 宽度由 JS 按「高 × 屏幕比例」定，这里不写死 —— 写死就跟长宽比打架 */
  .实例框{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;min-width:180px;box-sizing:border-box;z-index:1}
  .实例头{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 12px;cursor:move;user-select:none;white-space:nowrap;
    border-bottom:1px solid var(--line)}
  .实例名{color:var(--字1);font-size:var(--字块名)}
  .实例签{color:var(--字4);font-size:var(--字标);margin-left:auto}
  .编钮{color:#6f8aa3;font-size:var(--字标);cursor:pointer;padding:2px 8px;
    border:1px solid var(--line);border-radius:4px;white-space:nowrap}
  .编钮:hover{color:var(--字1);border-color:#6f8aa3}
  .实例体{padding:8px;display:flex;flex-direction:column;gap:4px}
  .脚本框{background:var(--脚);border-radius:4px}
  .脚本名{display:flex;align-items:center;gap:8px;
    padding:6px 10px;color:#6f8aa3;font-size:var(--字正文);white-space:nowrap;cursor:pointer}
  .脚本名:hover{background:color-mix(in srgb, #6f8aa3 12%, transparent)}
  .脚本框.开>.脚本名{color:var(--字1)}
  /* 名字吃掉中间的空档 —— 左边的口贴左、右边的口贴右，名字在中间 */
  .脚本名 > .名{flex:1;overflow:hidden;text-overflow:ellipsis}
  .脚本口{display:flex;gap:4px;flex:0 0 auto}
  .脚本口 i{width:6px;height:6px;border-radius:50%;border:1px solid #7a6a3f;display:block}
  .实例脚{padding:4px 12px;color:var(--字4);font-size:var(--字标);
    border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 孤岛脚本：写好了但场景里没有物体挂它。红色边框 —— 它不会跑，
     但也不会被调用，是段死代码，得让人看见。 */
  .孤岛框{border-color:var(--bad)!important;border-style:dashed!important;
    background:color-mix(in srgb, var(--bad) 8%, var(--panel))}
  .孤岛框 .实例名{color:var(--bad)}
  /* 空头：某个脚本往外伸手，那头是空的。
     跟孤岛不是一回事 —— 孤岛是「没人用它」，空头是「它要用的东西不在」。
     两种都不报错、不打日志，所以只能靠看。
     ⚠️ 颜色必须刺眼。第一版用的是 --bad(#a06060)，缩到 0.5 倍时那条 1px 边框
        细得像没有，整个框看着像个残废的灰框，一点不吓人 —— 而它该吓人。 */
  .空头框{
    border:2px dashed #d96464!important;
    border-left:5px solid #d96464!important;
    background:color-mix(in srgb, #d96464 16%, var(--panel))!important;
  }
  .空头框 .实例名{color:#f09090!important;font-weight:600}
  .空头框 .实例签{color:#e8a0a0!important;background:#3a1e1e;border-radius:3px;padding:1px 5px}
  .空头框 .实例脚{color:#c09a9a!important}
  /* 申诉过的「正常」：误报，框留着不再喊，但也不藏 ——
     藏了就变成「我以为没事」和「它悄悄消失」分不清。 */
  .空头框.误报{border:1px dotted var(--字4)!important;
    border-left:1px dotted var(--字4)!important;background:var(--panel)!important}
  .空头框.误报 .实例名{color:var(--字3)!important;font-weight:400}
  .空头框.误报 .实例签{color:var(--字4)!important;background:transparent}
  .空头框.误报 .实例脚{color:var(--字4)!important}
  /* 连到 Unity 内置组件：不是错，是中性的。用蓝灰，不跟红色抢注意力。
     ⚠️ 2026-11-04 改小了。原来是 220×80 的大框，跟真断链一样的体积，
        18 个就铺满画布 —— 使用者原话「到处飞」。
        它只是「这个口连到引擎组件」的记号，不是一块地方：
        **一个小圆虚线框 + 一个短标签**，贴在源框右肩上。
        还能整体关掉（顶栏「组件口」）。
     ⚠️ 尺寸别抠太小：这里被 #world 的 scale(视.z) 再缩一道，
        z=0.5 时 13px 的圆只剩 7 个物理像素，看着就像个脏点。
        圆 16 / 字 12 是缩到 0.5 还能认出是「一个圆圈」的下限。 */
  .空头框.组件头{
    border:0!important;background:transparent!important;
    display:flex!important;align-items:center;gap:6px;
    width:auto!important;height:auto!important;
    min-width:0!important;padding:0!important;
    cursor:default;user-select:none;
    /* 贴在框外面，别跟框里的脚本行抢地方 */
    transform:translateX(2px);
  }
  .空头框.组件头 .组件圆{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;
    border:1.5px dashed #7f97b4;background:color-mix(in srgb, #5a6f8a 14%, transparent);
    box-sizing:border-box;
  }
  .空头框.组件头 .组件标{
    color:#93aac4;font-size:12px;line-height:1;font-weight:400;
    padding:2px 5px;border-radius:3px;
    /* 底要实：这个标记常常压在连线上，半透明底会和线糊出一层重影 */
    background:#232d3a;
    white-space:nowrap;
  }
  .空头框.组件头:hover .组件圆{border-color:#b9cde3;background:color-mix(in srgb, #5a6f8a 30%, transparent)}
  .空头框.组件头:hover .组件标{color:#dce9f6;background:#31404f}
  /* 关掉整层组件口 —— 顶栏那个开关控制的 */
  #网层.藏组件口 .空头框.组件头{display:none!important}
  /* 悬停一个框：只留跟它有关的那几根线，其余压到接近底色。
     线一多，任何走线算法都救不了 —— 一次只看一束才行。
     这个比你之前提的「整体保留但半透明」更激进一点：只点亮一束，其余几乎消失。 */
  #线层 path.暗{opacity:0.05!important}
  #线层 path.亮{opacity:1!important;stroke-width:2}
  #网层 .实例框.暗{opacity:0.16}

  /* 右键菜单 */
  .右键单{position:fixed;z-index:9000;min-width:200px;padding:4px;border-radius:6px;
    background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px #0009;
    font-size:var(--字正文);max-height:60vh;overflow:auto}
  .右键单 .项{padding:6px 10px;border-radius:4px;cursor:pointer;color:var(--text);
    white-space:nowrap;display:flex;align-items:center;gap:28px}
  .右键单 .项 .键{margin-left:auto;color:var(--字4);font-size:var(--字标)}
  .右键单 .项:hover{background:var(--line);color:var(--字1)}
  .右键单 .项.险:hover{background:var(--错底);color:var(--bad)}
  .右键单 .分{height:1px;margin:4px 6px;background:var(--line)}
  .右键单 .注{padding:4px 10px 6px;color:var(--字4);font-size:var(--字标);max-width:260px}
  /* 左边栏的脚本索引 */
  #脚本索引{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;
    max-height:42%;overflow:auto}
  .索引头{font-size:var(--字标);color:var(--字4);padding:0 4px 4px;
    display:flex;justify-content:space-between}
  .索引项{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;
    font-size:var(--字标);color:#6f8aa3;cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .索引项:hover{background:var(--脚);color:var(--字1)}
  .索引项 .挂{color:var(--字4);font-size:10px;margin-left:auto;
    overflow:hidden;text-overflow:ellipsis}
  .索引项.孤{color:var(--bad)}
  .索引空{font-size:var(--字标);color:var(--字4);padding:2px 6px}
  .网提示{position:absolute;left:40px;top:12px;padding:8px 12px;border-radius:4px;
    background:var(--panel);color:var(--dim);font-size:var(--字正文);
    border:1px solid var(--line);z-index:50;pointer-events:none}
  /* 窗户：脚本框张开后露出来的那块独立画布。
     它在关系网里面被裁着 —— 网还在，只是这一格里自己一套缩放平移。 */
  /* 窗户：.实例体 里的内容。不是盖在框上的浮层 ——
     框的边框、圆角、头、脚全都不动，换的只是肚子里装的东西。 */
    .窗户{position:absolute;left:0;top:0;right:0;bottom:0;
    background:var(--槽);overflow:hidden;border-radius:4px;cursor:grab}
  .窗户.平移中{cursor:grabbing}
  .窗户 .blk{cursor:default}
  .实例体{position:relative}
  /* 不再用 min-height 撑 —— 那会让内容区比框还高，画布戳出框外。
     尺寸统一由 .实例框 在开窗时按屏幕比例定。 */
  .实例体.编辑中{padding:0;height:100%}
  .内世界{position:absolute;left:0;top:34px;transform-origin:0 0;
    transform:translate(var(--内x,0px),var(--内y,0px)) scale(var(--内z,1))}

  .palette.回收{background:var(--错底);box-shadow:inset 0 0 0 2px #ff6b6b66}
  .palette.回收::after{content:'松手删掉';position:absolute;left:12px;bottom:12px;
    color:var(--bad);font-size:var(--字正文);pointer-events:none}

  .branch{border-top:1px dashed var(--线亮)}
  .branch .head{padding:8px 12px;cursor:default}

  /* ⚠️ 这里不能再写 flex —— 上面那条 .code 已经定了 width + flex:none。
     写成 flex:4 1 0 的话，同优先级下后写的赢，宽度永远被压回去，
     拖拽设了 640px 实际只剩 560（实测）。 */
  .code{border-left:1px solid var(--line);display:flex;flex-direction:column}
  .code .title{padding:8px 28px 8px 12px;font-size:var(--字标);line-height:16px;color:var(--字3);
    border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  /* 中间层单独一列。默认收成一条竖条（不占地方），点开才铺开，
     这样块、中文写法、C# 能横向对着看。 */
  .mid{flex:none;width:34px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
    transition:width .14s ease-out}
  .mid.开{width:auto;flex:2 1 0;min-width:200px}
  .midBar{writing-mode:vertical-rl;padding:12px 0;font-size:var(--字正文);
    color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;
    letter-spacing:2px;flex:none;text-align:center}
  .midBar:hover{color:var(--cn)}
  /* 展开后的标题条要和右边「生成的 C#」那条一模一样高 ——
     差 1px，两边的第 N 行就不在同一水平线上，并排看就废了 */
  .mid.开 .midBar{writing-mode:horizontal-tb;padding:4px 12px;
    font-size:var(--字标);line-height:16px;
    border-bottom:1px solid var(--line);color:var(--cn);letter-spacing:0;
    display:flex;justify-content:space-between}
  .mid.开 .midBar::after{content:'▾';color:var(--dim)}
  .midBar::before{content:''}
  /* 中间层展开后跟 C# 那边同一套行结构：同字号、同行高、同一行号宽度，
     只是文字是中文。两边并排 = 一行对一行，滚到哪里都在同一行上。 */
  .mid .codelines{margin:0;padding:8px 0;flex:1;overflow:auto;display:none;
    font-size:var(--字正文);line-height:1.55;white-space:pre;
    background:var(--槽);user-select:text}
  .mid.开 .codelines{display:block}
  .mid .codelines .ln{display:flex;align-items:flex-start;padding:0 10px 0 0}
  .mid .codelines .no{flex:none;width:34px;text-align:right;padding-right:12px;
    color:var(--字4);user-select:none;font-size:var(--字标)}
  .mid .codelines .tx{flex:1;min-width:0;white-space:pre;color:#a8b8a0;
    word-break:break-all}
  .mid .codelines .tx.空{color:transparent}

  .codelines{margin:0;padding:8px 0;overflow:auto;flex:1;
    font-size:var(--字正文);line-height:1.55;white-space:pre;
    font-family:inherit;user-select:text}
  .codelines .ln{display:flex;align-items:flex-start;padding:0 10px 0 0}
  .codelines .no{flex:none;width:34px;text-align:right;padding-right:12px;
    color:var(--字4);user-select:none;font-size:var(--字标)}
  .codelines .tx{flex:1;min-width:0;white-space:pre;color:var(--cs);word-break:break-all;
    position:relative}
  /* 大括号结构线由 画行() 直接写成 background-image（一根线一层渐变，位置用 ch）——
     这里不留样式，见画行() 里的 线图()。 */
  .codelines .ln.bad{background:var(--错底)}
  .codelines .ln.bad .tx{color:#c08080}
  .codelines .ln.warn2{background:#221d14}
  .codelines .ln.warn2 .tx{color:#c8a860}
  .codelines .ln.闪{background:var(--选)}

  .errcount{float:right;font-size:var(--字标);color:var(--dim)}
  .errcount.有错{color:var(--bad)}
  .errs{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--错线);
    background:var(--错底)}
  .errs.hidden{display:none}
  .err{display:flex;gap:8px;padding:4px 12px;font-size:var(--字正文);cursor:pointer;
    border-bottom:1px solid var(--错底);line-height:1.45}
  .err:hover{background:var(--错底)}
  .err .码{flex:none;width:52px;color:#b07070;font-size:var(--字标)}
  .err .位{flex:none;width:44px;color:var(--dim);font-size:var(--字标)}
  .err .说{flex:1;min-width:0;color:#c0a0a0}
  .err.警{opacity:.75}
  .err.警 .码{color:#b89858}
  .warn{padding:4px 12px;background:var(--错底);color:var(--bad);font-size:var(--字正文);
    border-top:1px solid var(--错线)}
  .warn.hidden{display:none}
</style>
</head>
<body>

<header>
  <h1>中文套式 · 自由画布</h1>
  <span class="hint">块随便摆 ｜ 拖进虚线框 = 进那个盒子 ｜ 盒子里也能随便摆</span>
  <span class="spacer"></span>
  <button id="undoBtn" title="Ctrl+Z">↶ 撤销</button>
  <button id="redoBtn" title="Ctrl+Y">↷ 重做</button>
  <span id="curFile" class="dirchip 文件" title="这份画布存到哪个 .cs">本份：还没存过</span>
  <span id="engineDir" class="dirchip" title="编译检查要用的引擎目录">引擎：自动找</span>
  <span id="unityDir" class="dirchip" title="设置不了">Unity 目录：未设</span>
  <button id="saveUnityBtn" title="直接写进 Unity 项目的 Assets 目录（整份覆盖）">存到 Unity</button>
  <button id="scanBtn" title="扫一遍 Unity 项目：有哪些脚本、场景、预制体，谁挂在哪个物体上">扫描项目</button>
  <button id="copyBtn">复制 C#</button>
  <button id="组件口钮" title="现在显示「连到 Unity 组件」的小圆标记，点一下收起">组件口</button>
  <button id="clearBtn">清空</button>
</header>

<nav id="tabs" class="tabs"></nav>

<main>
  <aside class="palette">
    <div id="脚本索引"></div>
    <div id="申诉区"></div>
    <h2>点一下加块</h2>
    <div id="palette"></div>
  </aside>

  <section class="stage">
    <div id="world"><div id="hintEmpty">从左边点一个块开始</div></div>
    <div id="比例牌">100%</div>
    <div id="去原点" title="回到原点，100%">复位</div>
  </section>

  <section class="mid" id="midLayer">
    <div class="midBar" id="midToggle" title="点开：看这一堆块对应的中文写法">中间层</div>
    <div class="codelines" id="midOut"></div>
  </section>

  <section class="code">
    <div class="title">生成的 C#<span id="errCount" class="errcount"></span></div>
    <div class="codelines" id="out"></div>
    <div class="warn hidden" id="warn"></div>
    <div class="errs hidden" id="errs"></div>
  </section>
</main>

<script src="translator.js"></script>
<script src="unity-words.js"></script>
<script src="zh2unity.js"></script>
<script src="blocks.js"></script>
<!-- 线绕框：libavoided-js（libavoid 的 JS 移植）。由 _做libavoid.js 生成，别手改 -->
<script src="libavoided.js"></script>
<script src="blocks2.js"></script>
<script>
const { 块定义 } = window.Blocks;
const 树 = window.树;

let 根块们 = [];
let 序号递 = 0;
const 世界 = document.getElementById('world');
const 舞台 = document.querySelector('.stage');
const out = document.getElementById('out');
const 警告 = document.getElementById('warn');

// ══════════════════════════════════════════════════
//  画布缩放
//
//  #world 是 2400×1600 的固定画布，缩靠 transform，不重排。
//  块的位置一直是「画布坐标」；屏幕上看到多少由 视 决定。
//  拖拽时拿到的都是屏幕坐标，换算回来要除以 视.z。
// ══════════════════════════════════════════════════
const 视 = { x: 0, y: 0, z: 1 };

function 应用视() {
  // ⚠️ 外层画布永远只乘 视.z。总缩放() 里含窗户那层 内视.z ——
  //    之前批量替换把它带进来了，于是开窗后外层被额外乘一次内层缩放，
  //    3 × 0.15 = 0.45，整个网缩成一小团，滚轮怎么转都像卡住了。
  世界.style.transform = `translate(${视.x}px,${视.y}px) scale(${视.z})`;
  const 牌 = document.getElementById('比例牌');
  if (牌) 牌.textContent = Math.round(视.z * 100) + '%';
}

// 缩外层。抽成函数是因为窗户浮在 body 上、不在舞台里 ——
// 事件冒泡不到这里，窗户那边的 Shift+滚只能自己调这个。
function 缩外层(clientX, clientY, 放大) {
  const 前 = 视.z;
  // 上限原来写死 3 倍 —— 没什么理由，当时随手定的。块要凑近看细节，
  // 3 倍根本不够（一个类块两千多像素高）。放到 10 倍，缩到 0.1。
  const 后 = Math.min(10, Math.max(0.1, 前 * (放大 ? 1.12 : 1 / 1.12)));
  // 光标指着的那一点，缩放前后要停在原地
  const r = 舞台.getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  视.x = mx - (mx - 视.x) * (后 / 前);
  视.y = my - (my - 视.y) * (后 / 前);
  视.z = 后;
  应用视();
}

舞台.addEventListener('wheel', e => {
  if (e.ctrlKey) return;
  // 事件发生在窗户里就让开 —— 那一下归窗户自己缩。
  // 不靠窗户那边 stopPropagation 兜着，两边各判各的，谁也漏不了。
  if (!e.shiftKey && e.target.closest && e.target.closest('.窗户')) return;
  if (!e.shiftKey && e.target.closest && e.target.closest('.孤岛框')) return;
  e.preventDefault();
  缩外层(e.clientX, e.clientY, e.deltaY < 0);
}, { passive: false });

// 拖空白 = 平移。块自己会 stopPropagation，不会误触。
let 平移 = null;
舞台.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  // Ctrl 拖 = 拉大注释框，不是平移。挪窗式的 Alt 在别的系统会触发「拖窗口」，
  // 右键更不行 —— 实测 WebView2 右键按下根本不派发 pointerdown（只有 up 和 contextmenu）。
  if (e.ctrlKey) return;
  // 在窗户里按的，归窗户平移它自己的世界 —— 外层不许跟着动。
  // 这里不加的话，拖窗户内空白时整张网也在挪，看着就是「内外一起动」。
  // Shift 拖 = 挪外层。所以 Shift 时就算按在窗户里，也归外层管，不让开。
  if (!e.shiftKey && e.target.closest && e.target.closest('.窗户')) return;
  if (!e.shiftKey && (e.target.closest('.blk') || e.target.closest('.palette'))) return;
  if (e.shiftKey && e.target.closest && e.target.closest('.palette')) return;
  平移 = { sx: e.clientX, sy: e.clientY, ox: 视.x, oy: 视.y };
  舞台.classList.add('平移中');
});
addEventListener('pointermove', e => {
  if (!平移) return;
  视.x = 平移.ox + (e.clientX - 平移.sx);
  视.y = 平移.oy + (e.clientY - 平移.sy);
  应用视();
});
addEventListener('pointerup', () => {
  if (!平移) return;
  平移 = null;
  舞台.classList.remove('平移中');
});

// 把视野对准所有块 —— 换工程、整理完之后用
function 对准块() {
  // 开着窗户的时候别动外层视野。切工程会顺手调一次对准块，
  // 那一下把外层缩放重新算掉了 —— 窗户刚按屏幕比例算好的尺寸就白算了
  // （实测：开窗时 视.z=2，被重置回 0.5，窗户屏幕上从 644 掉到 161）。
  if (窗 && 窗.el) return;
  // 块和实例框在同一张画布上，一起算包围盒 —— 只量块的话，打开时视野对准块，
  // 实例框全在视野外面，看着像「网没出来」。
  const 块们 = [...世界.querySelectorAll('.blk, .实例框')].filter(el => el.offsetParent);
  if (!块们.length) { 视.x = 40; 视.y = 40; 视.z = 1; 应用视(); return; }
  const wr = 世界.getBoundingClientRect();
  const z = 视.z || 1;
  let 左 = Infinity, 上 = Infinity, 右 = -Infinity, 下 = -Infinity;
  for (const el of 块们) {
    const r = el.getBoundingClientRect();
    左 = Math.min(左, (r.left - wr.left) / z);
    上 = Math.min(上, (r.top - wr.top) / z);
    右 = Math.max(右, (r.right - wr.left) / z);
    下 = Math.max(下, (r.bottom - wr.top) / z);
  }
  if (!isFinite(左)) return;
  const sr = 舞台.getBoundingClientRect();
  const 边 = 40;
  const 宽 = Math.max(1, 右 - 左), 高 = Math.max(1, 下 - 上);
  const 装得下 = Math.min((sr.width - 边 * 2) / 宽, (sr.height - 边 * 2) / 高);

  // ⚠️ 不要为了「装下全部」一路缩下去。
  //    一个类块能有两千多像素高，硬塞进七百多的视口就得缩到 0.33 ——
  //    14px 的字在屏幕上只剩 4.7px，什么都读不了。而且块一放大，
  //    包围盒跟着变大，缩得更狠，越改越糟。
  //    代码编辑器本身是滚动的、不缩放。这里同理：装得下就居中装下，
  //    装不下就保 1 倍、只平移到左上角 —— 想看全貌自己滚轮缩小，
  //    那是你的选择，不该是打开时的默认。
  const 新z = Math.min(1.3, Math.max(0.5, 装得下));
  视.z = 新z;
  // 装得下 → 居中；装不下 → 贴左上角留边距。
  // 不能一味居中：块比视口宽的时候，居中会把块的左边缘推到调色板底下，
  // 看着像「块少了半截」（实测 视.x 变成 -163，左边缘正好藏在侧栏后面）。
  if (装得下 >= 1) {
    视.x = (sr.width - 宽 * 新z) / 2 - 左 * 新z;
    视.y = (sr.height - 高 * 新z) / 2 - 上 * 新z;
  } else {
    视.x = 边 / 2 - 左 * 新z;
    视.y = 边 / 2 - 上 * 新z;
  }
  应用视();
}

document.getElementById('去原点').onclick = () => { 视.x = 40; 视.y = 40; 视.z = 1; 应用视(); };

// 每块自己的坐标都相对它所在的画布（顶层相对 #world，容器内相对 .body）
function 建(类型, x, y) {
  const b = 树.新(类型);
  b.x = x; b.y = y;
  return b;
}

function 自适应宽(el) {
  let 宽 = 0;
  for (const ch of el.value) 宽 += ch.charCodeAt(0) > 255 ? 15 : 8;
  el.style.width = Math.max(44, 宽 + 26) + 'px';
}

// ---------------- 渲染 ----------------
function 渲染块(b, 序) {
  const 定义 = 块定义[b.类型];
  const el = document.createElement('div');
  el.className = 'blk' + (定义.可容纳 ? ' 容器' : '');
  el.dataset.t = b.类型;
  el.dataset.id = b.id;
  el.style.left = (b.x || 0) + 'px';
  el.style.top = (b.y || 0) + 'px';

  const head = document.createElement('div');
  head.className = 'head';

  if (序) {
    const ord = document.createElement('span');
    ord.className = 'ord';
    ord.textContent = 序;
    ord.title = '这块在它这一层里第 ' + 序 + ' 个执行';
    head.appendChild(ord);
  }

  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = b.类型;
  head.appendChild(kind);

  if (定义.英文) {
    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = 定义.英文;
    head.appendChild(en);
  }

  (定义.字段 || []).forEach(f => {
    const s = document.createElement('input');
    s.className = 'fld';
    s.value = b.字段[f.k] ?? '';
    s.placeholder = f.提示;
    自适应宽(s);
    s.addEventListener('input', () => { b.字段[f.k] = s.value; 自适应宽(s); 输出(); });
    // 这里**不能** stopPropagation —— 拦掉了，块就收不到 pointerdown，
    // 于是「按在字上」永远拖不动。放它冒泡，交给 阈值拖 看你是点还是拖。
    head.appendChild(s);
    // 定义里给了「选项」就再挂一个 ▾：点开是自绘的列表（原生 datalist 弹窗
    // 是白底、CSS 管不到，暗色主题里刺眼）。输入框照样能直接打字。
    if (f.选项 && f.选项.length) {
      const 箭 = document.createElement('span');
      箭.className = 'ctl 选';
      箭.textContent = '▾';
      箭.title = '从常用的里面挑一个';
      箭.addEventListener('pointerdown', e => e.stopPropagation());
      箭.addEventListener('click', e => { e.stopPropagation(); 开选项(s, f.选项); });
      head.appendChild(箭);
    }
  });

  if (b.类型 === '设若') {
    if (!b.分支.some(x => x.终结)) {
      head.appendChild(做按钮('＋否则若', '再加一个条件分支', () => {
        树.加分支(b, { 条件: '变量 大于 0' }, false); 重画();
      }));
      head.appendChild(做按钮('＋否则', '都不是就…', () => {
        树.加分支(b, {}, true); 重画();
      }));
    }
  }

  if (window.Blocks.块说明[b.类型]) {
    head.appendChild(做按钮('?', '这块是干什么用的', () => 显示说明(b.类型, el), '问'));
  }

  head.appendChild(做按钮('✕', '删除', () => {
    if (!树.删(根块们, b.id)) 根块们 = 根块们.filter(x => x !== b);
    重画();
  }, 'del'));

  el.appendChild(head);

  if (定义.可容纳) el.appendChild(做内容区(b.子));

  b.分支.forEach((段, i) => {
    const br = document.createElement('div');
    br.className = 'branch';

    const bh = document.createElement('div');
    bh.className = 'head';

    const k2 = document.createElement('span');
    k2.className = 'kind';
    k2.textContent = 段.终结 ? '否则' : '否则若';
    bh.appendChild(k2);

    const en2 = document.createElement('span');
    en2.className = 'en';
    en2.textContent = 段.终结 ? 'else' : 'else if';
    bh.appendChild(en2);

    if (!段.终结) {
      const s = document.createElement('input');
      s.className = 'fld';
      s.value = 段.字段.条件 ?? '';
      s.placeholder = '再判一个条件';
      自适应宽(s);
      s.addEventListener('input', () => { 段.字段.条件 = s.value; 自适应宽(s); 输出(); });
      bh.appendChild(s);
    }

    // 每一段底下都能再插一个条件分支 —— 不是只有链尾能加
    if (!段.终结) {
      bh.appendChild(做按钮('＋否则若', '在这段后面插一个条件分支', () => {
        b.分支.splice(i + 1, 0, { 字段: { 条件: '变量 大于 0' }, 子: [], 终结: false });
        重画();
      }));
    }
    // 否则只有一个，而且只能贴在最后
    if (!段.终结 && !b.分支.some(x => x.终结)) {
      bh.appendChild(做按钮('＋否则', '都不是就…', () => {
        b.分支.push({ 字段: {}, 子: [], 终结: true });
        重画();
      }));
    }
    bh.appendChild(做按钮('✕', '删掉这一分支', () => { b.分支.splice(i, 1); 重画(); }, 'del'));
    br.appendChild(bh);
    br.appendChild(做内容区(段.子));
    el.appendChild(br);
  });

  挂拖动(b, el);

  return el;
}

// ---------------- 自绘下拉 ----------------
let 选项层 = null, 选项锚 = null;

function 关选项() {
  if (选项层) 选项层.remove();
  选项层 = null;
  选项锚 = null;
}

function 开选项(s, 选项们) {
  if (选项锚 === s) { 关选项(); return; }
  关选项();

  const 层 = document.createElement('div');
  层.className = '选项层';
  for (const v of 选项们) {
    const 行 = document.createElement('div');
    行.className = '选项行' + (v === s.value ? ' 选中' : '');
    行.textContent = v;
    行.addEventListener('pointerdown', e => e.preventDefault());   // 别让输入框先失焦
    行.addEventListener('click', e => {
      e.stopPropagation();
      s.value = v;
      s.dispatchEvent(new Event('input', { bubbles: true }));
      关选项();
    });
    层.appendChild(行);
  }
  document.body.appendChild(层);

  const 锚r = s.getBoundingClientRect();
  const 层r = 层.getBoundingClientRect();
  let 左 = Math.min(window.innerWidth - 层r.width - 8, Math.max(8, 锚r.left));
  let 上 = 锚r.bottom + 5;
  if (上 + 层r.height > window.innerHeight - 8) 上 = Math.max(8, 锚r.top - 层r.height - 5);
  层.style.left = Math.round(左) + 'px';
  层.style.top = Math.round(上) + 'px';

  选项层 = 层;
  选项锚 = s;
}

document.addEventListener('pointerdown', e => {
  if (!选项层) return;
  if (选项层.contains(e.target)) return;
  if (e.target.classList && e.target.classList.contains('选')) return;
  关选项();
}, true);

function 做按钮(文字, 提示, 处理, 额外类) {

// ---------------- 布局 ----------------
// 子块是绝对定位，撑不开内容区；内容区变高，爹那块会自动变高，
// 但再往上一层又变成绝对定位 —— 链就断在那儿。
// 所以尺寸只能自己算，而且**一次算到底**：
//
//   内容区宽 = max(子块右边界) + 间距
//   内容区高 = max(子块下边界) + 间距      ← 间距固定，这就是「下边界之间的距离」
//   块高     = 头高 + 内容区高 + 底距 [+ 每个分支的同款]
//
// 全程只量两样东西：块的「头」有多高、叶子块有多大。
// 这两样都只受自己内容影响，不受容器影响 —— 量一次就准，量完再也不用回头。
const 布 = {
  间距: 20,      // 子块下边界 → 内容区下边界，固定值
  最小宽: 120,
  最小高: 56,
  侧距: 24,      // 内容区左右 margin：16 + 8
  底距: 10,      // 内容区 margin-bottom（必须和 CSS 的 .body margin 一致）
  分支线: 1,     // .branch 的 border-top
  边框: 2,       // 内容区上下各 1px 虚线
};

function 布局(根们) {
  const 图 = new Map();
  (function 走(列表) {
    for (const b of 列表) {
      图.set(b.id, b);
      走(b.子 || []);
      for (const 段 of b.分支 || []) 走(段.子 || []);
    }
  })(根们);

  const 头高 = new Map();
  const 段头高 = new Map();
  const 叶 = new Map();
  for (const el of (当前画布 || 世界).querySelectorAll('.blk')) {
    const id = Number(el.dataset.id);
    const 头 = el.querySelector(':scope > .head');
    // ⚠️ 一律用 offsetWidth/offsetHeight，**不能**用 getBoundingClientRect。
    //    后者是缩放后的屏幕尺寸；画布缩到 0.6 时量出来只有六成，
    //    内容区就被设窄，容器右边界装不下里面的块 —— 而且拖一次量一次，越拖越歪。
     if (头) 头高.set(id, 头.offsetHeight);
    段头高.set(id, [...el.querySelectorAll(':scope > .branch > .head')]
      .map(x => x.offsetHeight));
    if (!el.querySelector(':scope > .body')) {
      叶.set(id, { 宽: el.offsetWidth, 高: el.offsetHeight });
    }
  }

  // 一个内容区该多大（只看它的子块，不看 DOM）
  function 体(子们) {
    let 宽 = 布.最小宽, 高 = 布.最小高;
    for (const c of 子们 || []) {
      宽 = Math.max(宽, (c.x || 0) + 块宽(c) + 布.间距);
      高 = Math.max(高, (c.y || 0) + 块高(c) + 布.间距);
    }
    return { 宽, 高 };
  }

  function 块宽(b) {
    const s = 叶.get(b.id);
    if (s) return s.宽;
    let w = 体(b.子).宽;
    for (const 段 of b.分支 || []) w = Math.max(w, 体(段.子).宽);
    return w + 布.侧距;
  }

  function 块高(b) {
    const s = 叶.get(b.id);
    if (s) return s.高;
    let h = 头高.get(b.id) || 34;
    if (!块定义[b.类型].可容纳) return h;
    h += 体(b.子).高 + 布.底距;
    const 段s = 段头高.get(b.id) || [];
    (b.分支 || []).forEach((段, i) => {
      h += (段s[i] || 34) + 布.分支线 + 体(段.子).高 + 布.底距;
    });
    return h;
  }

  // 把算出来的高度记回树对象：生成顺序要拿它判断「哪几块垂直上重叠 = 同一行」
  (function 记高(列表) {
    for (const b of 列表) {
      b._h = 块高(b);
      b._w = 块宽(b);
      记高(b.子 || []);
      for (const 段 of b.分支 || []) 记高(段.子 || []);
    }
  })(根们);

  刷顺序(根们, 世界);

  // 尺寸算完，写回各内容区
  for (const el of (当前画布 || 世界).querySelectorAll('.blk')) {
    const b = 图.get(Number(el.dataset.id));
    if (!b) continue;
    const 主 = el.querySelector(':scope > .body');
    if (主) 写盒(主, 体(b.子));
    [...el.querySelectorAll(':scope > .branch')].forEach((段el, i) => {
      const 段 = (b.分支 || [])[i];
      if (!段) return;
      const bb = 段el.querySelector(':scope > .body');
      if (bb) 写盒(bb, 体(段.子));
    });
  }
}

function 写盒(body, s) {
  const 宽 = Math.round(s.宽 + 布.边框);
  const 高 = Math.round(s.高 + 布.边框);
  body.style.setProperty('--w', 宽 + 'px');
  body.style.setProperty('--h', 高 + 'px');
  body.style.minWidth = 宽 + 'px';
  body.style.minHeight = 高 + 'px';
}

// 内容区 = 小画布。尺寸不在这里定，交给 布局() 统一算。
function 做内容区(列表) {
  const body = document.createElement('div');
  body.className = 'body';
  body.dataset.box = '1';
  // 按生成时的顺序编号 —— 并排摆的块是从左到右，不是从上看下来
  for (const 子 of 列表) body.appendChild(渲染块(子));
  return body;
}

// 执行顺序依赖块的真实高度（换行会让块变高），
// 所以只能在 布局() 把尺寸算完、写回 _h/_w 之后再统一刷。
// 渲染时先摆着，这里统一刷一遍。
function 刷顺序(列表, 容器el) {
  if (!列表 || !列表.length) return;
  const 序 = 树.按行读(列表);
  for (let i = 0; i < 序.length; i++) {
    const b = 序[i];
    const el = 容器el.querySelector(':scope > .blk[data-id="' + b.id + '"]');
    const 头 = el && el.querySelector(':scope > .head');
    if (!头) continue;

    let o = 头.querySelector(':scope > .ord');
    if (!o) {
      o = document.createElement('span');
      o.className = 'ord';
      头.insertBefore(o, 头.firstChild);
    }
    o.textContent = i + 1;
    o.title = '这块在它这一层里第 ' + (i + 1) + ' 个执行';
  }

  for (const b of 列表) {
    const el = 容器el.querySelector(':scope > .blk[data-id="' + b.id + '"]');
    if (!el) continue;
    const 主体 = el.querySelector(':scope > .body');
    if (主体) 刷顺序(b.子 || [], 主体);
    [...el.querySelectorAll(':scope > .branch')].forEach((段el, k) => {
      const 段 = (b.分支 || [])[k];
      const bb = 段 && 段el.querySelector(':scope > .body');
      if (bb) 刷顺序(段.子 || [], bb);
    });
  }
}


function 深(el) {
  let d = 0, p = el;
  while (p && p !== document.body) { p = p.parentElement; d++; }
  return d;
}

// ---------------- 悬停延长 ----------------
// 子块是绝对定位，不会撑大内容区；内容区变了高，它爹那块也跟着变，
// 但再往上一层又是绝对定位 —— 断在那儿了。
// 所以延长必须是「整条祖先链一起加同样一截」，每层都加，谁也不多。
const 悬停存底 = new Map();
let 这格多高 = 76;      // 这一格向下让出多少 —— 按「要放进来的那块有多高」算，不是死数字

// 一格刚好放得下这一块，再留点空
function 一格高度(块el) {
  // 用 offsetHeight：这是布局高，不受画布缩放影响。
  // 拿 getBoundingClientRect 的话，缩到 0.6 时这一格只有六成高，块塞不进去。
  const h = 块el ? 块el.offsetHeight : 32;
  return Math.max(40, Math.round(h) + 22);
}

function 祖先盒(盒) {
  const 链 = [];
  let b = 盒;
  while (b) {
    链.push(b);
    const 主 = b.parentElement;                       // .blk
    if (!主 || !主.classList.contains('blk')) break;
    b = 主.parentElement;                             // 再外一层 .body
    if (!b || !b.classList.contains('body')) break;
  }
  return 链;
}

function 延长链(盒, 加) {
  for (const b of 祖先盒(盒)) {
    if (加 > 0) {
      if (!悬停存底.has(b)) 悬停存底.set(b, b.style.minHeight);
      const 现 = parseFloat(b.style.minHeight) || 0;
      b.style.minHeight = (现 + 加) + 'px';
    } else {
      if (悬停存底.has(b)) {
        b.style.minHeight = 悬停存底.get(b);
        悬停存底.delete(b);
      }
    }
  }
}

// ---------------- 拖动 ----------------
function 挂拖动(b, el) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('ctl')) return;
    e.stopPropagation();
    // 一律先观望：走够距离才算拖。
    // ⚠️ 这里绝不能一按下就调 开始拖 —— 开始拖第一件事是把块从树上摘下来、
    // 挂到顶层，所以「单击」会当场把内层块从容器里拽出来。单击必须什么都不做。
    阈值拖(b, el, e);
  });
}

function 阈值拖(b, el, 起) {
  const x0 = 起.clientX, y0 = 起.clientY;
  // 按在输入框上给大一点阈值，免得想做文字选择（划选几个字）时被当成拖动
  const 阈 = 起.target.classList.contains('fld') ? 7 : 4;
  const 收 = () => {
    document.removeEventListener('pointermove', 探);
    document.removeEventListener('pointerup', 收);
  };
  const 探 = ev => {
    if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 阈) return;
    收();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    开始拖(b, el, 起);
  };
  document.addEventListener('pointermove', 探);
  document.addEventListener('pointerup', 收);
}

// 块画在哪个容器、那个容器在屏幕上放大多少倍。
// 平时是 #world（放大 视.z）；开了窗户是 内世界（再乘一层 内视.z）。
// 拖拽拿到的都是**屏幕**坐标，换回画布坐标必须除以这个总倍率 ——
// 上一次移植就是漏了这一层，块一拖就飞出去。
function 块容器() { return 当前画布 || 世界; }
// 窗户不在 #world 里（它挂在 body 上是 fixed），所以外层 视.z 不作用在块上。
// 块的有效缩放只有窗户自己那一层 内视.z。没开窗时才用外层的 视.z。
function 总缩放() { return (视.z || 1) * (当前画布 && 窗.内 ? (窗.内视.z || 1) : 1); }

function 开始拖(b, el, 起始) {
  el.classList.add('dragging');
  const 起始rect = el.getBoundingClientRect();
  const 抓x = 起始.clientX - 起始rect.left;
  const 抓y = 起始.clientY - 起始rect.top;

  // 从树上摘下来，但**不重画** —— 一重画，原来的父容器就按剩下的子块重算高度，
  // 当场缩回去，看起来像「拖着拖着盒子塌了」。
  const 原位 = 树.找位置(根块们, b.id);
  if (原位) 原位.列表.splice(原位.下标, 1);
  根块们.push(b);

  const wr0 = 块容器().getBoundingClientRect();
  // getBoundingClientRect 是屏幕坐标，b.x/b.y 是画布坐标。缩放过的画布要除 z。
  b.x = (起始rect.left - wr0.left) / 总缩放();
  b.y = (起始rect.top - wr0.top) / 总缩放();

  // 拖的时候把块挂到 body 上用 fixed 跟手，不再放回 #world。
  // 留在 .stage 里的话，一拖出画布边缘就被 overflow 裁掉 —— 看着像「拖出来只剩半截」。
  世界.appendChild(el);          // 先脱离原来的父容器
  document.body.appendChild(el); // 再挂到最外层
  el.style.position = 'fixed';
  el.style.left = '0';
  el.style.top = '0';
  el.style.margin = '0';
  // ⚠️ 宽度要用**布局宽**（offsetWidth），不能用 起始rect.width。
  //    后者是缩放后的屏幕宽；块离开画布就没有 scale(z) 了，
  //    拿屏幕宽当布局宽写死，块会当场胀大（z<1 时）或缩水（z>1 时）。
  el.style.width = el.offsetWidth + 'px';
  el.style.transformOrigin = '0 0';
  el.style.transform = `translate(${起始rect.left}px, ${起始rect.top}px) scale(${总缩放()})`;
  el.style.pointerEvents = 'none';   // 让底下的内容区能被 elementFromPoint 找到

  const 新el = el;
  let 悬停盒 = null;
  let 在托盘上 = false;

  const 移 = ev => {
    // ⚠️ 基准必须是 块容器()（可能是窗户里的 内世界），不是 #world。
    //    两者差着几千像素 —— 拿 #world 当基准，屏幕移 100 像素会被换算成
    //    数据移一万多（实测 10218），块直接飞出天外。
    const wx = 块容器().getBoundingClientRect();
    b.x = (ev.clientX - wx.left - 抓x) / 总缩放();
    b.y = (ev.clientY - wx.top - 抓y) / 总缩放();
    // 拖的时候保持同一个缩放，视觉上才和原来一样大
    新el.style.transform =
      `translate(${ev.clientX - 抓x}px, ${ev.clientY - 抓y}px) scale(${总缩放()})`;

    // 鼠标底下是哪个内容区；顺带把它的宿主容器放大一点做提示
    const 下 = document.elementFromPoint(ev.clientX, ev.clientY);
    const 到托盘了 = !!(下 && 下.closest && 下.closest('.palette'));
    if (到托盘了 !== 在托盘上) {
      在托盘上 = 到托盘了;
      调.classList.toggle('回收', 在托盘上);
    }
    let 盒 = 下 && 下.closest ? 下.closest('[data-box]') : null;
    // 落在容器的标题行、边框上也算 —— 不然只有正对着虚线框里面才放得进去，很挑
    if (!盒 && 下 && 下.closest) {
      const 主 = 下.closest('.blk.容器');
      if (主) 盒 = 主.querySelector(':scope > .body');
    }

    // 自己或自己的子孙：不能塞，就不给「能放这儿」的暗示
    if (盒) {
      const 宿主el = 盒.closest('.blk');
      const 宿主id = 宿主el ? Number(宿主el.dataset.id) : null;
      if (!宿主id || 树.找位置([b], 宿主id)) 盒 = null;
    }

    if (盒 !== 悬停盒) {
      if (悬停盒) {
        悬停盒.classList.remove('over');
        const 旧主 = 悬停盒.closest('.blk');
        if (旧主) 旧主.classList.remove('目标');
        延长链(悬停盒, -这格多高);
      }
      悬停盒 = 盒;
      if (悬停盒) {
        悬停盒.classList.add('over');
        const 新主 = 悬停盒.closest('.blk');
        if (新主) 新主.classList.add('目标');
        这格多高 = 一格高度(新el);
        延长链(悬停盒, 这格多高);
      }
    }
  };

  const 停 = () => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    调.classList.remove('回收');
    if (悬停盒) {
      悬停盒.classList.remove('over');
      const 主 = 悬停盒.closest('.blk');
      if (主) 主.classList.remove('目标');
      延长链(悬停盒, -这格多高);
    }

    let 收下了 = false;
    if (悬停盒) {
      const 宿主el = 悬停盒.closest('.blk');
      const 宿主id = 宿主el ? Number(宿主el.dataset.id) : null;
      // 不能塞进自己身体里
      if (宿主id && !树.找位置([b], 宿主id)) {
        const 宿主位 = 树.找位置(根块们, 宿主id);
        if (宿主位) {
          // b.x/b.y 已经是画布坐标，直接换算成相对这个内容区
          const 盒rect = 悬停盒.getBoundingClientRect();
          const 世界rect = 块容器().getBoundingClientRect();
          b.x = Math.max(4, b.x - (盒rect.left - 世界rect.left) / 总缩放());
          b.y = Math.max(4, b.y - (盒rect.top - 世界rect.top) / 总缩放());

          根块们 = 根块们.filter(x => x !== b);
          // 找这个盒属于哪个列表（子 or 某分支）
          收进(悬停盒, 宿主位.块, b);
          收下了 = true;
        }
      }
    }

    if (!收下了) {
      根块们 = 根块们.filter(x => x !== b);
      if (!在托盘上) {                   // 拖回托盘 = 扔掉（开始拖时就已从树里摘下来了）
        b.x = Math.max(0, b.x);
        b.y = Math.max(0, b.y);
        根块们.push(b);
      }
    }
    // 先按「你把它放在这儿」画出来，不整理 —— 拖动过程中整理会把旁边的块推走。
    重画(true);
    // 松手之后补一次整理：刚放下的这块优先，别人让开。
    // 不整理就会把重叠原样存进存档 —— 一个方法块压住下面三块，重开也还是压着。
    if (清全部重叠(b.id)) {
      布局(根块们);
      存盘();
    }
  };

  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
}

// 把一个块塞进宿主。
// ⚠ 不能一律 push 到 .子 —— 盒可能是「否则若/否则」那一段的内容区，
//   那样块会跑到主内容区去，看起来就是「从属关系乱了」。
function 收进(盒, 宿主块, b) {
  const 段el = 盒 && 盒.parentElement;
  if (段el && 段el.classList && 段el.classList.contains('branch')) {
    const 段们 = [...段el.parentElement.querySelectorAll(':scope > .branch')];
    const i = 段们.indexOf(段el);
    const 段 = i >= 0 ? (宿主块.分支 || [])[i] : null;
    if (段) { 段.子.push(b); return; }
  }
  宿主块.子.push(b);
}

// 松手时把重叠的块往下推 —— 这样「插到中间」不用自己挪位置，
// 放下去后面的一串自动让开。没有重叠的块一个都不动，自由摆放不受影响。
// 同一行的块（垂直方向上有重叠）当成一组，组内不互相推。
// 优先id：刚放下的那块。它先占住位置，别人让开 —— 不这样的话，
// 被放下的块 y 比撞上的块大，就会轮到自己被顶下去，看着像「弹回原处」。
function 清全部重叠(优先id) {
  let 动过 = false;
  (function 走(列表) {
    if (!列表 || !列表.length) return;
    if (清重叠(列表, 优先id)) 动过 = true;
    for (const b of 列表) {
      走(b.子);
      for (const 段 of b.分支 || []) 走(段.子);
    }
  })(根块们);
  return 动过;
}

function 清重叠(列表, 优先id) {
  let 动过 = false;
  if (!列表 || 列表.length < 2) return false;
  const 排 = [...列表].sort((x, y) => {
    if (优先id != null) {
      if (x.id === 优先id) return -1;
      if (y.id === 优先id) return 1;
    }
    return (x.y || 0) - (y.y || 0);
  });
  const 已放 = [];
  for (const b of 排) {
    let 顶 = b.y || 0;
    const 高 = b._h || 32, 宽 = b._w || 160;
    // 前面的块如果跟它在两个方向上都重叠，就把它顶下去（可以连着顶好几次）
    for (let 再 = true; 再;) {
      再 = false;
      for (const a of 已放) {
        const a顶 = a.y || 0, a底 = a顶 + (a._h || 32);
        const a左 = a.x || 0, a右 = a左 + (a._w || 160);
        const 竖撞 = 顶 < a底 && a顶 < 顶 + 高;
        const 横撞 = (b.x || 0) < a右 && a左 < (b.x || 0) + 宽;
        // 取整：拖动落点的 y 是「屏幕坐标 ÷ 缩放」算出来的，带小数。
        // 不取整的话这串小数会被存进存档，再被一层层加下去越长越难看。
        if (竖撞 && 横撞) { 顶 = Math.round(a底) + 8; 再 = true; }
      }
    }
    if (顶 !== (b.y || 0)) {
      动过 = true;
      b.y = 顶;
      // 顺手把界面上那个 DOM 也挪了 —— 只改被推开的这几个，不遍历全树
      const el = document.querySelector(`.blk[data-id="${b.id}"]`);
      if (el) el.style.top = 顶 + 'px';
    }
    已放.push(b);
  }
  return 动过;
}

// ---------------- 从托盘拖到画布 ----------------
// 按住托盘上的块，直接在鼠标位置造一个**真的块**，然后走画布上那套拖动。
// 这样：
//   · 拖的时候看到的就是最终那个块，不是一个小标签
//   · 落进哪个框、拖回托盘扔掉，全都复用现成逻辑，不用另写一套"放下"
//   · 只点一下不移动，块就落在原地（等于原来那种随手加一块）
const 落点偏移x = 28;
const 落点偏移y = 14;

function 挂托盘(c, 类型) {
  c.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();

    const 起 = { x: e.clientX, y: e.clientY };
    let 已建 = false;

    // 在 (cx,cy) 造一个真块 —— 位置要让鼠标落在块的左上角往里一点，
    // 否则块会整块甩到鼠标右下方去
    const 造在 = (cx, cy) => {
      已建 = true;
      const 块 = 建(类型, 0, 0);
      根块们.push(块);
      重画(true);                     // 别整理重叠，否则临时位置的块会把别人推走
      // 先让它渲染出来，再按真实位置校正一次 ——
      // 直接拿 cx - world.left 算会有几十像素的偏差（画布边距、块的边框都算进去了）
      const el0 = 世界.querySelector(`.blk[data-id="${块.id}"]`);
      if (el0) {
        const r0 = el0.getBoundingClientRect();
        // 右边是屏幕像素，块坐标是画布坐标 —— 缩放时差一个 z
        块.x = 块.x + ((cx - 落点偏移x) - r0.left) / 总缩放();
        块.y = 块.y + ((cy - 落点偏移y) - r0.top) / 总缩放();
        重画(true);
      }
      return { 块, el: 世界.querySelector(`.blk[data-id="${块.id}"]`) };
    };

    const 收 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };

    const 移 = ev => {
      if (已建) return;
      if (Math.abs(ev.clientX - 起.x) + Math.abs(ev.clientY - 起.y) < 5) return;
      收();                                   // 交给 开始拖 自己接管
      const { 块, el } = 造在(ev.clientX, ev.clientY);
      if (el) 开始拖(块, el, ev);
    };

    const 停 = () => {
      收();
      if (已建) return;
      // 没动 = 点一下。丢到画布看得见的地方，不要留在托盘底下
      const sr = 舞台.getBoundingClientRect();
      造在(sr.left + sr.width * 0.35, sr.top + sr.height * 0.32);
    };

    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// ---------------- 边栏：收起 + 拖宽 ----------------
// 两边一个模子。收起后留 28px 竖条，点竖条展开；把手在竖条上也能拖。
function 装边栏(栏, 名, 最小, 最大) {
  if (!栏 || 栏.dataset.双装) return;
  栏.dataset.双装 = '1';

  const 条 = document.createElement('div');
  条.className = '栏条';
  条.textContent = 名;
  条.title = '点一下展开／收起';
  栏.appendChild(条);

  const 把 = document.createElement('div');
  把.className = '边栏把';
  栏.appendChild(把);

  const 刷字 = () => {
    // 展开时是个小方块（一个「‹」方向就够），收起时竖排写栏名
    条.textContent = 栏.classList.contains('收') ? 名 : (名 === '块栏' ? '◀' : '▶');
  };
  const 收放 = () => {
    栏.classList.toggle('收');
    // 收起来把手就贴在竖条外侧，不然 8px 的把手把 28px 的条占掉大半
    if (!栏.classList.contains('收') && !栏.style.width) 栏.style.width = 最小 + 'px';
    刷字();
  };
  刷字();
  条.addEventListener('click', 收放);
  条.addEventListener('pointerdown', e => e.stopPropagation());

  把.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    把.classList.add('按着');
    // 收起状态下拖，等于「拖开一个新宽度」，起始宽按最小算
    const 起宽 = 栏.classList.contains('收') ? 最小 : 栏.getBoundingClientRect().width;
    const 起x = e.clientX;
    const 左 = 栏.classList.contains('palette');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const 移 = ev => {
      // 左栏往右拖 = 变宽；右栏往左拖 = 变宽，所以要反号
      const 差 = (ev.clientX - 起x) * (左 ? 1 : -1);
      const w = Math.max(最小, Math.min(最大, 起宽 + 差));
      栏.classList.remove('收');
      栏.style.width = w + 'px';
    };
    const 停 = () => {
      把.classList.remove('按着');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// ---------------- 侧栏宽度可拖 ----------------
(function 挂侧栏拖宽() {
  const 栏 = document.querySelector('.palette');
  const 把 = document.createElement('div');
  把.className = 'palette-grip';
  把.style.display = 'none';   // 老的把手让给新的通用把手
  栏.appendChild(把);
  if (false) 把.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    const 起x = e.clientX, 起宽 = 栏.getBoundingClientRect().width;
    把.classList.add('按着');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const 移 = ev => {
      const w = Math.max(120, Math.min(460, 起宽 + ev.clientX - 起x));
      栏.style.width = w + 'px';
    };
    const 停 = () => {
      把.classList.remove('按着');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
})();

// 画布自动变大：块拖到边上时不至于被裁掉
function 自动扩画布() {
  let 右 = 2400, 下 = 1600;
  for (const b of 根块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (!el) continue;
    右 = Math.max(右, b.x + el.offsetWidth + 160);
    下 = Math.max(下, b.y + el.offsetHeight + 160);
  }
  // 网层上的实例框也在同一张画布上 —— 不算进来的话它们会落在 #world 边界外面，
  // 被 .stage 的 overflow:hidden 裁掉，看着像「没显示」
  for (const el of 世界.querySelectorAll('.实例框')) {
    右 = Math.max(右, (parseFloat(el.style.left) || 0) + el.offsetWidth + 160);
    下 = Math.max(下, (parseFloat(el.style.top) || 0) + el.offsetHeight + 160);
  }
  世界.style.width = 右 + 'px';
  世界.style.height = 下 + 'px';
}

// ---------------- 存盘 / 撤销 ----------------
// 一个「工程」= 一张画布（整棵树，含每个块的坐标和字段）。
// 工程表存在 localStorage 里，打开时全部读回来；顶栏的标签页对应它。
const 存档键 = 'zh-editor-工程表';
let 工程表 = {};          // 名字 → { 块们, 改 }
let 当前工程 = '';
let 历史 = [], 历史位 = -1, 正在撤销 = false;

// 布局缓存（_h/_w）不进快照 —— 它们只是渲染产物，混进去会让「看起来没变」也算一次改动
function 快照() {
  return JSON.stringify(根块们, (k, v) => (k === '_h' || k === '_w') ? undefined : v);
}

function 记历史() {
  if (正在撤销) return;
  const 现 = 快照();
  if (历史[历史位] === 现) return;
  历史 = 历史.slice(0, 历史位 + 1);
  历史.push(现);
  if (历史.length > 120) { 历史.shift(); }
  历史位 = 历史.length - 1;
}

function 存盘() {
  try {
    if (!当前工程) return;
    工程表[当前工程] = { ...(工程表[当前工程] || {}), 块们: JSON.parse(快照()), 改: Date.now() };
    localStorage.setItem(存档键, JSON.stringify(工程表));
  } catch (e) { /* 存不了就算了，不能因此让编辑器挂掉 */ }
}

// 数据里万一同一个块既是爹又是孙子，布局会无限递归把主线程打死。
// 用「当前路径」判环（回溯时删掉），只切掉环上那一刀。
// ⚠ 只在读档时跑一次 —— 挂在每次重画上会把拖动搞卡死（重画是热路径）。
function 修环(列表, 路径) {
  const 出 = [];
  for (const b of 列表 || []) {
    if (!b || 路径.has(b)) continue;
    路径.add(b);
    b.子 = 修环(b.子, 路径);
    for (const 段 of b.分支 || []) 段.子 = 修环(段.子, 路径);
    路径.delete(b);
    出.push(b);
  }
  return 出;
}

function 读盘() {
  try {
    const t = localStorage.getItem(存档键);
    if (!t) return false;
    const 数据 = JSON.parse(t);
    if (!数据 || typeof 数据 !== 'object' || Array.isArray(数据)) return false;
    工程表 = 数据;
    const 名字 = Object.keys(工程表);
    if (!名字.length) return false;
    for (const 名 of 名字) {
      const 项 = 工程表[名];
      if (项 && Array.isArray(项.块们)) 项.块们 = 修环(项.块们, new Set());
    }
    当前工程 = 名字[0];
    根块们 = 工程表[当前工程].块们 || [];
    return true;
  } catch (e) { return false; }
}

// ---------- 多工程 ----------
function 切到工程(名) {
  if (!工程表[名]) return;
  存盘();                       // 先把当前这个存一下
  当前工程 = 名;
  根块们 = 修环(工程表[名].块们 || [], new Set());
  工程表[名].块们 = 根块们;
  历史 = []; 历史位 = -1;      // 历史不跨工程，不然撤销会串到别的文件
  关说明(); 关选项();
  重画();
  画标签();
  刷新本份标签();
  // 换工程后视野对准这个工程的块（重画完才有 DOM 可量）
  requestAnimationFrame(对准块);
}

function 新工程() {
  let 名 = '未命名';
  let i = 2;
  while (工程表[名]) 名 = '未命名' + (i++);
  工程表[名] = { 块们: [], 改: Date.now() };
  切到工程(名);
}

function 删工程(名) {
  if (!工程表[名]) return;
  if (Object.keys(工程表).length <= 1) { alert('至少留一个工程'); return; }
  if (!confirm('删掉「' + 名 + '」？里面的块就没了。')) return;
  delete 工程表[名];
  const 剩下 = Object.keys(工程表);
  当前工程 = 剩下[0];
  根块们 = 工程表[当前工程].块们 || [];
  历史 = []; 历史位 = -1;
  重画();
  画标签();
  存盘();
}

function 改名工程(旧) {
  const 新 = prompt('改成什么名字？', 旧);
  if (!新 || 新 === 旧) return;
  const 名 = 新.trim();
  if (!名 || 工程表[名]) { alert('这个名字已经有了'); return; }
  工程表[名] = 工程表[旧];
  delete 工程表[旧];
  if (当前工程 === 旧) 当前工程 = 名;
  画标签();
  存盘();
}

function 画标签() {
  const 条 = document.getElementById('tabs');
  if (!条) return;
  条.textContent = '';
  for (const 名 of Object.keys(工程表)) {
    const t = document.createElement('div');
    t.className = 'tab' + (名 === 当前工程 ? ' active' : '');
    t.title = '双击改名';
    const 字 = document.createElement('span');
    字.textContent = 名;
    t.appendChild(字);
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '✕';
    x.title = '删掉这个工程';
    x.addEventListener('pointerdown', e => e.stopPropagation());
    x.addEventListener('click', e => { e.stopPropagation(); 删工程(名); });
    t.appendChild(x);
    t.addEventListener('click', () => 切到工程(名));
    t.addEventListener('dblclick', () => 改名工程(名));
    条.appendChild(t);
  }
  const 加 = document.createElement('div');
  加.className = 'tab 新';
  加.textContent = '＋';
  加.title = '新建一个工程';
  加.addEventListener('click', 新工程);
  条.appendChild(加);
}

function 撤销() {
  if (历史位 <= 0) return false;
  历史位--;
  正在撤销 = true;
  try { 根块们 = JSON.parse(历史[历史位]); 重画(); } finally { 正在撤销 = false; }
  return true;
}

function 重做() {
  if (历史位 >= 历史.length - 1) return false;
  历史位++;
  正在撤销 = true;
  try { 根块们 = JSON.parse(历史[历史位]); 重画(); } finally { 正在撤销 = false; }
  return true;
}

// ---------------- 重画 ----------------
let 画序 = 0;
function 重画(跳过重叠整理) {
  const 我 = ++画序;
  悬停存底.clear();
  // 拖动中的块挂在 document.body 上（见 开始拖），所以清理要扫整个文档，
  // 只扫 #world 会把那些副本留在页面里，越拖越多。
  [...document.querySelectorAll('.blk')].forEach(e => e.remove());
  const 提示 = document.getElementById('hintEmpty');
  if (提示) 提示.style.display = 根块们.length ? 'none' : 'block';

  // 块画在哪：开了窗户就画进窗户；
  // 有网但没开窗就**不画** —— 关系网才是默认界面，块是窗户里的内容；
  // 没有网（浏览器直接打开、拉不到数据）就退回老样子摊在 #world 上，别让人对着白屏。
  const 布 = 当前画布 || (网.开 ? null : 世界);
  if (布) for (const b of 根块们) 布.appendChild(渲染块(b));
  标孤岛();
  布局(根块们);
  // 尺寸定了才知道谁真的压住谁 —— 这一步必须在 布局() 之后。
  // ⚠ 但拖放中途那几次重画不能做：新块刚建出来还在临时位置，
  //   会被当成挡路的，把旁边的块全推走 —— 这就是「拖着拖着别人跑了」。
  if (!跳过重叠整理 && 清全部重叠()) {
    布局(根块们);
  }
  // 拖放中途的临时重画也不进历史 —— 否则拖一次会记好几条，撤销一次退不回去
  if (!跳过重叠整理) 记历史();
  存盘();
  自动扩画布();
  输出();

  // 布局只量「叶子块多大、头多高」这两样，而这俩要等字排完才准。
  // 量它们不会反过来影响容器，所以再算一遍是安全的 —— 不会越算越大。
  const 再算 = () => {
    if (我 !== 画序) return;
    布局(根块们);
    // ⚠ 高度是真字排完才准的。第一遍整理时块量得偏矮，推开的量不够 ——
    //    最后那块会压着前一块（实测压 29px）。这里用准了的高度再推一次。
    if (清全部重叠()) {
      布局(根块们);
      自动扩画布();
      存盘();
      return;
    }
    自动扩画布();
  };
  requestAnimationFrame(再算);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(再算);
}

// 孤岛：放在画布最上层、又不是「类」的块。
// 它们生成出来会掉在类外面（Unity 编译不过），所以标红提醒。
const 可顶层 = new Set(['类', '手写一行']);
function 标孤岛() {
  let 数 = 0;
  for (const b of 根块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (!el) continue;
    const 孤 = !可顶层.has(b.类型);
    el.classList.toggle('孤岛', 孤);
    if (孤) 数++;
  }
  let 条 = document.getElementById('孤岛提示');
  if (!条) {
    条 = document.createElement('div');
    条.id = '孤岛提示';
    世界.appendChild(条);
  }
  条.className = 数 ? '孤岛提示' : '孤岛提示 hidden';
  条.textContent = 数 + ' 个块没进类，生成出来会掉在类外面';
}

// 编译不过的三种常见原因，先在这儿挡一道 —— 比生成出坏代码再回 Unity 看红字强
function 查问题() {
  const 问题 = [];

  // ① 顶层两个类同名
  const 类名 = 根块们.filter(b => b.类型 === '类')
    .map(b => String(b.字段.名 || '').trim()).filter(Boolean);
  const 重类 = [...new Set(类名.filter((n, i) => 类名.indexOf(n) !== i))];
  if (重类.length) 问题.push('有两个类都叫「' + 重类.join('」「') + '」');

  // ② 同一层里同一个变量定义了两遍（CS0128）
  // 注意：每层各自判重，所以要把「各层的结论」收集起来，不能只用最外层的返回值
  const 重变 = [];
  const 查层 = (列表) => {
    if (!列表 || !列表.length) return;
    const 名 = [];
    for (const b of 列表) {
      if (b.类型 === '定义变量') {
        const n = String(b.字段.名 || '').trim();
        if (n) 名.push(n);
      }
    }
    const 重 = [...new Set(名.filter((n, i) => 名.indexOf(n) !== i))];
    for (const n of 重) 重变.push(n);
    for (const b of 列表) {
      查层(b.子);
      for (const 段 of b.分支 || []) 查层(段.子);
    }
  };
  查层(根块们);
  if (重变.length) 问题.push('同一层里「' + 重变.join('」「') + '」各定义了两遍');

  // ③ 要输出的东西没加引号 —— 生成 Debug.Log(信息) 就编译不过
  const 裸文字 = [];
  (function 找(列表) {
    for (const b of 列表 || []) {
      if (b.类型 === '打印' || b.类型 === '警告' || b.类型 === '报错') {
        const v = String(b.字段.值 || '').trim();
        if (v && !/^["'].*["']$/.test(v) && /[一-龥]/.test(v)) 裸文字.push(v);
      }
      找(b.子);
      for (const 段 of b.分支 || []) 找(段.子);
    }
  })(根块们);
  if (裸文字.length) 问题.push('「' + 裸文字[0] + '」是文字，要用双引号包起来');

  // ④ 跳出 / 继续 得在循环里；⑤ 返回 要和方法的返回类型对上
  const 找返回 = (列表) => {
    for (const b of 列表 || []) {
      if (b.类型 === '返回') return b;
      const r = 找返回(b.子) || (b.分支 || []).map(段 => 找返回(段.子)).find(Boolean);
      if (r) return r;
    }
    return null;
  };
  const 走 = (列表, 在循环里) => {
    for (const b of 列表 || []) {
      if ((b.类型 === '跳出' || b.类型 === '继续') && !在循环里) {
        问题.push('「' + b.类型 + '」只能放在循环里面，放外面编译不过');
      }
      if (b.类型 === '方法') {
        const 名 = String(b.字段.名 || '未命名');
        const 有类型 = b.字段.返回什么 && b.字段.返回什么 !== '无返回';
        const 返 = 找返回(b.子);
        if (有类型 && !返) 问题.push('方法「' + 名 + '」说了要返回，里面却没有「返回」');
        if (!有类型 && 返 && String(返.字段.值 || '').trim() && String(返.字段.值 || '').trim() !== '0') {
          问题.push('方法「' + 名 + '」没写返回类型，但里面「返回」了值 —— 去块上选一下「交回什么东西」');
        }
      }
      const 是循环 = b.类型 === '重复' || b.类型 === '只要' || b.类型 === '遍历';
      走(b.子, 在循环里 || 是循环);
      for (const 段 of b.分支 || []) 走(段.子, 在循环里 || 是循环);
    }
  };
  走(根块们, false);

  return 问题;
}

let 当前代码 = '';

// 把一段源码画成带行号的逐行列表。C# 和中间层共用它 ——
// 同一个函数画出来的东西，行高、行号宽、padding 天然一模一样。
function 画行(盒, 源) {
  if (!盒) return;
  const 行们 = String(源 || '').split(String.fromCharCode(10));
  // 末尾那个换行不算一行 —— 中文侧生成完没有尾换行、C# 有，
  // 不砍掉的话右边永远多一行，看着像「对不齐」。
  if (行们.length && 行们[行们.length - 1] === '') 行们.pop();
  // 大括号结构线（VS 的 Structure Guide）：一根线对一个没关上的 `{`，
  // 从那一行的 `{` 一直拉到配对的 `}`。
  //
  // ⚠️ 别按缩进画。按缩进画的话，缩进 16 的行会在 0/4/8/12 四个位置各画一根，
  // 但真正有大括号的只有 4 和 12 —— 多出来的那两根是凭空画的，
  // 看着就是把不该连的地方连起来了。
  // 一根线 = 一层 1px 宽的渐变，位置用 ch 指定。
  // ⚠️ 不能写成简写整串（"linear-gradient(...) 4ch 0 / 1px 100% no-repeat"）
  // 然后塞进 background-image —— 那是 background 简写的语法，
  // background-image 只吃图片部分，整串会被当成非法值丢掉，一根线都画不出来。
  //
  // 开括号那一行、闭括号那一行，**这一根线都不画**。
  // 试过「从行中间开始画」，但 `{` 字符自己就占行内 3~15px，
  // 线从 6px 起还是压在 `{` 身上，看着跟括号连成一体 —— 等于没改。
  // VS 就是从 `{` 的下一行才开始，空隙整整一行，一眼看得出线和括号是两回事。
  //
  // 线要挪到「那个字符格的正中」，不能贴格子左边。
  // 字符格左边是 4ch，但 `{` 的字形在格子里是居中的（墨迹落在 985→990，
  // 格子从 985.2 开始），贴着左边画，看着就是往左偏了 3px。
  // 加 0.5ch 正好落在格子中间。
  const 线列 = c => (c + 0.5) + 'ch';
  const 画线 = (字, 线们) => {
    const 要画 = 线们.filter(o => !o.头 && !o.尾);
    if (!要画.length) return;
    const 层 = 'linear-gradient(to right, var(--line) 0 1px, transparent 1px)';
    字.style.backgroundImage = 要画.map(() => 层).join(', ');
    字.style.backgroundPosition = 要画.map(o => 线列(o.c) + ' 0').join(', ');
    字.style.backgroundSize = 要画.map(() => '1px 100%').join(', ');
    字.style.backgroundRepeat = 要画.map(() => 'no-repeat').join(', ');
  };

  const 片 = document.createDocumentFragment();
  // 栈里存的是每个还开着的 `{` 所在列
  const 括号栈 = [];
  行们.forEach((文, i) => {
    const t = (文 || '').trim();
    const 缩进数 = ((文 || '').match(/^ */) || [''])[0].length;

    // `{` 这一行自己也算在这一层里，所以先入栈再画
    if (t === '{') 括号栈.push(缩进数);
    // 每根线要知道自己在这一行是「刚开」「快收」还是「路过」——
    // 头和尾要收一截，中间拉满（见 画线()）
    const 本行线 = 括号栈.map((c, k) => ({
      c,
      头: t === '{' && k === 括号栈.length - 1,
      尾: t === '}' && k === 括号栈.length - 1,
    }));
    // `}` 这一行画完才出栈 —— 这样一对大括号的首尾两行都有线，是连着的
    if (t === '}') 括号栈.pop();

    const 行 = document.createElement('div');
    行.className = 'ln';
    行.dataset.行 = i + 1;
    const 号 = document.createElement('span');
    号.className = 'no';
    号.textContent = i + 1;
    const 字 = document.createElement('span');
    字.className = 'tx' + (文 ? '' : ' 空');
    字.textContent = 文 || ' ';
    if (本行线.length) 画线(字, 本行线);
    行.appendChild(号);
    行.appendChild(字);
    片.appendChild(行);
  });
  盒.textContent = '';
  盒.appendChild(片);
}

let 编译结果 = [];        // [{严重, 行, 列, 码, 说}]
let 检查定时 = 0;

function 排编译检查() {
  const 条 = document.getElementById('errCount');
  if (!有壳()) {
    if (条) { 条.textContent = '（网页版不做编译检查，用 exe 才有）'; 条.className = 'errcount'; }
    return;
  }
  clearTimeout(检查定时);
  检查定时 = setTimeout(() => {
    window.chrome.webview.postMessage({ 命令: '编译检查', 代码: 当前代码 });
  }, 700);

function 标错行() {
  const 行们 = out.querySelectorAll('.ln');
  行们.forEach(l => l.classList.remove('bad', 'warn2'));
  let 错数 = 0, 警数 = 0;
  for (const e of 编译结果) {
    const l = out.querySelector('.ln[data-行="' + e.行 + '"]');
    if (!l) continue;
    if (e.严重 === '错误') { l.classList.add('bad'); 错数++; }
    else { l.classList.add('warn2'); 警数++; }
  }
  const 条 = document.getElementById('errCount');
  if (条) {
    条.className = 'errcount' + (错数 ? ' 有错' : '');
    条.textContent = 错数 ? '✕ ' + 错数 + ' 个错误' + (警数 ? '　⚠ ' + 警数 : '')
                        : (警数 ? '⚠ ' + 警数 + ' 个警告' : '✓ 编译通过');
  }

  const 板 = document.getElementById('errs');
  板.textContent = '';
  if (!编译结果.length) { 板.classList.add('hidden'); return; }
  板.classList.remove('hidden');
  for (const e of 编译结果) {
    const 项 = document.createElement('div');
    项.className = 'err' + (e.严重 === '警告' ? ' 警' : '');
    const 码 = document.createElement('span'); 码.className = '码'; 码.textContent = e.码;
    const 位 = document.createElement('span'); 位.className = '位'; 位.textContent = e.行 + ':' + e.列;
    const 说 = document.createElement('span'); 说.className = '说'; 说.textContent = e.说;
    项.appendChild(码); 项.appendChild(位); 项.appendChild(说);
    项.addEventListener('click', () => 跳行(e.行));
    板.appendChild(项);
  }
}

function 有壳() {

}

function 找类名() {
  const 出处 = 树.生成CSharp(根块们) || '';
  const m = 出处.match(/public class\s+(\S+)/);
  return m ? m[1] : '';

function 存到Unity() {
  const 代码 = 当前代码 || '';
  if (!代码.trim() || 代码.startsWith('//')) { alert('画布还是空的，没什么可存'); return; }
  const 名 = (找类名() || 当前工程 || '未命名') + '.cs';

  if (有壳()) {
    const 上一次 = (工程表[当前工程] && 工程表[当前工程].存到) || '';
    window.chrome.webview.postMessage({ 命令: '存到Unity', 文件名: 名, 内容: 代码, 上次路径: 上一次 });
    return;
  }
  // 网页版：下载出去，自己拖进 Unity
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([代码], { type: 'text/plain;charset=utf-8' }));
  a.download = 名;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

let 当前画布 = null;   // null = 用 世界

// ══════════════════════════════════════════════════════════════
// 网层：Unity 场景里的实例
//
// 和块在**同一张画布、同一套坐标**里 —— 你说过「实例就是另类的代码块」。

// ══════════════════════════════════════════════════════════════
const 网 = {
  开: false,
  实例们: [],          // 后端给的原样数据
  空头们: [],          // 面板上该有东西、那儿是空的（断链）
