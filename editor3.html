<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文套式 · 自由画布</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --text:#d7dce4; --dim:#7b8494;
    --cn:#7ee787; --cs:#79c0ff; --bad:#ff6b6b;
    --kcontain:#a855f7; --kstmt:#22c55e; --kdata:#3b82f6; --kcond:#f59e0b;
  }
  *{box-sizing:border-box}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:#12161d}
  *::-webkit-scrollbar-thumb{background:#2b3341;border-radius:5px;border:2px solid #12161d}
  html,body{height:100%;margin:0;scrollbar-color:#2b3341 #12161d;scrollbar-width:thin}
  body{background:var(--bg);color:var(--text);font-family:"Cascadia Code","Consolas",monospace;
    font-size:12.5px;display:flex;flex-direction:column;overflow:hidden}

  header{padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:10px;flex:none}
  header h1{font-size:13px;margin:0}
  .hint{color:var(--dim);font-size:11.5px}
  .spacer{flex:1}
  button{background:#1f2632;color:var(--text);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
  button:hover{background:#2a3342}

  main{flex:1;display:flex;min-height:0}
  .palette{width:170px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:8px 7px;overflow:auto}
  #palette{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .grp-sec{flex:0 0 auto;min-width:96px}
  .chips{display:flex;flex-direction:column;gap:3px}
  .palette h2{font-size:10.5px;color:var(--dim);margin:0 0 6px}
  .palette h2.grp{font-size:10px;color:#5a6478;margin:8px 0 4px;padding-bottom:3px;
    border-bottom:1px solid #232a36;letter-spacing:1px;cursor:pointer;
    display:flex;align-items:center;gap:4px;user-select:none}
  .palette h2.grp:hover{color:var(--cn)}
  .grp-arrow{font-size:9px;transition:transform .12s;display:inline-block}
  .grp-sec.collapsed .grp-arrow{transform:rotate(-90deg)}
  .grp-sec.collapsed .chips{display:none}

  .chip{padding:4px 8px;border-radius:5px;cursor:grab;user-select:none;
    border:1px dashed #3a4354;background:#1a1f28;font-size:11.5px;
    display:flex;align-items:baseline;gap:5px;white-space:nowrap}
  .chip:hover{border-color:var(--cn);color:var(--cn)}
  .en{font-size:10px;color:#4a5568;font-style:italic;user-select:none}

  .stage{flex:1;overflow:auto;min-width:0}
  #world{position:relative;width:2600px;height:1800px;
    background:radial-gradient(circle,#1b212b 1px,transparent 1px) 0 0/22px 22px}

  /* 块：全部绝对定位，随便摆 */
  .blk{position:absolute;background:#171c25;border:1px solid #2b3341;
    border-left:3px solid var(--kstmt);border-radius:6px;
    min-width:130px;box-shadow:0 2px 8px #0007}
  /* 容器块一开始就要够大，否则刚建出来时包不住任何东西，
     里面的块判成孤岛、容器也就不会长大 —— 先有鸡还是先有蛋 */
  .blk.容器{background:#141922;min-width:270px;min-height:120px}
  .blk[data-t="类"],.blk[data-t="方法"],.blk[data-t="构造函数"]{border-left-color:var(--kcontain)}
  .blk[data-t="设若"],.blk[data-t="只要"],.blk[data-t="重复"],.blk[data-t="遍历"],
  .blk[data-t="多分支"],.blk[data-t="尝试"],.blk[data-t="读按键"]{border-left-color:var(--kcond)}
  .blk[data-t="字段"],.blk[data-t="属性"],.blk[data-t="数组"],.blk[data-t="新建列表"]{border-left-color:var(--kdata)}
  .blk.dragging{opacity:.9;box-shadow:0 10px 30px #000c}
  .blk.孤岛{border-color:var(--bad);border-left-color:var(--bad);
    box-shadow:0 0 0 1px var(--bad),0 0 12px #ff6b6b55}

  .head{display:flex;align-items:center;gap:5px;padding:5px 8px;flex-wrap:wrap;cursor:move}
  .kind{font-size:10px;color:var(--dim);background:#1f2632;padding:0 5px;border-radius:3px}
  .fld{color:var(--cn);border:1px solid transparent;border-radius:3px;padding:0 5px;
    outline:none;background:#12161d;font-size:11.5px;font-family:inherit;
    height:20px;line-height:18px;vertical-align:middle;cursor:text}
  .fld:focus{border-color:var(--cn);background:#0d1117}
  .fld::placeholder{color:#4a5568}
  .ctl{color:#6b7688;cursor:pointer;padding:0 4px;user-select:none;font-size:11px}
  .ctl:hover{color:var(--cn)}
  .ctl.del:hover{color:var(--bad)}

  .code{width:38%;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .code .title{padding:5px 10px;font-size:10.5px;color:var(--dim);
    border-bottom:1px solid var(--line);background:var(--panel)}
  .code pre{margin:0;padding:10px;overflow:auto;color:var(--cs);font-size:11.5px;
    line-height:1.5;flex:1;white-space:pre}
  .warn{padding:4px 10px;background:#2a1414;color:var(--bad);font-size:11px;border-top:1px solid #442020}
  .warn.hidden{display:none}
</style>
</head>
<body>

<header>
  <h1>中文套式 · 自由画布</h1>
  <span class="hint">块随便摆 ｜ 摆进某个框里 = 归它 ｜ 框会自动长大包住里面的块</span>
  <span class="spacer"></span>
  <button id="copyBtn">复制 C#</button>
  <button id="clearBtn">清空</button>
</header>

<main>
  <aside class="palette">
    <h2>点一下加块</h2>
    <div id="palette"></div>
  </aside>

  <section class="stage">
    <div id="world"></div>
  </section>

  <section class="code">
    <div class="title">生成的 C#</div>
    <pre id="out"></pre>
    <div class="warn hidden" id="warn"></div>
  </section>
</main>

<script src="translator.js"></script>
<script src="unity-words.js"></script>
<script src="zh2unity.js"></script>
<script src="blocks.js"></script>
<script src="space.js"></script>
<script>
const { 块定义 } = window.Blocks;
const 空间 = window.空间;

let 序号 = 0;
let 层 = 0;
const 块们 = [];
const 世界 = document.getElementById('world');
const 舞台 = document.querySelector('.stage');
const out = document.getElementById('out');
const 警告 = document.getElementById('warn');

// ---------------- 建块 ----------------
function 建(类型, x, y) {
  const 定义 = 块定义[类型];
  const b = { id: ++序号, 类型, 字段: {}, x, y, z: ++层 };
  (定义.字段 || []).forEach(f => { b.字段[f.k] = f.默认 ?? ''; });
  块们.push(b);
  return b;
}

function 自适应宽(el) {
  let 宽 = 0;
  for (const ch of el.value) 宽 += ch.charCodeAt(0) > 255 ? 15 : 8;
  el.style.width = Math.max(40, 宽 + 26) + 'px';
}

// ---------------- 渲染 ----------------
function 渲一块(b) {
  const 定义 = 块定义[b.类型];
  const el = document.createElement('div');
  el.className = 'blk' + (定义.可容纳 ? ' 容器' : '');
  el.dataset.t = b.类型;
  el.dataset.id = b.id;
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.style.zIndex = b.z;

  const head = document.createElement('div');
  head.className = 'head';

  const kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = b.类型;
  head.appendChild(kind);

  if (定义.英文) {
    const en = document.createElement('span');
    en.className = 'en';
    en.textContent = 定义.英文;
    head.appendChild(en);
  }

  (定义.字段 || []).forEach(f => {
    const s = document.createElement('input');
    s.className = 'fld';
    s.value = b.字段[f.k] ?? '';
    s.placeholder = f.提示;
    自适应宽(s);
    s.addEventListener('input', () => { b.字段[f.k] = s.value; 自适应宽(s); 重绘(); });
    s.addEventListener('mousedown', e => e.stopPropagation());
    head.appendChild(s);
  });

  head.appendChild(做按钮('✕', '删除', () => {
    const i = 块们.indexOf(b);
    if (i >= 0) 块们.splice(i, 1);
    重绘();
  }, 'del'));

  el.appendChild(head);

  if (定义.可容纳) {
    const a = document.createElement('div');
    a.style.cssText = 'color:#4a5568;font-size:10.5px;padding:0 10px 8px 10px';
    a.textContent = '（块摆进这个框＝归它）';
    el.appendChild(a);
  }

  // 拖动。必须用 pointer 事件启动 —— 和后面的 pointermove / pointerup 同一套，
  // 混用 mousedown + pointermove 时，某些环境里 pointermove 收不到，
  // 表现就是「按下去块在原地抖」。
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('fld') || e.target.classList.contains('ctl')) return;
    e.preventDefault();
    e.stopPropagation();
    开始拖(b, el, e);
  });

  return el;
}

function 做按钮(文字, 提示, 处理, 额外类) {
  const s = document.createElement('span');
  s.className = 'ctl' + (额外类 ? ' ' + 额外类 : '');
  s.textContent = 文字;
  s.title = 提示;
  s.addEventListener('mousedown', e => e.stopPropagation());
  s.addEventListener('click', e => { e.stopPropagation(); 处理(); });
  return s;
}

// ---------------- 拖动 ----------------
// 按当前的父子推导结果，找出某个块的全部子孙
function 找子孙(根id, 父表) {
  const 结果 = [];
  const 走 = id => {
    for (const [子id, 父id] of 父表) {
      if (父id !== id) continue;
      const 子 = 块们.find(b => b.id === 子id);
      if (子) { 结果.push(子); 走(子id); }
    }
  };
  走(根id);
  return 结果;
}

function 开始拖(b, el, 起始) {
  const wr = 世界.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const 抓x = 起始.clientX - r.left;
  const 抓y = 起始.clientY - r.top;

  el.classList.add('dragging');
  b.z = ++层;                    // 拖谁谁浮上来
  el.style.zIndex = b.z;

  // 拖容器时，里面的块要跟着一起走 —— 它们的坐标是独立的，
  // 不会像 DOM 子元素那样自动跟随。
  const 子孙 = 找子孙(b.id, 当前父表);
  const 子起点 = 子孙.map(c => ({ 块: c, x: c.x, y: c.y }));

  const 移 = ev => {
    const nx = ev.clientX - wr.left - 抓x;
    const ny = ev.clientY - wr.top - 抓y;
    const dx = nx - b.x;
    const dy = ny - b.y;

    b.x = nx;
    b.y = ny;
    el.style.left = b.x + 'px';
    el.style.top = b.y + 'px';

    for (const s of 子起点) {
      s.块.x = s.x + dx;
      s.块.y = s.y + dy;
      const se = 世界.querySelector(`.blk[data-id="${s.块.id}"]`);
      if (se) {
        se.style.left = s.块.x + 'px';
        se.style.top = s.块.y + 'px';
      }
    }
    // 拖动中不重新推导 —— 每帧重算会让框一边追块一边长大，
    // 而且父子关系在抖动中被反复改写。松手时统一算一次。
  };

  const 停 = () => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    el.classList.remove('dragging');
    重绘();
  };

  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
}

// ---------------- 核心：量矩形 → 推导父子 → 撑开容器 ----------------
function 量矩形() {
  const wr = 世界.getBoundingClientRect();
  const 表 = new Map();
  for (const b of 块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    表.set(b.id, {
      x: r.left - wr.left, y: r.top - wr.top,
      w: r.width, h: r.height,
    });
  }
  return 表;
}

// 把容器撑到能包住它的孩子们
function 撑开(父表) {
  const 子表 = new Map();
  for (const b of 块们) {
    const p = 父表.get(b.id);
    if (p == null) continue;
    if (!子表.has(p)) 子表.set(p, []);
    子表.get(p).push(b);
  }

  for (const [父id, 子们] of 子表) {
    const 父块 = 块们.find(b => b.id === 父id);
    if (!父块) continue;
    const 父el = 世界.querySelector(`.blk[data-id="${父id}"]`);
    if (!父el) continue;

    let 右 = 0, 下 = 0;
    for (const 子 of 子们) {
      const 子el = 世界.querySelector(`.blk[data-id="${子.id}"]`);
      if (!子el) continue;
      右 = Math.max(右, 子.x + 子el.offsetWidth - 父块.x);
      下 = Math.max(下, 子.y + 子el.offsetHeight - 父块.y);
    }
    父el.style.minWidth = Math.max(200, 右 + 30) + 'px';
    父el.style.minHeight = Math.max(90, 下 + 34) + 'px';
  }
}

// 只算不重画（拖动结束后调用）
let 当前父表 = new Map();
function 重算() {
  // 先把上一步撑出来的额外尺寸清掉，再按内容重撑。
  // 不清的话尺寸只增不减，拖几下就撑成整个画布。
  for (const b of 块们) {
    if (!空间.是容器(b.类型)) continue;
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (el) { el.style.minWidth = ''; el.style.minHeight = ''; }
  }

  // 只迭代两轮：容器变大 → 包住更多块 → 再变大，
  // 迭代多了就会互相追着放大，所以到两轮就停。
  for (let i = 0; i < 2; i++) {
    const 矩形 = 量矩形();
    const 父表 = 空间.推导(块们, 矩形);
    if (i === 1) 当前父表 = 父表;
    撑开(父表);
  }

  const 孤 = new Set(空间.找孤岛(块们, 当前父表).map(b => b.id));
  for (const b of 块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (el) el.classList.toggle('孤岛', 孤.has(b.id));
  }
  输出();
}

function 重绘() {
  [...世界.querySelectorAll('.blk')].forEach(e => e.remove());
  for (const b of 块们) 世界.appendChild(渲一块(b));
  重算();
}

function 输出() {
  try {
    const 代码 = 空间.生成CSharp(块们, 当前父表);
    out.textContent = 代码 || '// 拖个「类」过来开始';
  } catch (e) {
    out.textContent = '生成失败：' + e.message;
  }

  const 孤 = 空间.找孤岛(块们, 当前父表).filter(b => b.类型 !== '类');
  警告.classList.toggle('hidden', !孤.length);
  警告.textContent = 孤.length
    ? `⚠ ${孤.length} 个块没摆进任何框，不会被生成：` +
      孤.map(b => b.类型 + (b.字段.名 || '')).join('、')
    : '';
}

// ---------------- 调色板 ----------------
const 调 = document.getElementById('palette');
const 按组 = window.Blocks.按组归类();

for (const [组名, 类型们] of Object.entries(按组)) {
  if (!类型们.length) continue;
  const 节 = document.createElement('div');
  节.className = 'grp-sec';

  const h = document.createElement('h2');
  h.className = 'grp';
  const 箭 = document.createElement('span');
  箭.className = 'grp-arrow';
  箭.textContent = '▾';
  h.appendChild(箭);
  h.appendChild(document.createTextNode(组名));
  h.addEventListener('click', () => 节.classList.toggle('collapsed'));

  const 箱 = document.createElement('div');
  箱.className = 'chips';

  类型们.forEach(类型 => {
    const c = document.createElement('div');
    c.className = 'chip';
    const 中 = document.createElement('span');
    中.textContent = 类型;
    c.appendChild(中);
    if (块定义[类型].英文) {
      const en = document.createElement('span');
      en.className = 'en';
      en.textContent = 块定义[类型].英文;
      c.appendChild(en);
    }
    c.addEventListener('click', () => {
      建(类型,
         舞台.scrollLeft + 70 + Math.random() * 150,
         舞台.scrollTop + 70 + Math.random() * 150);
      重绘();
    });
    箱.appendChild(c);
  });

  节.appendChild(h);
  节.appendChild(箱);
  调.appendChild(节);
}

document.getElementById('copyBtn').onclick = async () => {
  try {
    await navigator.clipboard.writeText(out.textContent);
    const b = document.getElementById('copyBtn');
    const 旧 = b.textContent; b.textContent = '已复制 ✓';
    setTimeout(() => b.textContent = 旧, 1200);
  } catch { alert('复制失败，手动选中右侧代码'); }
};
document.getElementById('clearBtn').onclick = () => { 块们.length = 0; 重绘(); };

// 预置：类 + 方法 + 设若 + 打印，一层套一层摆在框里
(function 预置(){
  const 类 = 建('类', 60, 40); 类.字段.名 = '敌人';
  const 方 = 建('方法', 100, 95); 方.字段.名 = '更新时';
  const 设 = 建('设若', 130, 150); 设.字段.条件 = '血量 小于等于 0';
  const 打 = 建('打印', 165, 205); 打.字段.值 = '"死了"';
  重绘();
})();
</script>
</body>
</html>
