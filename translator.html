<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文套式 · C# 翻译器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b36;
    --text:#d7dce4; --dim:#7b8494; --cn:#7ee787; --cs:#79c0ff; --warn:#f0b429;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Consolas","Cascadia Code","Courier New",monospace;
    display:flex;flex-direction:column;
  }
  header{
    padding:10px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;background:var(--panel);
  }
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.5px}
  header .hint{font-size:12px;color:var(--dim)}
  header .spacer{flex:1}
  button{
    background:#1f2632;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  button:hover{background:#2a3342}
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .pane + .pane{border-left:1px solid var(--line)}
  .pane .title{
    padding:6px 14px;font-size:12px;color:var(--dim);
    border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:8px;
  }
  .pane .title .tag{
    font-size:11px;padding:1px 6px;border-radius:4px;
    background:#1f2632;color:var(--cn);
  }
  .pane.out .title .tag{color:var(--cs)}
  textarea,pre{
    flex:1;margin:0;padding:14px 16px;border:0;outline:none;resize:none;
    background:transparent;color:var(--text);
    font-family:inherit;font-size:14px;line-height:1.65;
    white-space:pre;overflow:auto;tab-size:4;
  }
  textarea{caret-color:var(--cn)}
  pre{color:var(--cs)}
  .err{
    padding:6px 16px;font-size:12px;color:var(--warn);
    border-top:1px solid var(--line);background:#1a1610;
  }
  .err.hidden{display:none}
  /* 词表抽屉 */
  .wordbook{
    background:var(--panel);border-top:1px solid var(--line);
    padding:8px 16px;font-size:12px;color:var(--dim);
    display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;
  }
  .wordbook b{color:var(--cn);font-weight:600}
  .wordbook i{color:var(--dim);font-style:normal}
  .wordbook .sep{color:#3a4354}
</style>
</head>
<body>

<header>
  <h1>中文套式 · C# 翻译器</h1>
  <span class="hint">左边写中文，右边即时生成英文 C#</span>
  <span class="spacer"></span>
  <button id="copyBtn">复制英文</button>
</header>

<main>
  <section class="pane src">
    <div class="title"><span class="tag">中文</span> 套式源码</div>
    <textarea id="src" spellcheck="false">定义 列表 = new[] { 1, 2, 3, 4, 5 }

遍历（列表 中 x）{
    设若（x 大于 2）{
        打印（x）
    } 否则 {
        打印（0）
    }
}</textarea>
  </section>
  <section class="pane out">
    <div class="title"><span class="tag">C#</span> 生成的英文代码</div>
    <pre id="out"></pre>
  </section>
</main>

<div class="wordbook" id="wordbook"></div>
<div class="err hidden" id="err"></div>

<script src="translator.js"></script>
<script>
// ---- 词表（来自 translator.js 的规则，这里只做展示） ----
const 词表 = [
  ['遍历', 'foreach'],
  ['设若', 'if'],
  ['否则', 'else'],
  ['只要', 'while'],
  ['重复', 'for'],
  ['定义', 'var'],
  ['打印', 'Console.WriteLine'],
  ['返回', 'return'],
];
const wb = document.getElementById('wordbook');
词表.forEach(([cn, cs], i) => {
  if (i) { const s = document.createElement('span'); s.className='sep'; s.textContent='·'; wb.appendChild(s); }
  const b = document.createElement('b'); b.textContent = cn; wb.appendChild(b);
  const i2 = document.createElement('i'); i2.textContent = ' → ' + cs; wb.appendChild(i2);
});

// ---- 翻译与渲染 ----
const src = document.getElementById('src');
const out = document.getElementById('out');
const errBox = document.getElementById('err');

function 更新(){
  try{
    out.textContent = 翻译(src.value) || '// 左边写完就会实时出现在这里';
    errBox.classList.add('hidden');
  }catch(e){
    errBox.textContent = '翻译出错：' + e.message;
    errBox.classList.remove('hidden');
  }
}

src.addEventListener('input', 更新);

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(out.textContent);
    const b = document.getElementById('copyBtn');
    const old = b.textContent;
    b.textContent = '已复制 ✓';
    setTimeout(()=> b.textContent = old, 1200);
  }catch(e){
    errBox.textContent = '复制失败，手动选中右侧代码复制即可';
    errBox.classList.remove('hidden');
  }
});

更新();
</script>
</body>
</html>
