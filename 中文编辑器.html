// Esc 关窗。框放大到占满屏幕之后，框头（含「← 返回」）会跑出视口 ——
// 那时候按钮就在屏幕外面，点不着，人就卡在编辑器里出不来。
// 退出口不能只挂在框头上，键盘得有一个。
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && 窗.el) { e.preventDefault(); 关窗(); return; }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { 关说明(); 关选项(); } });

function 做按钮(文字, 提示, 处理, 额外类) {
  const s = document.createElement('span');
  s.className = 'ctl' + (额外类 ? ' ' + 额外类 : '');
  s.textContent = 文字;
  s.title = 提示;
  s.addEventListener('pointerdown', e => e.stopPropagation());
  s.addEventListener('click', e => { e.stopPropagation(); 处理(); });
  return s;
}

// ---------------- 布局 ----------------
// 子块是绝对定位，撑不开内容区；内容区变高，爹那块会自动变高，
// 但再往上一层又变成绝对定位 —— 链就断在那儿。
// 所以尺寸只能自己算，而且**一次算到底**：
//
//   内容区宽 = max(子块右边界) + 间距
//   内容区高 = max(子块下边界) + 间距      ← 间距固定，这就是「下边界之间的距离」
//   块高     = 头高 + 内容区高 + 底距 [+ 每个分支的同款]
//
// 全程只量两样东西：块的「头」有多高、叶子块有多大。
// 这两样都只受自己内容影响，不受容器影响 —— 量一次就准，量完再也不用回头。
const 布 = {
  间距: 20,      // 子块下边界 → 内容区下边界，固定值
  最小宽: 120,
  最小高: 56,
  侧距: 24,      // 内容区左右 margin：16 + 8
  底距: 10,      // 内容区 margin-bottom（必须和 CSS 的 .body margin 一致）
  分支线: 1,     // .branch 的 border-top
  边框: 2,       // 内容区上下各 1px 虚线
};

function 布局(根们) {
  const 图 = new Map();
  (function 走(列表) {
    for (const b of 列表) {
      图.set(b.id, b);
      走(b.子 || []);
      for (const 段 of b.分支 || []) 走(段.子 || []);
    }
  })(根们);

  const 头高 = new Map();
  const 段头高 = new Map();
  const 叶 = new Map();
  for (const el of (当前画布 || 世界).querySelectorAll('.blk')) {
    const id = Number(el.dataset.id);
    const 头 = el.querySelector(':scope > .head');
    // ⚠️ 一律用 offsetWidth/offsetHeight，**不能**用 getBoundingClientRect。
    //    后者是缩放后的屏幕尺寸；画布缩到 0.6 时量出来只有六成，
    //    内容区就被设窄，容器右边界装不下里面的块 —— 而且拖一次量一次，越拖越歪。
     if (头) 头高.set(id, 头.offsetHeight);
    段头高.set(id, [...el.querySelectorAll(':scope > .branch > .head')]
      .map(x => x.offsetHeight));
    if (!el.querySelector(':scope > .body')) {
      叶.set(id, { 宽: el.offsetWidth, 高: el.offsetHeight });
    }
  }

  // 一个内容区该多大（只看它的子块，不看 DOM）
  function 体(子们) {
    let 宽 = 布.最小宽, 高 = 布.最小高;
    for (const c of 子们 || []) {
      宽 = Math.max(宽, (c.x || 0) + 块宽(c) + 布.间距);
      高 = Math.max(高, (c.y || 0) + 块高(c) + 布.间距);
    }
    return { 宽, 高 };
  }

  function 块宽(b) {
    const s = 叶.get(b.id);
    if (s) return s.宽;
    let w = 体(b.子).宽;
    for (const 段 of b.分支 || []) w = Math.max(w, 体(段.子).宽);
    return w + 布.侧距;
  }

  function 块高(b) {
    const s = 叶.get(b.id);
    if (s) return s.高;
    let h = 头高.get(b.id) || 34;
    if (!块定义[b.类型].可容纳) return h;
    h += 体(b.子).高 + 布.底距;
    const 段s = 段头高.get(b.id) || [];
    (b.分支 || []).forEach((段, i) => {
      h += (段s[i] || 34) + 布.分支线 + 体(段.子).高 + 布.底距;
    });
    return h;
  }

  // 把算出来的高度记回树对象：生成顺序要拿它判断「哪几块垂直上重叠 = 同一行」
  (function 记高(列表) {
    for (const b of 列表) {
      b._h = 块高(b);
      b._w = 块宽(b);
      记高(b.子 || []);
      for (const 段 of b.分支 || []) 记高(段.子 || []);
    }
  })(根们);

  刷顺序(根们, 世界);

  // 尺寸算完，写回各内容区
  for (const el of (当前画布 || 世界).querySelectorAll('.blk')) {
    const b = 图.get(Number(el.dataset.id));
    if (!b) continue;
    const 主 = el.querySelector(':scope > .body');
    if (主) 写盒(主, 体(b.子));
    [...el.querySelectorAll(':scope > .branch')].forEach((段el, i) => {
      const 段 = (b.分支 || [])[i];
      if (!段) return;
      const bb = 段el.querySelector(':scope > .body');
      if (bb) 写盒(bb, 体(段.子));
    });
  }
}

function 写盒(body, s) {
  const 宽 = Math.round(s.宽 + 布.边框);
  const 高 = Math.round(s.高 + 布.边框);
  body.style.setProperty('--w', 宽 + 'px');
  body.style.setProperty('--h', 高 + 'px');
  body.style.minWidth = 宽 + 'px';
  body.style.minHeight = 高 + 'px';
}

// 内容区 = 小画布。尺寸不在这里定，交给 布局() 统一算。
function 做内容区(列表) {
  const body = document.createElement('div');
  body.className = 'body';
  body.dataset.box = '1';
  // 按生成时的顺序编号 —— 并排摆的块是从左到右，不是从上看下来
  for (const 子 of 列表) body.appendChild(渲染块(子));
  return body;
}

// 执行顺序依赖块的真实高度（换行会让块变高），
// 所以只能在 布局() 把尺寸算完、写回 _h/_w 之后再统一刷。
// 渲染时先摆着，这里统一刷一遍。
function 刷顺序(列表, 容器el) {
  if (!列表 || !列表.length) return;
  const 序 = 树.按行读(列表);
  for (let i = 0; i < 序.length; i++) {
    const b = 序[i];
    const el = 容器el.querySelector(':scope > .blk[data-id="' + b.id + '"]');
    const 头 = el && el.querySelector(':scope > .head');
    if (!头) continue;

    let o = 头.querySelector(':scope > .ord');
    if (!o) {
      o = document.createElement('span');
      o.className = 'ord';
      头.insertBefore(o, 头.firstChild);
    }
    o.textContent = i + 1;
    o.title = '这块在它这一层里第 ' + (i + 1) + ' 个执行';
  }

  for (const b of 列表) {
    const el = 容器el.querySelector(':scope > .blk[data-id="' + b.id + '"]');
    if (!el) continue;
    const 主体 = el.querySelector(':scope > .body');
    if (主体) 刷顺序(b.子 || [], 主体);
    [...el.querySelectorAll(':scope > .branch')].forEach((段el, k) => {
      const 段 = (b.分支 || [])[k];
      const bb = 段 && 段el.querySelector(':scope > .body');
      if (bb) 刷顺序(段.子 || [], bb);
    });
  }
}


function 深(el) {
  let d = 0, p = el;
  while (p && p !== document.body) { p = p.parentElement; d++; }
  return d;
}

// ---------------- 悬停延长 ----------------
// 子块是绝对定位，不会撑大内容区；内容区变了高，它爹那块也跟着变，
// 但再往上一层又是绝对定位 —— 断在那儿了。
// 所以延长必须是「整条祖先链一起加同样一截」，每层都加，谁也不多。
const 悬停存底 = new Map();
let 这格多高 = 76;      // 这一格向下让出多少 —— 按「要放进来的那块有多高」算，不是死数字

// 一格刚好放得下这一块，再留点空
function 一格高度(块el) {
  // 用 offsetHeight：这是布局高，不受画布缩放影响。
  // 拿 getBoundingClientRect 的话，缩到 0.6 时这一格只有六成高，块塞不进去。
  const h = 块el ? 块el.offsetHeight : 32;
  return Math.max(40, Math.round(h) + 22);
}

function 祖先盒(盒) {
  const 链 = [];
  let b = 盒;
  while (b) {
    链.push(b);
    const 主 = b.parentElement;                       // .blk
    if (!主 || !主.classList.contains('blk')) break;
    b = 主.parentElement;                             // 再外一层 .body
    if (!b || !b.classList.contains('body')) break;
  }
  return 链;
}

function 延长链(盒, 加) {
  for (const b of 祖先盒(盒)) {
    if (加 > 0) {
      if (!悬停存底.has(b)) 悬停存底.set(b, b.style.minHeight);
      const 现 = parseFloat(b.style.minHeight) || 0;
      b.style.minHeight = (现 + 加) + 'px';
    } else {
      if (悬停存底.has(b)) {
        b.style.minHeight = 悬停存底.get(b);
        悬停存底.delete(b);
      }
    }
  }
}

// ---------------- 拖动 ----------------
function 挂拖动(b, el) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('ctl')) return;
    e.stopPropagation();
    // 一律先观望：走够距离才算拖。
    // ⚠️ 这里绝不能一按下就调 开始拖 —— 开始拖第一件事是把块从树上摘下来、
    // 挂到顶层，所以「单击」会当场把内层块从容器里拽出来。单击必须什么都不做。
    阈值拖(b, el, e);
  });
}

function 阈值拖(b, el, 起) {
  const x0 = 起.clientX, y0 = 起.clientY;
  // 按在输入框上给大一点阈值，免得想做文字选择（划选几个字）时被当成拖动
  const 阈 = 起.target.classList.contains('fld') ? 7 : 4;
  const 收 = () => {
    document.removeEventListener('pointermove', 探);
    document.removeEventListener('pointerup', 收);
  };
  const 探 = ev => {
    if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 阈) return;
    收();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    开始拖(b, el, 起);
  };
  document.addEventListener('pointermove', 探);
  document.addEventListener('pointerup', 收);
}

// 块画在哪个容器、那个容器在屏幕上放大多少倍。
// 平时是 #world（放大 视.z）；开了窗户是 内世界（再乘一层 内视.z）。
// 拖拽拿到的都是**屏幕**坐标，换回画布坐标必须除以这个总倍率 ——
// 上一次移植就是漏了这一层，块一拖就飞出去。
function 块容器() { return 当前画布 || 世界; }
// 窗户不在 #world 里（它挂在 body 上是 fixed），所以外层 视.z 不作用在块上。
// 块的有效缩放只有窗户自己那一层 内视.z。没开窗时才用外层的 视.z。
function 总缩放() { return (视.z || 1) * (当前画布 && 窗.内 ? (窗.内视.z || 1) : 1); }

function 开始拖(b, el, 起始) {
  el.classList.add('dragging');
  const 起始rect = el.getBoundingClientRect();
  const 抓x = 起始.clientX - 起始rect.left;
  const 抓y = 起始.clientY - 起始rect.top;

  // 从树上摘下来，但**不重画** —— 一重画，原来的父容器就按剩下的子块重算高度，
  // 当场缩回去，看起来像「拖着拖着盒子塌了」。
  const 原位 = 树.找位置(根块们, b.id);
  if (原位) 原位.列表.splice(原位.下标, 1);
  根块们.push(b);

  const wr0 = 块容器().getBoundingClientRect();
  // getBoundingClientRect 是屏幕坐标，b.x/b.y 是画布坐标。缩放过的画布要除 z。
  b.x = (起始rect.left - wr0.left) / 总缩放();
  b.y = (起始rect.top - wr0.top) / 总缩放();

  // 拖的时候把块挂到 body 上用 fixed 跟手，不再放回 #world。
  // 留在 .stage 里的话，一拖出画布边缘就被 overflow 裁掉 —— 看着像「拖出来只剩半截」。
  世界.appendChild(el);          // 先脱离原来的父容器
  document.body.appendChild(el); // 再挂到最外层
  el.style.position = 'fixed';
  el.style.left = '0';
  el.style.top = '0';
  el.style.margin = '0';
  // ⚠️ 宽度要用**布局宽**（offsetWidth），不能用 起始rect.width。
  //    后者是缩放后的屏幕宽；块离开画布就没有 scale(z) 了，
  //    拿屏幕宽当布局宽写死，块会当场胀大（z<1 时）或缩水（z>1 时）。
  el.style.width = el.offsetWidth + 'px';
  el.style.transformOrigin = '0 0';
  el.style.transform = `translate(${起始rect.left}px, ${起始rect.top}px) scale(${总缩放()})`;
  el.style.pointerEvents = 'none';   // 让底下的内容区能被 elementFromPoint 找到

  const 新el = el;
  let 悬停盒 = null;
  let 在托盘上 = false;

  const 移 = ev => {
    // ⚠️ 基准必须是 块容器()（可能是窗户里的 内世界），不是 #world。
    //    两者差着几千像素 —— 拿 #world 当基准，屏幕移 100 像素会被换算成
    //    数据移一万多（实测 10218），块直接飞出天外。
    const wx = 块容器().getBoundingClientRect();
    b.x = (ev.clientX - wx.left - 抓x) / 总缩放();
    b.y = (ev.clientY - wx.top - 抓y) / 总缩放();
    // 拖的时候保持同一个缩放，视觉上才和原来一样大
    新el.style.transform =
      `translate(${ev.clientX - 抓x}px, ${ev.clientY - 抓y}px) scale(${总缩放()})`;

    // 鼠标底下是哪个内容区；顺带把它的宿主容器放大一点做提示
    const 下 = document.elementFromPoint(ev.clientX, ev.clientY);
    const 到托盘了 = !!(下 && 下.closest && 下.closest('.palette'));
    if (到托盘了 !== 在托盘上) {
      在托盘上 = 到托盘了;
      调.classList.toggle('回收', 在托盘上);
    }
    let 盒 = 下 && 下.closest ? 下.closest('[data-box]') : null;
    // 落在容器的标题行、边框上也算 —— 不然只有正对着虚线框里面才放得进去，很挑
    if (!盒 && 下 && 下.closest) {
      const 主 = 下.closest('.blk.容器');
      if (主) 盒 = 主.querySelector(':scope > .body');
    }

    // 自己或自己的子孙：不能塞，就不给「能放这儿」的暗示
    if (盒) {
      const 宿主el = 盒.closest('.blk');
      const 宿主id = 宿主el ? Number(宿主el.dataset.id) : null;
      if (!宿主id || 树.找位置([b], 宿主id)) 盒 = null;
    }

    if (盒 !== 悬停盒) {
      if (悬停盒) {
        悬停盒.classList.remove('over');
        const 旧主 = 悬停盒.closest('.blk');
        if (旧主) 旧主.classList.remove('目标');
        延长链(悬停盒, -这格多高);
      }
      悬停盒 = 盒;
      if (悬停盒) {
        悬停盒.classList.add('over');
        const 新主 = 悬停盒.closest('.blk');
        if (新主) 新主.classList.add('目标');
        这格多高 = 一格高度(新el);
        延长链(悬停盒, 这格多高);
      }
    }
  };

  const 停 = () => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    调.classList.remove('回收');
    if (悬停盒) {
      悬停盒.classList.remove('over');
      const 主 = 悬停盒.closest('.blk');
      if (主) 主.classList.remove('目标');
      延长链(悬停盒, -这格多高);
    }

    let 收下了 = false;
    if (悬停盒) {
      const 宿主el = 悬停盒.closest('.blk');
      const 宿主id = 宿主el ? Number(宿主el.dataset.id) : null;
      // 不能塞进自己身体里
      if (宿主id && !树.找位置([b], 宿主id)) {
        const 宿主位 = 树.找位置(根块们, 宿主id);
        if (宿主位) {
          // b.x/b.y 已经是画布坐标，直接换算成相对这个内容区
          const 盒rect = 悬停盒.getBoundingClientRect();
          const 世界rect = 块容器().getBoundingClientRect();
          b.x = Math.max(4, b.x - (盒rect.left - 世界rect.left) / 总缩放());
          b.y = Math.max(4, b.y - (盒rect.top - 世界rect.top) / 总缩放());

          根块们 = 根块们.filter(x => x !== b);
          // 找这个盒属于哪个列表（子 or 某分支）
          收进(悬停盒, 宿主位.块, b);
          收下了 = true;
        }
      }
    }

    if (!收下了) {
      根块们 = 根块们.filter(x => x !== b);
      if (!在托盘上) {                   // 拖回托盘 = 扔掉（开始拖时就已从树里摘下来了）
        b.x = Math.max(0, b.x);
        b.y = Math.max(0, b.y);
        根块们.push(b);
      }
    }
    // 先按「你把它放在这儿」画出来，不整理 —— 拖动过程中整理会把旁边的块推走。
    重画(true);
    // 松手之后补一次整理：刚放下的这块优先，别人让开。
    // 不整理就会把重叠原样存进存档 —— 一个方法块压住下面三块，重开也还是压着。
    if (清全部重叠(b.id)) {
      布局(根块们);
      存盘();
    }
  };

  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
}

// 把一个块塞进宿主。
// ⚠ 不能一律 push 到 .子 —— 盒可能是「否则若/否则」那一段的内容区，
//   那样块会跑到主内容区去，看起来就是「从属关系乱了」。
function 收进(盒, 宿主块, b) {
  const 段el = 盒 && 盒.parentElement;
  if (段el && 段el.classList && 段el.classList.contains('branch')) {
    const 段们 = [...段el.parentElement.querySelectorAll(':scope > .branch')];
    const i = 段们.indexOf(段el);
    const 段 = i >= 0 ? (宿主块.分支 || [])[i] : null;
    if (段) { 段.子.push(b); return; }
  }
  宿主块.子.push(b);
}

// 松手时把重叠的块往下推 —— 这样「插到中间」不用自己挪位置，
// 放下去后面的一串自动让开。没有重叠的块一个都不动，自由摆放不受影响。
// 同一行的块（垂直方向上有重叠）当成一组，组内不互相推。
// 优先id：刚放下的那块。它先占住位置，别人让开 —— 不这样的话，
// 被放下的块 y 比撞上的块大，就会轮到自己被顶下去，看着像「弹回原处」。
function 清全部重叠(优先id) {
  let 动过 = false;
  (function 走(列表) {
    if (!列表 || !列表.length) return;
    if (清重叠(列表, 优先id)) 动过 = true;
    for (const b of 列表) {
      走(b.子);
      for (const 段 of b.分支 || []) 走(段.子);
    }
  })(根块们);
  return 动过;
}

function 清重叠(列表, 优先id) {
  let 动过 = false;
  if (!列表 || 列表.length < 2) return false;
  const 排 = [...列表].sort((x, y) => {
    if (优先id != null) {
      if (x.id === 优先id) return -1;
      if (y.id === 优先id) return 1;
    }
    return (x.y || 0) - (y.y || 0);
  });
  const 已放 = [];
  for (const b of 排) {
    let 顶 = b.y || 0;
    const 高 = b._h || 32, 宽 = b._w || 160;
    // 前面的块如果跟它在两个方向上都重叠，就把它顶下去（可以连着顶好几次）
    for (let 再 = true; 再;) {
      再 = false;
      for (const a of 已放) {
        const a顶 = a.y || 0, a底 = a顶 + (a._h || 32);
        const a左 = a.x || 0, a右 = a左 + (a._w || 160);
        const 竖撞 = 顶 < a底 && a顶 < 顶 + 高;
        const 横撞 = (b.x || 0) < a右 && a左 < (b.x || 0) + 宽;
        // 取整：拖动落点的 y 是「屏幕坐标 ÷ 缩放」算出来的，带小数。
        // 不取整的话这串小数会被存进存档，再被一层层加下去越长越难看。
        if (竖撞 && 横撞) { 顶 = Math.round(a底) + 8; 再 = true; }
      }
    }
    if (顶 !== (b.y || 0)) {
      动过 = true;
      b.y = 顶;
      // 顺手把界面上那个 DOM 也挪了 —— 只改被推开的这几个，不遍历全树
      const el = document.querySelector(`.blk[data-id="${b.id}"]`);
      if (el) el.style.top = 顶 + 'px';
    }
    已放.push(b);
  }
  return 动过;
}

// ---------------- 从托盘拖到画布 ----------------
// 按住托盘上的块，直接在鼠标位置造一个**真的块**，然后走画布上那套拖动。
// 这样：
//   · 拖的时候看到的就是最终那个块，不是一个小标签
//   · 落进哪个框、拖回托盘扔掉，全都复用现成逻辑，不用另写一套"放下"
//   · 只点一下不移动，块就落在原地（等于原来那种随手加一块）
const 落点偏移x = 28;
const 落点偏移y = 14;

function 挂托盘(c, 类型) {
  c.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();

    const 起 = { x: e.clientX, y: e.clientY };
    let 已建 = false;

    // 在 (cx,cy) 造一个真块 —— 位置要让鼠标落在块的左上角往里一点，
    // 否则块会整块甩到鼠标右下方去
    const 造在 = (cx, cy) => {
      已建 = true;
      const 块 = 建(类型, 0, 0);
      根块们.push(块);
      重画(true);                     // 别整理重叠，否则临时位置的块会把别人推走
      // 先让它渲染出来，再按真实位置校正一次 ——
      // 直接拿 cx - world.left 算会有几十像素的偏差（画布边距、块的边框都算进去了）
      const el0 = 世界.querySelector(`.blk[data-id="${块.id}"]`);
      if (el0) {
        const r0 = el0.getBoundingClientRect();
        // 右边是屏幕像素，块坐标是画布坐标 —— 缩放时差一个 z
        块.x = 块.x + ((cx - 落点偏移x) - r0.left) / 总缩放();
        块.y = 块.y + ((cy - 落点偏移y) - r0.top) / 总缩放();
        重画(true);
      }
      return { 块, el: 世界.querySelector(`.blk[data-id="${块.id}"]`) };
    };

    const 收 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };

    const 移 = ev => {
      if (已建) return;
      if (Math.abs(ev.clientX - 起.x) + Math.abs(ev.clientY - 起.y) < 5) return;
      收();                                   // 交给 开始拖 自己接管
      const { 块, el } = 造在(ev.clientX, ev.clientY);
      if (el) 开始拖(块, el, ev);
    };

    const 停 = () => {
      收();
      if (已建) return;
      // 没动 = 点一下。丢到画布看得见的地方，不要留在托盘底下
      const sr = 舞台.getBoundingClientRect();
      造在(sr.left + sr.width * 0.35, sr.top + sr.height * 0.32);
    };

    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// ---------------- 边栏：收起 + 拖宽 ----------------
// 两边一个模子。收起后留 28px 竖条，点竖条展开；把手在竖条上也能拖。
function 装边栏(栏, 名, 最小, 最大) {
  if (!栏 || 栏.dataset.双装) return;
  栏.dataset.双装 = '1';

  const 条 = document.createElement('div');
  条.className = '栏条';
  条.textContent = 名;
  条.title = '点一下展开／收起';
  栏.appendChild(条);

  const 把 = document.createElement('div');
  把.className = '边栏把';
  栏.appendChild(把);

  const 刷字 = () => {
    // 展开时是个小方块（一个「‹」方向就够），收起时竖排写栏名
    条.textContent = 栏.classList.contains('收') ? 名 : (名 === '块栏' ? '◀' : '▶');
  };
  const 收放 = () => {
    栏.classList.toggle('收');
    // 收起来把手就贴在竖条外侧，不然 8px 的把手把 28px 的条占掉大半
    if (!栏.classList.contains('收') && !栏.style.width) 栏.style.width = 最小 + 'px';
    刷字();
  };
  刷字();
  条.addEventListener('click', 收放);
  条.addEventListener('pointerdown', e => e.stopPropagation());

  把.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    把.classList.add('按着');
    // 收起状态下拖，等于「拖开一个新宽度」，起始宽按最小算
    const 起宽 = 栏.classList.contains('收') ? 最小 : 栏.getBoundingClientRect().width;
    const 起x = e.clientX;
    const 左 = 栏.classList.contains('palette');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const 移 = ev => {
      // 左栏往右拖 = 变宽；右栏往左拖 = 变宽，所以要反号
      const 差 = (ev.clientX - 起x) * (左 ? 1 : -1);
      const w = Math.max(最小, Math.min(最大, 起宽 + 差));
      栏.classList.remove('收');
      栏.style.width = w + 'px';
    };
    const 停 = () => {
      把.classList.remove('按着');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// ---------------- 侧栏宽度可拖 ----------------
(function 挂侧栏拖宽() {
  const 栏 = document.querySelector('.palette');
  const 把 = document.createElement('div');
  把.className = 'palette-grip';
  把.style.display = 'none';   // 老的把手让给新的通用把手
  栏.appendChild(把);
  if (false) 把.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    const 起x = e.clientX, 起宽 = 栏.getBoundingClientRect().width;
    把.classList.add('按着');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const 移 = ev => {
      const w = Math.max(120, Math.min(460, 起宽 + ev.clientX - 起x));
      栏.style.width = w + 'px';
    };
    const 停 = () => {
      把.classList.remove('按着');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
})();

// ---------------- 调色板 ----------------
const 调 = document.getElementById('palette');
const 按组 = window.Blocks.按组归类();

for (const [组名, 类型们] of Object.entries(按组)) {
  if (!类型们.length) continue;
  const 节 = document.createElement('div');
  节.className = 'grp-sec';

  const h = document.createElement('h2');
  h.className = 'grp';
  const 箭 = document.createElement('span');
  箭.className = 'grp-arrow';
  箭.textContent = '▾';
  h.appendChild(箭);
  h.appendChild(document.createTextNode(组名));
  h.addEventListener('click', () => 节.classList.toggle('collapsed'));

  const 箱 = document.createElement('div');
  箱.className = 'chips';

  类型们.forEach(类型 => {
    const c = document.createElement('div');
    c.className = 'chip';
    const 中 = document.createElement('span');
    中.textContent = 类型;
    c.appendChild(中);
    c.dataset.t = 类型;
    c.title = 类型 + (块定义[类型].英文 ? '  ' + 块定义[类型].英文 : '');   // 兜底，给看不了自绘浮框的场合
    c.addEventListener('mouseenter', () => 显示简介(类型, c));
    c.addEventListener('mouseleave', 关简介);
    if (块定义[类型].英文) {
      const en = document.createElement('span');
      en.className = 'en';
      en.textContent = 块定义[类型].英文;
      c.appendChild(en);
    }
    挂托盘(c, 类型);
    箱.appendChild(c);
  });

  节.appendChild(h);
  节.appendChild(箱);
  调.appendChild(节);
}

// 画布自动变大：块拖到边上时不至于被裁掉
function 自动扩画布() {
  let 右 = 2400, 下 = 1600;
  for (const b of 根块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (!el) continue;
    右 = Math.max(右, b.x + el.offsetWidth + 160);
    下 = Math.max(下, b.y + el.offsetHeight + 160);
  }
  // 网层上的实例框也在同一张画布上 —— 不算进来的话它们会落在 #world 边界外面，
  // 被 .stage 的 overflow:hidden 裁掉，看着像「没显示」
  for (const el of 世界.querySelectorAll('.实例框')) {
    右 = Math.max(右, (parseFloat(el.style.left) || 0) + el.offsetWidth + 160);
    下 = Math.max(下, (parseFloat(el.style.top) || 0) + el.offsetHeight + 160);
  }
  世界.style.width = 右 + 'px';
  世界.style.height = 下 + 'px';
}

// ---------------- 存盘 / 撤销 ----------------
// 一个「工程」= 一张画布（整棵树，含每个块的坐标和字段）。
// 工程表存在 localStorage 里，打开时全部读回来；顶栏的标签页对应它。
const 存档键 = 'zh-editor-工程表';
let 工程表 = {};          // 名字 → { 块们, 改 }
let 当前工程 = '';
let 历史 = [], 历史位 = -1, 正在撤销 = false;

// 布局缓存（_h/_w）不进快照 —— 它们只是渲染产物，混进去会让「看起来没变」也算一次改动
function 快照() {
  return JSON.stringify(根块们, (k, v) => (k === '_h' || k === '_w') ? undefined : v);
}

function 记历史() {
  if (正在撤销) return;
  const 现 = 快照();
  if (历史[历史位] === 现) return;
  历史 = 历史.slice(0, 历史位 + 1);
  历史.push(现);
  if (历史.length > 120) { 历史.shift(); }
  历史位 = 历史.length - 1;
}

function 存盘() {
  try {
    if (!当前工程) return;
    工程表[当前工程] = { ...(工程表[当前工程] || {}), 块们: JSON.parse(快照()), 改: Date.now() };
    localStorage.setItem(存档键, JSON.stringify(工程表));
  } catch (e) { /* 存不了就算了，不能因此让编辑器挂掉 */ }
}

// 数据里万一同一个块既是爹又是孙子，布局会无限递归把主线程打死。
// 用「当前路径」判环（回溯时删掉），只切掉环上那一刀。
// ⚠ 只在读档时跑一次 —— 挂在每次重画上会把拖动搞卡死（重画是热路径）。
function 修环(列表, 路径) {
  const 出 = [];
  for (const b of 列表 || []) {
    if (!b || 路径.has(b)) continue;
    路径.add(b);
    b.子 = 修环(b.子, 路径);
    for (const 段 of b.分支 || []) 段.子 = 修环(段.子, 路径);
    路径.delete(b);
    出.push(b);
  }
  return 出;
}

function 读盘() {
  try {
    const t = localStorage.getItem(存档键);
    if (!t) return false;
    const 数据 = JSON.parse(t);
    if (!数据 || typeof 数据 !== 'object' || Array.isArray(数据)) return false;
    工程表 = 数据;
    const 名字 = Object.keys(工程表);
    if (!名字.length) return false;
    for (const 名 of 名字) {
      const 项 = 工程表[名];
      if (项 && Array.isArray(项.块们)) 项.块们 = 修环(项.块们, new Set());
    }
    当前工程 = 名字[0];
    根块们 = 工程表[当前工程].块们 || [];
    return true;
  } catch (e) { return false; }
}

// ---------- 多工程 ----------
function 切到工程(名) {
  if (!工程表[名]) return;
  存盘();                       // 先把当前这个存一下
  当前工程 = 名;
  根块们 = 修环(工程表[名].块们 || [], new Set());
  工程表[名].块们 = 根块们;
  历史 = []; 历史位 = -1;      // 历史不跨工程，不然撤销会串到别的文件
  关说明(); 关选项();
  重画();
  画标签();
  刷新本份标签();
  // 换工程后视野对准这个工程的块（重画完才有 DOM 可量）
  requestAnimationFrame(对准块);
}

function 新工程() {
  let 名 = '未命名';
  let i = 2;
  while (工程表[名]) 名 = '未命名' + (i++);
  工程表[名] = { 块们: [], 改: Date.now() };
  切到工程(名);
}

function 删工程(名) {
  if (!工程表[名]) return;
  if (Object.keys(工程表).length <= 1) { alert('至少留一个工程'); return; }
  if (!confirm('删掉「' + 名 + '」？里面的块就没了。')) return;
  delete 工程表[名];
  const 剩下 = Object.keys(工程表);
  当前工程 = 剩下[0];
  根块们 = 工程表[当前工程].块们 || [];
  历史 = []; 历史位 = -1;
  重画();
  画标签();
  存盘();
}

function 改名工程(旧) {
  const 新 = prompt('改成什么名字？', 旧);
  if (!新 || 新 === 旧) return;
  const 名 = 新.trim();
  if (!名 || 工程表[名]) { alert('这个名字已经有了'); return; }
  工程表[名] = 工程表[旧];
  delete 工程表[旧];
  if (当前工程 === 旧) 当前工程 = 名;
  画标签();
  存盘();
}

function 画标签() {
  const 条 = document.getElementById('tabs');
  if (!条) return;
  条.textContent = '';
  for (const 名 of Object.keys(工程表)) {
    const t = document.createElement('div');
    t.className = 'tab' + (名 === 当前工程 ? ' active' : '');
    t.title = '双击改名';
    const 字 = document.createElement('span');
    字.textContent = 名;
    t.appendChild(字);
    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '✕';
    x.title = '删掉这个工程';
    x.addEventListener('pointerdown', e => e.stopPropagation());
    x.addEventListener('click', e => { e.stopPropagation(); 删工程(名); });
    t.appendChild(x);
    t.addEventListener('click', () => 切到工程(名));
    t.addEventListener('dblclick', () => 改名工程(名));
    条.appendChild(t);
  }
  const 加 = document.createElement('div');
  加.className = 'tab 新';
  加.textContent = '＋';
  加.title = '新建一个工程';
  加.addEventListener('click', 新工程);
  条.appendChild(加);
}

function 撤销() {
  if (历史位 <= 0) return false;
  历史位--;
  正在撤销 = true;
  try { 根块们 = JSON.parse(历史[历史位]); 重画(); } finally { 正在撤销 = false; }
  return true;
}

function 重做() {
  if (历史位 >= 历史.length - 1) return false;
  历史位++;
  正在撤销 = true;
  try { 根块们 = JSON.parse(历史[历史位]); 重画(); } finally { 正在撤销 = false; }
  return true;
}

// ---------------- 重画 ----------------
let 画序 = 0;
function 重画(跳过重叠整理) {
  const 我 = ++画序;
  悬停存底.clear();
  // 拖动中的块挂在 document.body 上（见 开始拖），所以清理要扫整个文档，
  // 只扫 #world 会把那些副本留在页面里，越拖越多。
  [...document.querySelectorAll('.blk')].forEach(e => e.remove());
  const 提示 = document.getElementById('hintEmpty');
  if (提示) 提示.style.display = 根块们.length ? 'none' : 'block';

  // 块画在哪：开了窗户就画进窗户；
  // 有网但没开窗就**不画** —— 关系网才是默认界面，块是窗户里的内容；
  // 没有网（浏览器直接打开、拉不到数据）就退回老样子摊在 #world 上，别让人对着白屏。
  const 布 = 当前画布 || (网.开 ? null : 世界);
  if (布) for (const b of 根块们) 布.appendChild(渲染块(b));
  标孤岛();
  布局(根块们);
  // 尺寸定了才知道谁真的压住谁 —— 这一步必须在 布局() 之后。
  // ⚠ 但拖放中途那几次重画不能做：新块刚建出来还在临时位置，
  //   会被当成挡路的，把旁边的块全推走 —— 这就是「拖着拖着别人跑了」。
  if (!跳过重叠整理 && 清全部重叠()) {
    布局(根块们);
  }
  // 拖放中途的临时重画也不进历史 —— 否则拖一次会记好几条，撤销一次退不回去
  if (!跳过重叠整理) 记历史();
  存盘();
  自动扩画布();
  输出();

  // 布局只量「叶子块多大、头多高」这两样，而这俩要等字排完才准。
  // 量它们不会反过来影响容器，所以再算一遍是安全的 —— 不会越算越大。
  const 再算 = () => {
    if (我 !== 画序) return;
    布局(根块们);
    // ⚠ 高度是真字排完才准的。第一遍整理时块量得偏矮，推开的量不够 ——
    //    最后那块会压着前一块（实测压 29px）。这里用准了的高度再推一次。
    if (清全部重叠()) {
      布局(根块们);
      自动扩画布();
      存盘();
      return;
    }
    自动扩画布();
  };
  requestAnimationFrame(再算);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(再算);
}

// 孤岛：放在画布最上层、又不是「类」的块。
// 它们生成出来会掉在类外面（Unity 编译不过），所以标红提醒。
const 可顶层 = new Set(['类', '手写一行']);
function 标孤岛() {
  let 数 = 0;
  for (const b of 根块们) {
    const el = 世界.querySelector(`.blk[data-id="${b.id}"]`);
    if (!el) continue;
    const 孤 = !可顶层.has(b.类型);
    el.classList.toggle('孤岛', 孤);
    if (孤) 数++;
  }
  let 条 = document.getElementById('孤岛提示');
  if (!条) {
    条 = document.createElement('div');
    条.id = '孤岛提示';
    世界.appendChild(条);
  }
  条.className = 数 ? '孤岛提示' : '孤岛提示 hidden';
  条.textContent = 数 + ' 个块没进类，生成出来会掉在类外面';
}

// 编译不过的三种常见原因，先在这儿挡一道 —— 比生成出坏代码再回 Unity 看红字强
function 查问题() {
  const 问题 = [];

  // ① 顶层两个类同名
  const 类名 = 根块们.filter(b => b.类型 === '类')
    .map(b => String(b.字段.名 || '').trim()).filter(Boolean);
  const 重类 = [...new Set(类名.filter((n, i) => 类名.indexOf(n) !== i))];
  if (重类.length) 问题.push('有两个类都叫「' + 重类.join('」「') + '」');

  // ② 同一层里同一个变量定义了两遍（CS0128）
  // 注意：每层各自判重，所以要把「各层的结论」收集起来，不能只用最外层的返回值
  const 重变 = [];
  const 查层 = (列表) => {
    if (!列表 || !列表.length) return;
    const 名 = [];
    for (const b of 列表) {
      if (b.类型 === '定义变量') {
        const n = String(b.字段.名 || '').trim();
        if (n) 名.push(n);
      }
    }
    const 重 = [...new Set(名.filter((n, i) => 名.indexOf(n) !== i))];
    for (const n of 重) 重变.push(n);
    for (const b of 列表) {
      查层(b.子);
      for (const 段 of b.分支 || []) 查层(段.子);
    }
  };
  查层(根块们);
  if (重变.length) 问题.push('同一层里「' + 重变.join('」「') + '」各定义了两遍');

  // ③ 要输出的东西没加引号 —— 生成 Debug.Log(信息) 就编译不过
  const 裸文字 = [];
  (function 找(列表) {
    for (const b of 列表 || []) {
      if (b.类型 === '打印' || b.类型 === '警告' || b.类型 === '报错') {
        const v = String(b.字段.值 || '').trim();
        if (v && !/^["'].*["']$/.test(v) && /[一-龥]/.test(v)) 裸文字.push(v);
      }
      找(b.子);
      for (const 段 of b.分支 || []) 找(段.子);
    }
  })(根块们);
  if (裸文字.length) 问题.push('「' + 裸文字[0] + '」是文字，要用双引号包起来');

  // ④ 跳出 / 继续 得在循环里；⑤ 返回 要和方法的返回类型对上
  const 找返回 = (列表) => {
    for (const b of 列表 || []) {
      if (b.类型 === '返回') return b;
      const r = 找返回(b.子) || (b.分支 || []).map(段 => 找返回(段.子)).find(Boolean);
      if (r) return r;
    }
    return null;
  };
  const 走 = (列表, 在循环里) => {
    for (const b of 列表 || []) {
      if ((b.类型 === '跳出' || b.类型 === '继续') && !在循环里) {
        问题.push('「' + b.类型 + '」只能放在循环里面，放外面编译不过');
      }
      if (b.类型 === '方法') {
        const 名 = String(b.字段.名 || '未命名');
        const 有类型 = b.字段.返回什么 && b.字段.返回什么 !== '无返回';
        const 返 = 找返回(b.子);
        if (有类型 && !返) 问题.push('方法「' + 名 + '」说了要返回，里面却没有「返回」');
        if (!有类型 && 返 && String(返.字段.值 || '').trim() && String(返.字段.值 || '').trim() !== '0') {
          问题.push('方法「' + 名 + '」没写返回类型，但里面「返回」了值 —— 去块上选一下「交回什么东西」');
        }
      }
      const 是循环 = b.类型 === '重复' || b.类型 === '只要' || b.类型 === '遍历';
      走(b.子, 在循环里 || 是循环);
      for (const 段 of b.分支 || []) 走(段.子, 在循环里 || 是循环);
    }
  };
  走(根块们, false);

  return 问题;
}

let 当前代码 = '';

// 把一段源码画成带行号的逐行列表。C# 和中间层共用它 ——
// 同一个函数画出来的东西，行高、行号宽、padding 天然一模一样。
function 画行(盒, 源) {
  if (!盒) return;
  const 行们 = String(源 || '').split(String.fromCharCode(10));
  // 末尾那个换行不算一行 —— 中文侧生成完没有尾换行、C# 有，
  // 不砍掉的话右边永远多一行，看着像「对不齐」。
  if (行们.length && 行们[行们.length - 1] === '') 行们.pop();
  // 大括号结构线（VS 的 Structure Guide）：一根线对一个没关上的 `{`，
  // 从那一行的 `{` 一直拉到配对的 `}`。
  //
  // ⚠️ 别按缩进画。按缩进画的话，缩进 16 的行会在 0/4/8/12 四个位置各画一根，
  // 但真正有大括号的只有 4 和 12 —— 多出来的那两根是凭空画的，
  // 看着就是把不该连的地方连起来了。
  // 一根线 = 一层 1px 宽的渐变，位置用 ch 指定。
  // ⚠️ 不能写成简写整串（"linear-gradient(...) 4ch 0 / 1px 100% no-repeat"）
  // 然后塞进 background-image —— 那是 background 简写的语法，
  // background-image 只吃图片部分，整串会被当成非法值丢掉，一根线都画不出来。
  //
  // 开括号那一行、闭括号那一行，**这一根线都不画**。
  // 试过「从行中间开始画」，但 `{` 字符自己就占行内 3~15px，
  // 线从 6px 起还是压在 `{` 身上，看着跟括号连成一体 —— 等于没改。
  // VS 就是从 `{` 的下一行才开始，空隙整整一行，一眼看得出线和括号是两回事。
  //
  // 线要挪到「那个字符格的正中」，不能贴格子左边。
  // 字符格左边是 4ch，但 `{` 的字形在格子里是居中的（墨迹落在 985→990，
  // 格子从 985.2 开始），贴着左边画，看着就是往左偏了 3px。
  // 加 0.5ch 正好落在格子中间。
  const 线列 = c => (c + 0.5) + 'ch';
  const 画线 = (字, 线们) => {
    const 要画 = 线们.filter(o => !o.头 && !o.尾);
    if (!要画.length) return;
    const 层 = 'linear-gradient(to right, var(--line) 0 1px, transparent 1px)';
    字.style.backgroundImage = 要画.map(() => 层).join(', ');
    字.style.backgroundPosition = 要画.map(o => 线列(o.c) + ' 0').join(', ');
    字.style.backgroundSize = 要画.map(() => '1px 100%').join(', ');
    字.style.backgroundRepeat = 要画.map(() => 'no-repeat').join(', ');
  };

  const 片 = document.createDocumentFragment();
  // 栈里存的是每个还开着的 `{` 所在列
  const 括号栈 = [];
  行们.forEach((文, i) => {
    const t = (文 || '').trim();
    const 缩进数 = ((文 || '').match(/^ */) || [''])[0].length;

    // `{` 这一行自己也算在这一层里，所以先入栈再画
    if (t === '{') 括号栈.push(缩进数);
    // 每根线要知道自己在这一行是「刚开」「快收」还是「路过」——
    // 头和尾要收一截，中间拉满（见 画线()）
    const 本行线 = 括号栈.map((c, k) => ({
      c,
      头: t === '{' && k === 括号栈.length - 1,
      尾: t === '}' && k === 括号栈.length - 1,
    }));
    // `}` 这一行画完才出栈 —— 这样一对大括号的首尾两行都有线，是连着的
    if (t === '}') 括号栈.pop();

    const 行 = document.createElement('div');
    行.className = 'ln';
    行.dataset.行 = i + 1;
    const 号 = document.createElement('span');
    号.className = 'no';
    号.textContent = i + 1;
    const 字 = document.createElement('span');
    字.className = 'tx' + (文 ? '' : ' 空');
    字.textContent = 文 || ' ';
    if (本行线.length) 画线(字, 本行线);
    行.appendChild(号);
    行.appendChild(字);
    片.appendChild(行);
  });
  盒.textContent = '';
  盒.appendChild(片);
}

function 输出() {
  let 代码;
  try {
    代码 = 树.生成CSharp(根块们) || '// 左边点块，右边出代码';
  } catch (e) {
    代码 = '// 生成失败：' + e.message;
  }
  当前代码 = 代码;

  // 中间层：块经「中文转写」出来的样子，跟下面的 C# 是同一件事的两种写法。
  // 渲染成和 C# 完全一样的行结构（同字号/同行高/同行号宽），
  // 两边行数一样，所以第 N 行就是同一件事 —— 并排看、横着对照。
  const 中 = document.getElementById('midOut');
  let 中间 = '';
  try { 中间 = 树.生成(根块们); } catch (e) { 中间 = '// 生成失败：' + e.message; }
  画行(中, 中间);

  画行(out, 代码);
  标错行();

  const 问题 = 查问题();
  if (问题.length) {
    警告.textContent = '⚠ ' + 问题.join('　·　');
    警告.classList.remove('hidden');
  } else {
    警告.classList.add('hidden');
  }

  排编译检查();
}

// ---------------- 真编译检查（像 VS 那样报） ----------------
let 编译结果 = [];        // [{严重, 行, 列, 码, 说}]
let 检查定时 = 0;

function 排编译检查() {
  const 条 = document.getElementById('errCount');
  if (!有壳()) {
    if (条) { 条.textContent = '（网页版不做编译检查，用 exe 才有）'; 条.className = 'errcount'; }
    return;
  }
  clearTimeout(检查定时);
  检查定时 = setTimeout(() => {
    window.chrome.webview.postMessage({ 命令: '编译检查', 代码: 当前代码 });
  }, 700);
}

function 标错行() {
  const 行们 = out.querySelectorAll('.ln');
  行们.forEach(l => l.classList.remove('bad', 'warn2'));
  let 错数 = 0, 警数 = 0;
  for (const e of 编译结果) {
    const l = out.querySelector('.ln[data-行="' + e.行 + '"]');
    if (!l) continue;
    if (e.严重 === '错误') { l.classList.add('bad'); 错数++; }
    else { l.classList.add('warn2'); 警数++; }
  }
  const 条 = document.getElementById('errCount');
  if (条) {
    条.className = 'errcount' + (错数 ? ' 有错' : '');
    条.textContent = 错数 ? '✕ ' + 错数 + ' 个错误' + (警数 ? '　⚠ ' + 警数 : '')
                        : (警数 ? '⚠ ' + 警数 + ' 个警告' : '✓ 编译通过');
  }

  const 板 = document.getElementById('errs');
  板.textContent = '';
  if (!编译结果.length) { 板.classList.add('hidden'); return; }
  板.classList.remove('hidden');
  for (const e of 编译结果) {
    const 项 = document.createElement('div');
    项.className = 'err' + (e.严重 === '警告' ? ' 警' : '');
    const 码 = document.createElement('span'); 码.className = '码'; 码.textContent = e.码;
    const 位 = document.createElement('span'); 位.className = '位'; 位.textContent = e.行 + ':' + e.列;
    const 说 = document.createElement('span'); 说.className = '说'; 说.textContent = e.说;
    项.appendChild(码); 项.appendChild(位); 项.appendChild(说);
    项.addEventListener('click', () => 跳行(e.行));
    板.appendChild(项);
  }
}

// 块画在哪个容器里。
// 平时是最外层的 #world；张开了窗户就画进那扇窗 ——
// 块编辑器本来就是窗户里的内容，不是和实例框并列的另一样东西。
let 当前画布 = null;   // null = 用 世界

// ══════════════════════════════════════════════════════════════
// 网层：Unity 场景里的实例
//
// 和块在**同一张画布、同一套坐标**里 —— 你说过「实例就是另类的代码块」。
// 所以它们跟着同一个 视 缩放平移，不是另一个视图。
//
// 数据来自壳（读 .zh-bridge/关系.db），后端整条链路早就打通了：
//   发 {命令:'关系图数据'} → 收 {命令:'关系图数据', 图:{实例们, 空头们, 线}}
//   拖完发 {命令:'存布局', 项:[{id,x,y}]} → 壳写进 布局 表
// 页面这边一直没调过。现在补上。
//
// ⚠️ 没有壳（直接拿浏览器打开）时这一层是空的，块编辑器照常工作，不报错。
// ══════════════════════════════════════════════════════════════
const 网 = {
  开: false,
  实例们: [],          // 后端给的原样数据
  空头们: [],          // 面板上该有东西、那儿是空的（断链）
  孤岛们: [],
  人线们: [],          // 你在空头框上右键指定的连接 —— 虚线，跟扫描的线分开
  注释框们: [],        // 你按住左键拖出来的「一趟」—— 整理用，不是分类
  位置: new Map(),     // id → { x, y }，拖过之后就记在这儿
  层: null,
  线层: null,
  框层: null,
};

function 建网层() {
  if (网.层) return;
  // 注释框是区域底色，垫在最底下；线压在它上面；实例框再压线
  const 框层 = document.createElement('div');
  框层.id = '注释框层';
  世界.appendChild(框层);
  网.框层 = 框层;

  const 线层 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  线层.id = '线层';
  线层.setAttribute('width', '1');
  线层.setAttribute('height', '1');
  世界.appendChild(线层);
  网.线层 = 线层;

  const 层 = document.createElement('div');
  层.id = '网层';
  世界.appendChild(层);
  网.层 = 层;
}

// ── 大注释框 ──────────────────────────────────────────
//
// 按住左键在空白处拖出一块地方，「这堆是我这段时间在弄的」。
// 是**整理**，不是分类 —— 所以它不代表任何结构关系，只是一块地方。
//
// 所以不建父子表：小框的中心落在大框里，它就属于大框。天然嵌套，不用维护。
// 也因此拖动不用递归 —— 大框把里面所有东西一起挪一遍就够了，不会挪两次。
//
// ⚠️ 跟 Unreal 那套的关键差别：**框不跟着内容自动伸缩**。
//    Unreal 里框不自己长大，一堆人天天手动拖边框；AutoSizeComments 让它自动调，
//    又跟缩放打架（节点尺寸随缩放变，算不准）。这里框是你画多大就多大。

function 元素的位(el) {
  return { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0,
           w: el.offsetWidth, h: el.offsetHeight };
}

function 在框里(框, 位) {
  const 心x = 位.x + 位.w / 2, 心y = 位.y + 位.h / 2;
  return 心x > 框.x && 心x < 框.x + 框.宽 && 心y > 框.y && 心y < 框.y + 框.高;
}

// 这个框里现在装着谁（中心点判定）。运行时算，不存成员表 —— 存了会过期。
function 框里成员(框) {
  const 出 = [];
  if (!网.层) return 出;
  for (const el of 网.层.querySelectorAll('.实例框')) {
    if (el.dataset.id === 框.id) continue;
    if (在框里(框, 元素的位(el))) 出.push(el);
  }
  if (网.框层) for (const el of 网.框层.querySelectorAll('.注释框')) {
    if (el.dataset.id === 框.id) continue;
    if (在框里(框, 元素的位(el))) 出.push(el);
  }
  return 出;
}

function 存注释框() {
  if (!有壳()) return;
  window.chrome.webview.postMessage({
    命令: '存注释框',
    项: 网.注释框们.map(f => ({
      id: f.id, 标题: f.标题 || '', x: f.x, y: f.y,
      宽: f.宽, 高: f.高, 色: f.色 || '', 收起: !!f.收起,
    })),
  });
}

function 建注释框(框) {
  const el = document.createElement('div');
  el.className = '注释框' + (框.收起 ? ' 收起' : '');
  el.dataset.id = 框.id;
  el.style.left = 框.x + 'px';
  el.style.top = 框.y + 'px';
  el.style.width = 框.宽 + 'px';
  el.style.height = 框.宽 ? 框.高 + 'px' : '26px';

  const 头 = document.createElement('div');
  头.className = '框头';
  const 标 = document.createElement('span');
  标.className = '框标题';
  标.textContent = 框.标题 || '';
  // 平时不可编辑，双击才进 —— 不然点在标题文字上就开始选字，框拖不动，
  // 而且「抓哪儿能拖」会取决于标题有几个字，很随机。
  标.contentEditable = 'false';
  标.spellcheck = false;
  标.addEventListener('dblclick', e => {
    e.stopPropagation();
    标.contentEditable = 'true';
    标.focus();
  });
  标.addEventListener('blur', () => {
    标.contentEditable = 'false';
    框.标题 = (标.textContent || '').trim();
    标.textContent = 框.标题;
    存注释框();
  });
  标.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); 标.blur(); }
  });
  const 数 = document.createElement('span');
  数.className = '名额';
  数.textContent = 框里成员(框).length + ' 个';
  头.appendChild(标); 头.appendChild(数);
  el.appendChild(头);

  头.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (标.contentEditable === 'true') return;   // 正在改标题
    e.preventDefault(); e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const 起 = { x: e.clientX, y: e.clientY, ox: 框.x, oy: 框.y };
    // 成员在按下那一刻定死 —— 拖的过程中框跟着动，再算会滑
    const 员 = 框里成员(框).map(m => ({ el: m, 位: 元素的位(m), id: m.dataset.id }));
    const 移 = ev => {
      const z = 视.z || 1;
      const dx = (ev.clientX - 起.x) / z, dy = (ev.clientY - 起.y) / z;
      框.x = Math.round(起.ox + dx);
      框.y = Math.round(起.oy + dy);
      el.style.left = 框.x + 'px';
      el.style.top = 框.y + 'px';
      for (const m of 员) {
        m.el.style.left = Math.round(m.位.x + dx) + 'px';
        m.el.style.top = Math.round(m.位.y + dy) + 'px';
        if (m.id) 网.位置.set(m.id, { x: Math.round(m.位.x + dx), y: Math.round(m.位.y + dy) });
      }
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      存布局(); 存注释框();
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  网.框层.appendChild(el);
}

function 画注释框们() {
  if (!网.框层) return;
  网.框层.textContent = '';
  for (const 框 of 网.注释框们 || []) 建注释框(框);
}

// Ctrl+左键在空白处拖 = 画一个新框。
//
// ⚠️ 原来的设计是右键拖，实测不通：WebView2 里右键按下**不派发 pointerdown**
//    （挂捕获监听看到的只有 pointerup / mouseup / contextmenu），所以起点永远收不到。
//    Alt+左键也不行 —— 那是 Windows 的「拖窗口」手势。
舞台.addEventListener('contextmenu', e => {
  if (e.target.closest('.窗户')) return;
  if (e.target.closest('.空头框')) return;   // 那种右键有自己的申诉菜单
  e.preventDefault();
});

舞台.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !e.ctrlKey) return;
  if (e.target.closest('.窗户') || e.target.closest('.空头框')) return;
  if (!网.开 || !网.框层) return;
  e.preventDefault();

  const 台r = 世界.getBoundingClientRect();
  const z = 视.z || 1;
  const 世界点 = ev => ({
    x: (ev.clientX - 台r.left) / z,
    y: (ev.clientY - 台r.top) / z,
  });
  const 起 = 世界点(e);

  const 预览 = document.createElement('div');
  预览.className = '注释框 拖出中';
  预览.style.left = 起.x + 'px';
  预览.style.top = 起.y + 'px';
  预览.style.width = '0px';
  预览.style.height = '0px';
  网.框层.appendChild(预览);

  const 移 = ev => {
    const p = 世界点(ev);
    const x = Math.min(起.x, p.x), y = Math.min(起.y, p.y);
    预览.style.left = x + 'px';
    预览.style.top = y + 'px';
    预览.style.width = Math.abs(p.x - 起.x) + 'px';
    预览.style.height = Math.abs(p.y - 起.y) + 'px';
  };
  const 停 = ev => {
    document.removeEventListener('pointermove', 移);
    document.removeEventListener('pointerup', 停);
    const p = 世界点(ev);
    const 宽 = Math.abs(p.x - 起.x), 高 = Math.abs(p.y - 起.y);
    预览.remove();
    // 太小的当误触，不建 —— 右键本来就容易顺手按一下
    if (宽 < 40 || 高 < 40) return;
    网.注释框们.push({
      id: '框' + Date.now().toString(36),
      标题: '',
      x: Math.round(Math.min(起.x, p.x)),
      y: Math.round(Math.min(起.y, p.y)),
      宽: Math.round(宽), 高: Math.round(高),
      收起: false,
    });
    画注释框们();
    存注释框();
  };
  document.addEventListener('pointermove', 移);
  document.addEventListener('pointerup', 停);
});

// 不做精细测量 —— 框里目前只有脚本名，高度是确定的。
const 脚本行高 = 32, 实例头高 = 36, 实例脚高 = 22;

// 原地 = 重拉一次数据（申诉完、刷新完），视野别动。
// 网络第一次建出来才需要「对准块」—— 不然你在右上角看某个断口，
// 右键申了一下，整个图缩回 50%，等于把你赶出去了。
function 画网(图, 原地) {
  if (!图 || !Array.isArray(图.实例们)) return;
  const 旧视 = { x: 视.x, y: 视.y, z: 视.z };
  建网层();
  网.开 = true;
  // 页面刚打开时 网.开 还是 false，重画() 按「没有网」的样子把块摊在 #world 上。
  // 网一到它们就该收进去 —— 不收的话打开是 26 个块铺满画布压在网上面，
  // 看着像「网没出来」，其实是被自己的块盖住了。
  // 只删 #world 的直接子块：窗户里的块是另一套，不归这里管。
  for (const el of 世界.querySelectorAll(':scope > .blk')) el.remove();
  网.实例们 = 图.实例们;
  网.线们 = Array.isArray(图.线) ? 图.线 : [];

  // 后端给的 x/y 是网格默认值；拖过的在 位置 里，优先用拖过的
  for (const 实 of 网.实例们) {
    if (!网.位置.has(实.id)) 网.位置.set(实.id, { x: 实.x || 0, y: 实.y || 0 });
  }

  网.层.textContent = '';
  网.孤岛们 = Array.isArray(图.孤岛们) ? 图.孤岛们 : [];
  网.空头们 = Array.isArray(图.空头们) ? 图.空头们 : [];
  网.人线们 = Array.isArray(图.人线们) ? 图.人线们 : [];
  网.申诉们 = Array.isArray(图.申诉们) ? 图.申诉们 : [];
  for (const 实 of 网.实例们) 建实例框(实);
  for (const 孤 of 网.孤岛们) 建孤岛框(孤);
  网.注释框们 = Array.isArray(图.注释框们) ? 图.注释框们 : [];
  画注释框们();

  // 连到 Unity 内置组件的出口：目标不是用户脚本，装不进任何一行里。
  // 按你说的「还是空头」—— 给它一个空头框，写上连到哪个组件。
  // 注意这不是错误：Rigidbody / Renderer 本来就该是组件，所以样式是中性的，不标红。
  {
    const 行存在 = new Set();
    for (const 框el of 网.层.querySelectorAll('.实例框'))
      for (const 行框 of 框el.querySelectorAll('.脚本框'))
        行存在.add(框el.dataset.id + '\u0001' + String(行框.dataset.名 || '').replace(/\[\d+\]$/, ''));
    for (const 实 of 网.实例们) {
      const 源位 = 网.位置.get(实.id);
      for (const s of 实.脚本 || []) {
        for (let k = 0; k < (s.出口 || []).length; k++) {
          const 出口 = s.出口[k];
          const 型 = 出口.到类型 || '?';
          if (出口.到 && 行存在.has(出口.到 + '\u0001' + 型)) continue;   // 有对应用户脚本行，画线就行
          const id = '组件|' + 实.id + '|' + s.名 + '|' + 型 + '|' + k;
          if (网.空头们.some(x => x.id === id)) continue;
          网.空头们.push({
            id, 自: 实.id, 组件: s.名 + '#' + k, 字段: 型, 口: k, 脚本名: s.名,
            种类: '组件', 名: 型, 申诉: null,
            x: 源位 ? 源位.x : 0,
            y: 源位 ? 源位.y + 340 + 网.空头们.length * 100 : 0,
          });
        }
      }
    }
  }

  for (const 空 of 网.空头们) 建空头框(空);
  画脚本索引();
  画申诉区();
  // 窗口尺寸可能变过，重算一遍长宽比
  窗口改了就重排();
  画线();
  自动扩画布();
  // 网来了之后重新对一次视野 —— 打开时视野只对着块，网在右边外面，
  // 看着像「网没出来」。网状图是默认界面，先让人看见它。
  // 但重拉（原地）时不能动视野：那是把正在看的人踢走。
  if (原地) {
    视.x = 旧视.x; 视.y = 旧视.y; 视.z = 旧视.z;
    应用视();
  } else {
    requestAnimationFrame(对准块);
  }
}

// 窗口尺寸变了，所有框的宽度都跟着屏幕比例重算。
// 长宽比是「跟着屏幕走」的，不是建的时候算一次就完事。
function 窗口改了就重排() {
  const 比 = (window.innerWidth || 1400) / (window.innerHeight || 900);
  for (const el of document.querySelectorAll('.实例框')) {
    // 正在编辑的那个框由开窗时定死尺寸，别拿"高 × 比例"去改它
    if (el.querySelector(':scope > .实例体.编辑中')) continue;
    // 孤岛框 / 空头框也带着 .实例框 的类，但它们不是场景实例，宽度是自己定的 —— 别重算
    if (el.classList.contains('孤岛框') || el.classList.contains('空头框')) continue;
    // ⚠️ 必须先把宽度放开再量高度。
    //    不放开的话，宽度还是上一轮算的值，文字换行方式跟着宽度走，
    //    量出来的高度就是旧形状下的高度 —— 一路叠下去框会越来越歪
    //    （实测变成 293×479 = 0.61 的竖条）。
    el.style.width = '';
    const 高 = el.offsetHeight;
    if (!高) continue;
    el.style.width = Math.round(Math.max(180, 高 * 比)) + 'px';
  }
}

// 孤岛：没有实例框的脚本，单独摆一块，红框
function 建孤岛框(孤) {
  if (!网.位置.has(孤.id)) 网.位置.set(孤.id, { x: 孤.x || 0, y: 孤.y || 0 });
  const 位 = 网.位置.get(孤.id);
  const el = document.createElement('div');
  el.className = '实例框 孤岛框';
  el.dataset.id = 孤.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';
  el.style.width = '220px';
  el.style.height = '80px';

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 孤.名 || 孤.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = '孤岛';
  头.appendChild(名); 头.appendChild(签);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  const 说 = document.createElement('div');
  说.className = '实例脚';
  说.style.borderTop = '0';
  说.textContent = 孤.原因 || '场景里没有物体挂这个脚本';
  体.appendChild(说);
  el.appendChild(体);

  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.编钮')) return;
    // ⚠️ 必须挡住传播。不挡的话事件冒泡到舞台，外层画布也开始平移 ——
    //    表现就是「鼠标一按上去，孤岛框跟着整张网跑，抓不住」。
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      存布局();
    };
    // ⚠️ 绑 document 不绑 头：框只有几十像素宽，鼠标一出框 pointermove 就断了，
    //    拖动看起来像「抓不住」。
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(孤.id));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// 空头：脚本往外伸手，那头是空的（面板上那个槽是 None）。
//
// 这类错误在 Unity 里完全静默 —— 不报错、不打日志，跑起来功能集体失效，
// 人只能靠「逐一比对历史版本」才发现。所以它必须出现在图上，而且得刺眼。
//
// 误报是必然的：运行时才赋值的引用，扫描器看不出来。
// 所以右键能申诉 —— 三种处理都写库，重扫不丢。
function 建空头框(空) {
  let 位 = 网.位置.get(空.id);
  if (!位) {
    // 第一次摆：这个口要是长在场上某个实例身上，就摆在它正下方。
    //
    // ⚠️ 不能摆右边。第一版是 源位.x + 470 —— [对准 enemy] 会把源框贴到左上角
    //    (台.left+40)，再往右 470 就到 890px，而舞台可用宽度不到 800
    //    （左栏 + 右边「生成的 C#」栏各占一块），整个空头框被右边栏切掉，
    //    屏幕上只剩「EnemyChase.t」。往下摆就没事：源框看得见，它就在看得见的地方。
    const 源位 = 空.自 ? 网.位置.get(空.自) : null;
    const 序 = Math.max(0, (网.空头们 || []).findIndex(k => k.id === 空.id));
    位 = 源位
      ? { x: 源位.x, y: 源位.y + 300 + 序 * 110 }
      : { x: 空.x || 0, y: 空.y || 0 };
    网.位置.set(空.id, 位);
  }
  const el = document.createElement('div');
  // 组件头不是错误：Rigidbody / Renderer 本来就该是组件，所以用中性样式。
  el.className = '实例框 空头框'
    + (空.种类 === '组件' ? ' 组件头' : '')
    + (空.申诉 === '正常' ? ' 误报' : '');
  el.dataset.id = 空.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';
  el.style.width = '220px';
  el.style.height = '80px';

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 空.名 || 空.字段 || 空.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = 空.申诉 === '正常' ? '已申诉' : (空.种类 === '组件' ? 'Unity 组件' : '缺接应');
  头.appendChild(名); 头.appendChild(签);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  const 说 = document.createElement('div');
  说.className = '实例脚';
  说.style.borderTop = '0';
  说.textContent = 空.申诉 === '正常'
    ? '你申诉过 · 这里没问题'
    : 空.种类 === '组件'
      ? '连到 Unity 内置组件，不是断'
      : '没人来接 · 右键处理';
  体.appendChild(说);
  el.appendChild(体);

  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
    开申诉菜单(空, e);
  });

  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.编钮')) return;
    // 跟孤岛框同一个坑：不挡就会冒泡到舞台，整张网跟着平移，看着像抓不住
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
      存布局();
    };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(空.自));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// ── 申诉菜单 ──────────────────────────────────────────────
// 三个选项都是「你说的话」，不是猜的，所以全部落库：
//   指定连接对象 → 它其实指向谁（连上就不算断了）
//   正常显示     → 误报，别再喊，但框留着（藏了就成了「悄悄消失」）
//   不显示       → 误报，而且不想看见
function 关右键单() {
  const 旧 = document.getElementById('右键单');
  if (旧) 旧.remove();
}

function 做右键单() {
  关右键单();
  const 单 = document.createElement('div');
  单.className = '右键单';
  单.id = '右键单';
  document.body.appendChild(单);
  return 单;
}

function 摆右键单(单, e) {
  const r = 单.getBoundingClientRect();
  单.style.left = Math.max(8, Math.min(e.clientX, window.innerWidth - r.width - 8)) + 'px';
  单.style.top = Math.max(8, Math.min(e.clientY, window.innerHeight - r.height - 8)) + 'px';
}

function 加右键项(单, 字, 事, 险) {
  const 项 = document.createElement('div');
  项.className = '项' + (险 ? ' 险' : '');
  项.textContent = 字;
  项.addEventListener('click', ev => {
    ev.stopPropagation();
    关右键单();
    事();
  });
  单.appendChild(项);
  return 项;
}

function 开申诉菜单(空, e) {
  const 单 = 做右键单();

  const 注 = document.createElement('div');
  注.className = '注';
  注.textContent = String(空.组件 || '').split('|').pop() + ' · ' + (空.字段 || '');
  单.appendChild(注);

  加右键项(单, '它其实指向谁…', () => 开选目标(空, e));
  加右键项(单, '正常显示（这是误报）', () => 发申诉(空.id, '正常'));
  加右键项(单, '不显示', () => 发申诉(空.id, '隐藏'), true);
  if (空.申诉) {
    单.appendChild(Object.assign(document.createElement('div'), { className: '分' }));
    加右键项(单, '撤销申诉', () => 发申诉(空.id, '撤销'));
  }
  摆右键单(单, e);
}

function 开选目标(空, e) {
  const 单 = 做右键单();
  const 注 = document.createElement('div');
  注.className = '注';
  注.textContent = '这个口应该接到谁？选了就连上线，不再报断';
  单.appendChild(注);
  if (!网.实例们.length) {
    加右键项(单, '（场上还没有实例）', () => {}, true);
  }
  for (const 实 of 网.实例们) {
    加右键项(单, 实.名 || 实.id, () => 发申诉(空.id, '连到', 实.id));
  }
  摆右键单(单, e);
}

function 发申诉(id, 动作, 目标) {
  if (!有壳()) {
    console.warn('[申诉] 没有壳，存不下来 ——', id, 动作, 目标);
    return;
  }
  window.chrome.webview.postMessage({ 命令: '存申诉', id, 动作, 目标: 目标 || null });
}

// 点别处 / 按 Esc 关菜单。capture 阶段收，免得被别处的 stopPropagation 吞掉。
document.addEventListener('pointerdown', e => {
  const 单 = document.getElementById('右键单');
  if (单 && !单.contains(e.target)) 关右键单();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') 关右键单();
});


// 已申诉的口。
//
// 为什么要有这一块：申诉成「隐藏」或「连到」之后，空头框就从图上消失了 ——
// 没框就没地方右键，撤销不回来。误报一次就永久错下去，这不行。
// 所以凡是你说过话的断口，都在这里留一行，随时能撤。
function 画申诉区() {
  const 盒 = document.getElementById('申诉区');
  if (!盒) return;
  盒.textContent = '';
  const 们 = 网.申诉们 || [];
  if (!们.length) return;
  const 头 = document.createElement('div');
  头.className = '索引头';
  头.innerHTML = '<span>已申诉</span><span>' + 们.length + '</span>';
  盒.appendChild(头);
  for (const 申 of 们) {
    const 项 = document.createElement('div');
    项.className = '索引项';
    const 名 = String(申.id).split('|');
    // id = 组件|字段|种类。组件可能自带前缀，从右往左取
    const 字 = document.createElement('span');
    字.textContent = (名.length >= 3 ? 名[名.length - 2] : 申.id);
    项.title = 申.id;
    项.appendChild(字);
    const 尾 = document.createElement('span');
    尾.className = '挂';
    尾.textContent = 申.动作 === '连到'
      ? '→ ' + String(申.目标 || '').split('|').pop().split('.').pop()
      : 申.动作;
    项.appendChild(尾);
    项.addEventListener('click', () => 发申诉(申.id, '撤销'));
    盒.appendChild(项);
  }
  const 说 = document.createElement('div');
  说.className = '索引空';
  说.style.paddingTop = '0';
  说.textContent = '点一行撤销';
  盒.appendChild(说);
}

// 左边栏的「所有脚本」索引。点一下把视野对准那个框 ——
// 11 个脚本散在画布上，靠眼睛找太费劲。
function 画脚本索引() {
  const 盒 = document.getElementById('脚本索引');
  if (!盒) return;
  盒.textContent = '';
  const 头 = document.createElement('div');
  头.className = '索引头';
  const 数 = (网.实例们.reduce((n, 实) => n + (实.脚本 || []).length, 0)) + (网.孤岛们 || []).length;
  头.innerHTML = '<span>所有脚本</span><span>' + 数 + '</span>';
  盒.appendChild(头);
  if (!数) {
    const 空 = document.createElement('div');
    空.className = '索引空';
    空.textContent = '还没有脚本';
    盒.appendChild(空);
    return;
  }
  const 加 = (名, 挂谁, 孤, id) => {
    const 项 = document.createElement('div');
    项.className = '索引项' + (孤 ? ' 孤' : '');
    项.title = 孤 ? (名 + '（无人挂载）') : (名 + ' → ' + 挂谁);
    const 字 = document.createElement('span');
    字.textContent = 名;
    项.appendChild(字);
    const 尾 = document.createElement('span');
    尾.className = '挂';
    尾.textContent = 孤 ? '✗ 无人挂载' : 挂谁;
    项.appendChild(尾);
    项.addEventListener('click', () => 对准目标(id));
    盒.appendChild(项);
  };
  for (const 实 of 网.实例们) for (const sc of 实.脚本 || []) 加(sc.名, 实.名, false, 实.id);
  for (const 孤 of 网.孤岛们 || []) 加(孤.名, '', true, 孤.id);
}

// 把视野挪到某个框上，保持当前缩放
function 对准目标(id) {
  const el = 网.层 && 网.层.querySelector('.实例框[data-id="' + CSS.escape(id) + '"]');
  if (!el) return;
  const 台 = 舞台.getBoundingClientRect();
  const z = 视.z || 1;
  视.x = 台.left + 40 - (parseFloat(el.style.left) || 0) * z;
  视.y = 台.top + 40 - (parseFloat(el.style.top) || 0) * z;
  应用视();
  // 闪一下，让人知道对到哪了
  el.animate([{ outline: '2px solid #7a6a3f' }, { outline: '2px solid transparent' }],
    { duration: 900 });
}

function 建实例框(实) {
  const 位 = 网.位置.get(实.id);
  const el = document.createElement('div');
  el.className = '实例框';
  el.dataset.id = 实.id;
  el.style.left = 位.x + 'px';
  el.style.top = 位.y + 'px';

  const 头 = document.createElement('div');
  头.className = '实例头';
  const 名 = document.createElement('span');
  名.className = '实例名';
  名.textContent = 实.名 || 实.id;
  const 签 = document.createElement('span');
  签.className = '实例签';
  签.textContent = (实.tag || 'Untagged') + ' · L' + (实.层 ?? 0);
  // 「框占满屏幕后，内部改为编辑器画布」—— 这个按钮就是那句话里的「按一个按钮」。
  // 不用自动：自动切换会在你只想看数据的时候被强行夺走视线。
  const 编钮 = document.createElement('span');
  编钮.className = '编钮';
  编钮.textContent = '✎ 编辑';
  编钮.title = '把这个框的内部变成编辑器画布（要先放大到占满屏幕）';
  编钮.addEventListener('click', e => {
    e.stopPropagation();
    const 首个 = (实.脚本 || [])[0];
    if (!首个) { 网提示('这个实例上没挂脚本'); return; }
    if (窗.el && 窗.实例 === 实.id) { 关窗(); return; }
    开窗(el, 首个.名);
  });
  头.appendChild(名);
  头.appendChild(签);
  头.appendChild(编钮);
  el.appendChild(头);

  const 体 = document.createElement('div');
  体.className = '实例体';
  for (const s of 实.脚本 || []) {
    const 框 = document.createElement('div');
    框.className = '脚本框';
    const 行 = document.createElement('div');
    行.className = '脚本名';

    const 字 = document.createElement('span');
    字.textContent = s.名 || '?';
    行.appendChild(字);

    // 出口：每有一个向外的条件，就有一个点。你说过「每有一个向外的条件，就有一个连线节点」
    const 口数 = (s.出口 || []).length;
    if (口数) {
      const 点们 = document.createElement('span');
      点们.className = '脚本口';
      for (let k = 0; k < 口数; k++) {
        const 点 = document.createElement('i');
        // 这个点就是「连线节点」的落点 —— 线从这儿出去，不从这个实例框整条边出去。
        // 你在 b459 说的：「线只负责告知…与具体块绑定，先连到脚本边框，再连到外面」。
        点.dataset.口 = k;
        点.title = (s.出口[k].条件 || s.出口[k].名 || '') + ' → ' + 名短(s.出口[k].到);
        点们.appendChild(点);
      }
      行.appendChild(点们);
    }
    // 点脚本名 = 张开这扇窗。窗口只在够大的时候才开（见 够大()）
    框.dataset.名 = s.名 || '';
    行.title = '点开这个脚本的块';
    行.addEventListener('click', e => {
      e.stopPropagation();
      开窗(el, s.名);
      装窗缩放();
    });
    框.appendChild(行);
    体.appendChild(框);
  }
  el.appendChild(体);

  const 脚 = document.createElement('div');
  脚.className = '实例脚';
  脚.textContent = 实.组件 || '';
  el.appendChild(脚);

  // 长宽比 = 屏幕比例。先让内容把高度撑出来，再反过来定宽：宽 = 高 × 比。
  // 这样脚本多的框自动宽、少的自动窄，形状始终跟着屏幕走；
  // 放大到占满屏幕时，里面那块画布就是一块正常的横的编辑区，不是方的。
  requestAnimationFrame(() => { if (el.isConnected) 窗口改了就重排(); });

  // 拖标题条移动整个框。用 pointer 事件，坐标除以视.z —— 和块用的是同一套换算。
  头.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // ⚠️ 点按钮不参与拖动。头的 pointerdown 会 preventDefault，
    //    把后面那次 click 掐掉 —— 于是「← 返回」「✎ 编辑」看着点不动。
    if (e.target.closest('.编钮')) return;
    e.preventDefault();
    e.stopPropagation();
    头.setPointerCapture(e.pointerId);
    const 起 = { x: e.clientX, y: e.clientY, ox: 位.x, oy: 位.y };
    const 移 = ev => {
      位.x = Math.round(起.ox + (ev.clientX - 起.x) / (视.z || 1));
      位.y = Math.round(起.oy + (ev.clientY - 起.y) / (视.z || 1));
      el.style.left = 位.x + 'px';
      el.style.top = 位.y + 'px';
      画线();
    };
    const 停 = () => {
      头.removeEventListener('pointermove', 移);
      头.removeEventListener('pointerup', 停);
      存布局();
    };
    头.addEventListener('pointermove', 移);
    头.addEventListener('pointerup', 停);
  });

  // 悬停 = 只看这一束
  el.addEventListener('mouseenter', () => 点亮(实.id));
  el.addEventListener('mouseleave', 熄灭);
  网.层.appendChild(el);
}

// ── 走线 ────────────────────────────────────────────────
//
// 只走横平竖直，绕开挡路的框。
//
// 为什么正交：曲线绕过框时曲率大的地方会跟框的边界糊在一起，
// 看着像「线连到了那个框上」—— 学术里管这叫 edge ambiguity
// （Ambiguity-Free Edge-Bundling, TVCG：线重叠在不相关节点上会让人误判连接关系）。
// Unreal 的 Gridline Blueprints 就是「正交 + 节点避让 + 线间距」三件套，
// 这里抄前两件，线间距用「起点按框高散开」顶上。
function 竖段干净(x, 上, 下, 框位, 自id, 到id) {
  const 留 = 12;
  for (const [id, b] of 框位) {
    if (id === 自id || id === 到id) continue;
    if (x > b.x - 留 && x < b.x + b.w + 留 && 下 > b.y - 留 && 上 < b.y + b.h + 留) return false;
  }
  return true;
}

// ── 走线两种画法，可切 ───────────────────────────────────
//
// 曲线：Blender / Unreal / Unity Shader Graph 的默认形态（noodle）。
//       控制点沿出口方向水平拉开，短距离收紧、长距离张开 ——
//       ComfyUI 的 NKD Reroutes 把这个叫 elasticity。
// 正交：电路板走线。Unreal 的 Electronic Nodes / Gridline Blueprints 那一路，
//       卖点是「gets rid of the usual spaghetti mess」。
//
// 实测正交的难处：Slider(599-670) 和 Cube(526-631) 水平几乎重叠，中间还夹着 coin，
// 竖段放哪儿都撞，于是被一路推到画布外再绕回来 —— 量出来宽 703 高 836，绕了大半张图。
// 曲线不受这个约束，弯过去就行。所以默认用曲线。
// 在控制台 `走线法='正交'; 画线()` 可以切回去比。
let 走线法 = '曲线';

// 选从源框哪一边连到目标框哪一边。
//
// 光比中心会失手：Slider(599-670) 中心 634 在 Cube(526-631) 中心 578 右边，
// 判成「往右」，于是用 Slider 右边(670) → Cube 左边(526) —— 可 670 > 526，
// 两端前后颠倒。贝塞尔的控制点会朝「出口方向」伸，方向一颠倒就伸进源框内部，
// 线从框里穿出去（实测截图里那条斜穿底边的线就是它）。
//
// 换成按端点选：哪种连法的两端不打架就用哪种。
//
// ⚠️ 但光按端点还不够 —— 两个框**上下相邻、左右重叠**时（coin 在 Cube 正下方，
//    水平完全落在 Cube 的范围里），左右两种连法都不成立，退成「源左 → 目标右」，
//    结果 x1=coin.left(565)、x2=Cube.right(851)，这整条线都躺在 Cube 的 x 范围里，
//    等于从 Cube 框内部出发、钻出底边。截图里那两条就是从这儿来的。
//
//    所以先判上下：横向重叠、纵向不重叠时，走上下边。
function 连哪边(源, 的) {
  const 横叠 = 的.x < 源.x + 源.w && 的.x + 的.w > 源.x;
  const 纵离 = 的.y >= 源.y + 源.h || 的.y + 的.h <= 源.y;
  if (横叠 && 纵离) return { 竖: true, 往下: 的.y > 源.y };

  const dA = 的.x - (源.x + 源.w);          // 源右 → 目标左（往右）
  if (dA > 0) return { 往右: true, x1: 源.x + 源.w, x2: 的.x };
  const dB = (的.x + 的.w) - 源.x;          // 源左 → 目标右（往左要 dB<0）
  if (dB < 0) return { 往右: false, x1: 源.x, x2: 的.x + 的.w };
  return { 往右: true, x1: 源.x, x2: 的.x + 的.w };
}

function 曲线路(x1, y1, x2, y2) {
  const 距 = Math.abs(x2 - x1);
  const 伸 = Math.min(Math.max(距 * 0.5, 30), 180);
  const 朝 = x2 >= x1 ? 1 : -1;
  return `M ${x1} ${y1} C ${x1 + 朝 * 伸} ${y1}, ${x2 - 朝 * 伸} ${y2}, ${x2} ${y2}`;
}

// 竖着连（源在上、目标在下，或反过来）：控制点沿竖直方向拉开。
function 曲线路竖(x1, y1, x2, y2) {
  const 距 = Math.abs(y2 - y1);
  const 伸 = Math.min(Math.max(距 * 0.45, 26), 150);
  const 朝 = y2 >= y1 ? 1 : -1;
  return `M ${x1} ${y1} C ${x1} ${y1 + 朝 * 伸}, ${x2} ${y2 - 朝 * 伸}, ${x2} ${y2}`;
}

function 选走线(x1, y1, x2, y2, 框位, 自id, 到id, 竖) {
  if (走线法 === '正交') {
    if (竖) {
      const 中y = (y1 + y2) / 2;
      return 折线成路([[x1, y1], [x1, 中y], [x2, 中y], [x2, y2]], 14);
    }
    return 折线成路(正交点(x1, y1, x2, y2, 框位, 自id, 到id), 14);
  }
  return 竖 ? 曲线路竖(x1, y1, x2, y2) : 曲线路(x1, y1, x2, y2);
}

// 从 (x1,y1) 到 (x2,y2) 的一条正交折线，返回**点列表**（不是 path 字符串）。
// 中间竖段从正中往两边试，取第一个不穿过别的框的位置 —— 找不到就用正中。
//
// ⚠️ 两个方向都得能走。原来只会「源右 → 目标左」，碰上目标在左边就硬绕一个大回环
//    （实测绕到画布顶部横跨半张图），丑而且根本跟不住。现在调用方按目标方向选出口边，
//    这里只负责在两点之间找一条干净的竖段。
function 正交点(x1, y1, x2, y2, 框位, 自id, 到id) {
  const 左 = Math.min(x1, x2), 右 = Math.max(x1, x2);
  const 上 = Math.min(y1, y2), 下 = Math.max(y1, y2);

  // 两点横向几乎重合：没地方放竖段，先竖后横（Unreal「竖段侧移」的简化版）
  if (右 - 左 < 28) return [[x1, y1], [x1, y2], [x2, y2]];

  const 中 = (x1 + x2) / 2;
  let mx = 中;
  if (!竖段干净(中, 上, 下, 框位, 自id, 到id)) {
    for (let k = 1; k <= 20; k++) {
      const a = 中 - k * 28, b = 中 + k * 28;
      if (a > 左 + 14 && 竖段干净(a, 上, 下, 框位, 自id, 到id)) { mx = a; break; }
      if (b < 右 - 14 && 竖段干净(b, 上, 下, 框位, 自id, 到id)) { mx = b; break; }
    }
  }
  return [[x1, y1], [mx, y1], [mx, y2], [x2, y2]];
}

// 把折线的拐角磨成圆弧。
//
// 为什么：直角走线看着像电路板上的生硬铜线，四个尖角并排就是"丑"的来源。
// 真实 PCB 走线的转角是圆的。加圆角不改变走向 —— 该绕的框还是绕开了 ——
// 但线条立刻从「硬折」变成「转弯」。
// 半径取 min(角半径, 相邻两段长的一半)，短段不会被圆弧吃掉。
function 折线成路(点们, 角半径) {
  if (点们.length < 2) return '';
  const 段长 = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const 数 = v => (Math.round(v * 10) / 10);
  let d = `M ${数(点们[0][0])} ${数(点们[0][1])}`;
  for (let i = 1; i < 点们.length - 1; i++) {
    const p0 = 点们[i - 1], p1 = 点们[i], p2 = 点们[i + 1];
    const l1 = 段长(p0, p1), l2 = 段长(p1, p2);
    const rr = Math.min(角半径, l1 / 2, l2 / 2);
    if (rr < 1) { d += ` L ${数(p1[0])} ${数(p1[1])}`; continue; }
    const u1 = [(p1[0] - p0[0]) / (l1 || 1), (p1[1] - p0[1]) / (l1 || 1)];
    const u2 = [(p2[0] - p1[0]) / (l2 || 1), (p2[1] - p1[1]) / (l2 || 1)];
    const a = [p1[0] - u1[0] * rr, p1[1] - u1[1] * rr];
    const b = [p1[0] + u2[0] * rr, p1[1] + u2[1] * rr];
    d += ` L ${数(a[0])} ${数(a[1])} Q ${数(p1[0])} ${数(p1[1])} ${数(b[0])} ${数(b[1])}`;
  }
  const 末 = 点们[点们.length - 1];
  d += ` L ${数(末[0])} ${数(末[1])}`;
  return d;
}

// 悬停一个框：只留跟它有关的那几根线。
// 一次只看一束 —— 这比任何走线算法都管用。
function 点亮(id) {
  const 层 = 网.线层;
  if (!层 || !id) return;
  const 相关 = new Set([id]);
  for (const p of 层.querySelectorAll('path[data-自]')) {
    const 自 = p.dataset.自, 到 = p.dataset.到;
    if (自 === id || 到 === id) {
      相关.add(自); 相关.add(到);
      p.classList.add('亮'); p.classList.remove('暗');
    } else {
      p.classList.add('暗'); p.classList.remove('亮');
    }
  }
  // 挂在它身上的空头框也算「有关」—— 那是它缺的东西
  for (const 空 of 网.空头们 || []) if (空.自 === id) 相关.add(空.id);
  for (const f of 网.层.querySelectorAll('.实例框')) {
    f.classList.toggle('暗', !!f.dataset.id && !相关.has(f.dataset.id));
  }
}

function 熄灭() {
  const 层 = 网.线层;
  if (!层) return;
  for (const p of 层.querySelectorAll('path[data-自]')) p.classList.remove('暗', '亮');
  for (const f of 网.层.querySelectorAll('.实例框')) f.classList.remove('暗');
}

// 线：从出口点连到目标实例框的左边。
// 目标找不到就不画 —— 画不出来就是画不出来，别假装连上了。
function 画线() {
  if (!网.线层) return;
  const 层 = 网.线层;
  层.textContent = '';
  const 框位 = new Map();
  for (const el of 网.层.querySelectorAll('.实例框')) {
    框位.set(el.dataset.id, { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0,
      w: el.offsetWidth, h: el.offsetHeight });
  }

  const 画一条 = (d, 颜色, 粗, 自, 到, 虚线) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 颜色);
    p.setAttribute('stroke-width', 粗);
    p.setAttribute('stroke-linejoin', 'round');
    if (虚线) p.setAttribute('stroke-dasharray', 虚线);
    p.setAttribute('opacity', '0.8');
    if (自) p.dataset.自 = 自;
    if (到) p.dataset.到 = 到;
    层.appendChild(p);
    return p;
  };
  // 箭头指向线进来的方向。上下连的时候箭头得朝上/朝下，不能一律朝右。
  const 画箭头 = (x, y, 颜色, 自, 到, 朝) => {
    const 型 = {
      右: 'l -8 -4 l 0 8 z',
      左: 'l 8 -4 l 0 8 z',
      下: 'l -4 -8 l 8 0 z',
      上: 'l -4 8 l 8 0 z',
    }[朝] || 'l -8 -4 l 0 8 z';
    const h = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    h.setAttribute('d', `M ${x} ${y} ${型}`);
    h.setAttribute('fill', 颜色);
    if (自) h.dataset.自 = 自;
    if (到) h.dataset.到 = 到;
    层.appendChild(h);
  };

  // 落点：每个「实例 + 脚本名」对应哪一行 DOM。
  // 线要落在这一行上，不落在实例框整条边上 —— b459：「先连到脚本边框，再连到外面」。
  const 行表 = new Map();
  for (const 框el of 网.层.querySelectorAll('.实例框')) {
    const 实id = 框el.dataset.id;
    for (const 行框 of 框el.querySelectorAll('.脚本框'))
      行表.set(实id + '\u0001' + String(行框.dataset.名 || '').replace(/\[\d+\]$/, ''), 行框);
  }
  // DOM 屏幕坐标 → #world 坐标（#world 有 translate+scale，origin 0 0）
  const 世界r = 世界.getBoundingClientRect();
  const 换算 = el => {
    const r = el.getBoundingClientRect();
    const z = 视.z || 1;
    return { 左: (r.left - 世界r.left) / z, 右: (r.left + r.width - 世界r.left) / z,
             上: (r.top - 世界r.top) / z, 下: (r.top + r.height - 世界r.top) / z,
             中y: (r.top + r.height / 2 - 世界r.top) / z,
             中x: (r.left + r.width / 2 - 世界r.left) / z };
  };

  for (const 实 of 网.实例们) {
    const 源 = 框位.get(实.id);
    if (!源) continue;
    // 每个出口记住它属于哪个脚本的第几个口 —— 那是线的落点
    const 出 = [];
    for (const s of 实.脚本 || [])
      for (let k = 0; k < (s.出口 || []).length; k++) {
        const 出口 = s.出口[k];
        if (!出口.到 || 出口.到 === 实.id) continue;
        if (!框位.has(出口.到)) continue;
        出.push({ s, k, 出口 });
      }
    if (!出.length) continue;

    for (let i = 0; i < 出.length; i++) {
      const { s, k, 出口 } = 出[i];
      const 的 = 框位.get(出口.到);

      // 源点：这个脚本那一行右边第 k 个圆点。
      // 找得到就用它 —— 这样箭头扎在哪一行，就是哪个脚本在伸手。
      const 源行 = 行表.get(实.id + '\u0001' + String(s.名 || '').replace(/\[\d+\]$/, ''));
      const 源点们 = 源行 ? 源行.querySelectorAll('.脚本口 i') : null;
      const 源点 = 源点们 && 源点们[k] ? 源点们[k] : (源行 || null);

      // 终点：目标框里挂着「到类型」那一行的左边。找不到这一行就不连线 ——
      // 那种出口连的是 Unity 内置组件（Rigidbody / Renderer…），不是用户脚本，
      // 交给下面的「组件空头」处理。
      const 目标行 = 行表.get(出口.到 + '\u0001' + String(出口.到类型 || ''));
      if (!目标行) continue;

      const a = 源点 ? 换算(源点) : null;
      const b = 换算(目标行);
      const 连 = 连哪边(源, 的);
      // 方向要用**端点**算，不能用框算。
      // 用框算得出「往右」，但起点取的是那一行的左边、终点在右边时，
      // 曲线的控制点会朝右伸 —— 正好伸进自己框里，线从框内部穿出去（实测 Cube→enemy）。
      const 往右 = a ? (b.中x >= a.中x) : 连.往右;
      let x1, y1, x2, y2, 朝;

      if (连.竖) {
        x1 = a ? a.中x : Math.round(源.x + 源.w * ((i + 1) / (出.length + 1)));
        y1 = a ? (连.往下 ? a.下 : a.上) : (连.往下 ? 源.y + 源.h : 源.y);
        x2 = b.中x;
        y2 = 连.往下 ? b.上 : b.下;
        朝 = 连.往下 ? '下' : '上';
      } else {
        x1 = a ? (往右 ? a.右 : a.左) : 连.x1;
        y1 = a ? a.中y : Math.round(源.y + 源.h / 2);
        x2 = 往右 ? b.左 : b.右;
        y2 = b.中y;
        朝 = 往右 ? '右' : '左';
      }
      const d = 选走线(x1, y1, x2, y2, 框位, 实.id, 出口.到, 连.竖);
      const p = 画一条(d, '#7a6a3f', 1.2, 实.id, 出口.到);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      t.textContent = (s.名 || '') + ' · ' + (出口.名 || '') + (出口.条件 ? ' — ' + 出口.条件 : '') + ' → ' + (出口.到类型 || '');
      p.appendChild(t);
      画箭头(x2, y2, '#7a6a3f', 实.id, 出口.到, 朝);
    }
  }


  // 人指定的线：你在空头框上右键说「它其实连到谁」。
  // 用虚线画 —— 扫描出来的那些是事实，这条是你说的，得一眼分得开。
  for (const 线 of 网.人线们 || []) {
    const 源 = 框位.get(线.自);
    const 的 = 框位.get(线.到);
    if (!源 || !的) continue;
    const 连 = 连哪边(源, 的);
    let x1, y1, x2, y2, 朝;
    if (连.竖) {
      x1 = Math.round(源.x + 源.w * 0.5);
      y1 = 连.往下 ? 源.y + 源.h : 源.y;
      x2 = Math.round(的.x + 的.w * 0.5);
      y2 = 连.往下 ? 的.y : 的.y + 的.h;
      朝 = 连.往下 ? '下' : '上';
    } else {
      x1 = 连.x1; y1 = 源.y + 实例头高 + 10;
      x2 = 连.x2; y2 = 的.y + 的.h / 2;
      朝 = 连.往右 ? '右' : '左';
    }
    const d = 选走线(x1, y1, x2, y2, 框位, 线.自, 线.到, 连.竖);
    const p = 画一条(d, '#6fb98d', 1.4, 线.自, 线.到, '6 4');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    t.textContent = '你指定的连接：' + (线.说明 || '');
    p.appendChild(t);
    画箭头(x2, y2, '#6fb98d', 线.自, 线.到, 朝);
  }

  // 空头：从「伸出去的那个口」连到空头框。
  // 不画箭头 —— 它本来就是「接不上的那一截」，画个箭头就成接上了。
  //
  // ⚠️ 起点不能再用实例框的底边。组件头是某个具体脚本的第 k 个出口长出来的，
  //    从框底出去的话，一根红虚线会横穿下面所有的框（实测直接扎穿 coin），
  //    而且看不出是哪个脚本伸的手。起点跟着那一行的第 k 个圆点走。
  for (const 空 of 网.空头们 || []) {
    if (空.申诉 === '正常') continue;   // 你说是误报的，就别再画这根刺
    const 源 = 框位.get(空.自);
    const 的 = 框位.get(空.id);
    if (!源 || !的) continue;

    let x1 = 源.x + 源.w / 2, y1 = 源.y + 源.h;
    const 源行 = 空.脚本名 ? 行表.get(空.自 + '\u0001' + String(空.脚本名).replace(/\[\d+\]$/, '')) : null;
    if (源行) {
      const 点们 = 源行.querySelectorAll('.脚本口 i');
      const 点 = 点们 && 点们[空.口 || 0] ? 点们[空.口 || 0] : null;
      if (点) { const a = 换算(点); x1 = a.右; y1 = a.中y; }
      else { const a = 换算(源行); x1 = a.右; y1 = a.中y; }
    }

    const x2 = 的.x + 的.w / 2, y2 = 的.y;
    const my = (y1 + y2) / 2;
    const 色 = 空.种类 === '组件' ? '#5a6f8a' : '#d96464';
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 色);
    p.setAttribute('stroke-width', 空.种类 === '组件' ? '1.4' : '2.2');
    p.setAttribute('stroke-dasharray', 空.种类 === '组件' ? '3 4' : '6 4');
    p.setAttribute('opacity', '0.9');
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    t.textContent = 空.种类 === '组件'
      ? (空.脚本名 || '') + ' 的这个口连到 Unity 组件 ' + (空.字段 || '')
      : (空.字段 || '') + ' —— 这里没有接应';
    p.appendChild(t);
    层.appendChild(p);
  }
}

function 名短(id) {
  if (!id) return '';
  const 实 = 网.实例们.find(x => x.id === id);
  return 实 ? (实.名 || id) : String(id).split('|').pop();
}

// 拖完把位置交给壳。只写 布局 表 —— 那是你摆的，不是扫出来的。
function 存布局() {
  if (!有壳()) return;
  const 项 = [];
  for (const [id, 位] of 网.位置) 项.push({ id, x: 位.x, y: 位.y });
  if (!项.length) return;
  window.chrome.webview.postMessage({ 命令: '存布局', 项 });
}

function 拉关系图() {
  if (!有壳()) return;
  window.chrome.webview.postMessage({ 命令: '关系图数据' });
}

// ══════════════════════════════════════════════════════════════
// 窗户：脚本框张开之后，里面那块独立画布
//
// 这是你说的第三级。判据跟网状图一个（不是倍率，是屏幕字号）：
//   正文字号 14px × 外层 视.z  ≥ 24px  →  这扇窗够大了，能当编辑器用
// 到了才让开 —— 不够大的时候开出来也是一团糊。
//
// 开出来之后，块画在 内世界 里，它自己一套 scale（内视），
// 跟外面那张关系网各管各的。网还在，只是这一格被裁了。
// ══════════════════════════════════════════════════════════════
const 窗 = { 脚本: null, 实例: null, el: null, 内: null, 内视: { x: 0, y: 0, z: 1 } };

// 判据：这个实例框在屏幕上占多宽。占满（≥80% 舞台宽）才让内部变成画布 ——
// 这是「当这个框占满屏幕后」那句话的直接翻译，不是拍脑袋的倍率。
function 框够大(实例el) {
  if (!实例el) return false;
  const r = 实例el.getBoundingClientRect();
  const 台 = 舞台.getBoundingClientRect();
  return r.width >= 台.width * 0.8;
}

function 应用内视() {
  if (!窗.内) return;
  // ⚠️ 内视.x/y 存的是**屏幕像素**（鼠标拖多少就是多少），
  //    但这个元素长在 #world 里，#world 自己有 scale(视.z) ——
  //    直接写成 px 会被外层再放大一次。实测：拖 80px，内容在屏幕上跑 160px，
  //    所以内层拖动「太快」。落成 CSS 之前除掉外层缩放，两边都是屏幕像素。
  const 外z = 视.z || 1;
  窗.内.style.setProperty('--内x', (窗.内视.x / 外z) + 'px');
  窗.内.style.setProperty('--内y', (窗.内视.y / 外z) + 'px');
  窗.内.style.setProperty('--内z', 窗.内视.z);
}

function 关窗() {
  const 体 = 窗.体;
  if (体) {
    体.textContent = '';
    体.classList.remove('编辑中');
    for (const n of (窗.原内容 || [])) 体.appendChild(n);
  }
  for (const el of (窗.头标 || [])) el.remove();
  // 开窗时定死的宽高要清掉，不然收起来还是那块大方框
  const 实el = 窗.实例 ? document.querySelector('.实例框[data-id="' + CSS.escape(窗.实例) + '"]') : null;
  if (实el) { 实el.style.width = ''; 实el.style.height = ''; }
  if (窗.头钮) 窗.头钮.style.display = '';
  requestAnimationFrame(窗口改了就重排);
  当前画布 = null;
  窗.el = null; 窗.内 = null; 窗.体 = null;
  窗.原内容 = null; 窗.头标 = null; 窗.头钮 = null;
  窗.脚本 = null; 窗.实例 = null;
}

function 开窗(实例el, 脚本名) {
  if (窗.脚本 === 脚本名) { 关窗(); return; }

  // 不再硬拦「框够不够大」。点了就开 —— 框小画布就小，用户自己会放大。
  // 拦着的话点下去什么都不发生，看着就是坏了。
  if (!工程表[脚本名]) {
    网提示('这个脚本还没有块树：' + 脚本名);
    return;
  }

  const 体 = 实例el.querySelector(':scope > .实例体');
  if (!体) { 网提示('这个实例框没有内容区'); return; }

  // 框在 #world 里，尺寸是 CSS 单位，屏幕上还要乘 视.z。
  // 所以要「屏幕上占舞台 92%」，CSS 就得是 舞台宽/视.z。
  // 高度按屏幕比例走 —— 这样开出来的画布是屏幕的形状，不是方的。
  const 台r = 舞台.getBoundingClientRect();
  const 外z = 视.z || 1;
  const 屏比 = (window.innerWidth || 1400) / (window.innerHeight || 900);
  const 框CSS宽 = Math.round(台r.width * 0.92 / 外z);
  实例el.style.width = 框CSS宽 + 'px';
  实例el.style.height = Math.round(框CSS宽 / 屏比) + 'px';

  关窗();
  窗.脚本 = 脚本名; 窗.实例 = 实例el.dataset.id;
  窗.体 = 体;
  窗.原内容 = [...体.childNodes];        // 关窗时放回去
  窗.内视 = { x: 16, y: 16, z: 1 };

  体.textContent = '';
  体.classList.add('编辑中');

  // 画布：撑满 .实例体。它就在框内部，不是浮在上面的。
  const w = document.createElement('div');
  w.className = '窗户';
  const 内 = document.createElement('div');
  内.className = '内世界';
  w.appendChild(内);
  体.appendChild(w);
  窗.el = w; 窗.内 = 内;
  // ⚠️ 滚轮缩放 + 拖空白平移，在这里挂一次就够 ——
  //    挂在外面调用点上的话，漏掉任何一个入口（比如「✎ 编辑」按钮）
  //    那扇窗就既缩不动也拖不动。这个坑踩过：从脚本名进来能用，从 ✎ 进来死的。
  装窗缩放();

  // 框头上标一下现在在编辑哪个脚本，旁边一个返回
  const 头 = 实例el.querySelector(':scope > .实例头');
  if (头) {
    const 标 = document.createElement('span');
    标.className = '正在编';
    标.textContent = '正在编 ' + 脚本名;
    const 返 = document.createElement('span');
    返.className = '编钮';
    返.textContent = '← 返回';
    返.title = '收起编辑器，回到脚本列表';
    返.addEventListener('click', e => { e.stopPropagation(); 关窗(); });
    const 原编 = 头.querySelector('.编钮');
    if (原编) 原编.style.display = 'none';
    头.appendChild(标); 头.appendChild(返);
    窗.头钮 = 原编;
    窗.头标 = [标, 返];
  }

  // 把当前工程换成这个脚本，重画 —— 重画会挂到 当前画布，也就是 内世界
  当前画布 = 内;
  切到工程(脚本名);
  布局(根块们);
  requestAnimationFrame(窗口改了就重排);

  // 先缩到整棵树装得下，用户再自己滚
  requestAnimationFrame(() => {
    布局(根块们);
    let 左 = Infinity, 上 = Infinity, 右 = 0, 下 = 0;
    for (const el of 内.querySelectorAll(':scope > .blk')) {
      const l = parseFloat(el.style.left) || 0, t = parseFloat(el.style.top) || 0;
      左 = Math.min(左, l); 上 = Math.min(上, t);
      右 = Math.max(右, l + el.offsetWidth);
      下 = Math.max(下, t + el.offsetHeight);
    }
    if (!(右 > 0 && 下 > 0)) return;
    if (!isFinite(左)) 左 = 0;
    if (!isFinite(上)) 上 = 0;
    const 边 = 12;
    const 宽 = w.offsetWidth || 400, 高 = w.offsetHeight || 300;
    const 内容宽 = Math.max(1, 右 - 左), 内容高 = Math.max(1, 下 - 上);
    const 真z = Math.max(0.02, Math.min((宽 - 边 * 2) / 内容宽, (高 - 边 * 2) / 内容高, 1));
    // ⚠️ 光设 z 不够。块的内世界坐标不一定从 0 开始 —— 拖过的块可以到几千，
    //    只把偏移写成 {边, 边} 就等于「把 x=1000 的块放到屏幕 x=12」，照样在窗外。
    //    开出来的窗一片黑，看着像「块没了」，其实是视野没对准内容。
    //    要把包围盒左上角搬到 (边, 边)：屏幕上 内视.x + 块x×z = 边。
    //    内视.x 是屏幕像素，而 --内x 用的是它除过 外z 的 CSS 值，所以这里乘回去。
    const 外z = 视.z || 1;
    窗.内视 = { x: (边 - 左 * 真z) * 外z, y: (边 - 上 * 真z) * 外z, z: 真z };
    应用内视();
  });
}

// 在窗户里滚轮 = 缩窗户里的世界。按 Shift 才算外层。
// 跟设计稿一个分工：鼠标在哪层缩哪层。
function 装窗缩放() {
  const 框 = 窗.el;
  if (!框 || 框._绑了) return;
  框._绑了 = true;
  框.addEventListener('wheel', e => {
    // ⚠️ Shift 交给外层。窗户占了舞台 92%×88%，不留这个口子的话
    //    开窗后鼠标几乎总在窗户上，外层那张网怎么都缩不了 ——
    //    看着就是「缩放被卡住」。设计稿里就是这么分工的。
    if (e.shiftKey) {
      // 窗户浮在 body 上，不在舞台里 —— 事件冒泡不到舞台那个 handler，
      // 所以 Shift 得在这儿自己动手缩外层。
      e.preventDefault();
      e.stopPropagation();
      缩外层(e.clientX, e.clientY, e.deltaY < 0);
      return;
    }
    // 窗户里滚 = 缩窗户里的世界。stopPropagation 挡住外层那张网。
    e.preventDefault();
    e.stopPropagation();
    const r = 框.getBoundingClientRect();
    const 旧z = 窗.内视.z || 1;
    const 新z = Math.min(4, Math.max(0.15, 旧z * (e.deltaY > 0 ? 0.9 : 1.1)));
    // 以光标为中心：光标底下那个点，缩放前后停在原地
    const lx = (e.clientX - r.left - 窗.内视.x) / 旧z;
    const ly = (e.clientY - r.top - 窗.内视.y) / 旧z;
    窗.内视.x = e.clientX - r.left - lx * 新z;
    窗.内视.y = e.clientY - r.top - ly * 新z;
    窗.内视.z = 新z;
    应用内视();
  }, { passive: false });

  // 拖空白 = 平移窗户里的世界。
  // 块自己会 stopPropagation（开始拖里就这么写的），输入框也不会冒到这一层，
  // 所以能走到这儿的，基本就是空白处。
  框.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    // Shift 交给外层 —— 按住 Shift 拖，挪的是整张网，不是这扇窗户里的世界。
    // 设计稿里内层第一句就是 if (e.shiftKey) return;
    if (e.shiftKey) return;
    if (e.target.closest('.blk') || e.target.closest('input') || e.target.closest('textarea')) return;
    e.preventDefault();
    e.stopPropagation();
    const 起 = { x: e.clientX, y: e.clientY, ox: 窗.内视.x, oy: 窗.内视.y };
    框.classList.add('平移中');
    const 移 = ev => {
      // 内视.x/y 是屏幕像素级的平移量（transform 里 translate 在 scale 外面），
      // 所以直接加屏幕位移，不用除缩放。
      窗.内视.x = 起.ox + (ev.clientX - 起.x);
      窗.内视.y = 起.oy + (ev.clientY - 起.y);
      应用内视();
    };
    const 停 = () => {
      框.classList.remove('平移中');
      document.removeEventListener('pointermove', 移);
      document.removeEventListener('pointerup', 停);
    };
    document.addEventListener('pointermove', 移);
    document.addEventListener('pointerup', 停);
  });
}

// 一条界面上看得见的提示，不弹窗（弹窗会卡死整个页面，见下面那个「出错」的注释）
function 网提示(文本) {
  const 条 = document.createElement('div');
  条.className = '网提示';
  条.textContent = 文本;
  世界.appendChild(条);
  setTimeout(() => 条.remove(), 4200);
}

document.getElementById('undoBtn').onclick = () => 撤销();

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;   // 输入框里的撤销留给浏览器
  if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); e.shiftKey ? 重做() : 撤销(); }
  else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); 重做(); }
});

// 有存档就接着上次；没有就建一个空的
if (!读盘()) {
  当前工程 = '未命名';
  工程表[当前工程] = { 块们: [], 改: Date.now() };
  根块们 = [];
}
画标签();
刷新本份标签();
重画();
// 一开始就把视野对准这个工程的块 —— 不然块在画布远处，打开就是一片空白
应用视();
requestAnimationFrame(对准块);
// 有壳就去拉一次网 —— 没有壳的话这一句直接跳过，块编辑器照常
拉关系图();
</script>
</body>
